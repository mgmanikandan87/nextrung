main{max-width:720px;margin:0 auto;padding:22px 16px 64px}

h1{font-size:clamp(28px,6vw,40px);font-weight:700}
h2{font-size:22px;font-weight:700;margin:30px 0 10px}
h3{font-size:18px;font-weight:700;margin:16px 0 8px}
p{margin:0 0 12px;max-width:62ch}
.lead{font-size:18px;color:var(--ink-2);max-width:56ch}

.between{justify-content:space-between}
.free{display:inline-flex;gap:6px;align-items:center;font-weight:600;color:var(--grow);background:var(--grow-soft);padding:6px 12px;border-radius:999px;font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin:10px 0}
.card.rank{border-left:5px solid var(--accent)}
.card h3{margin-top:0}
.cap{font-size:12px;color:var(--ink-3)}
.small{font-size:14px;color:var(--ink-2)}
.pill{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.02em;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.growing,.pill.official,.pill.ok{background:var(--grow-soft);color:var(--grow)}
.pill.steady,.pill.industry,.pill.must{background:var(--steady-soft);color:var(--steady)}
.pill.shrinking,.pill.media,.pill.good{background:var(--shrink-soft);color:var(--shrink)}
.pill.low,.pill.gap{background:var(--neg-soft);color:var(--neg)}
.steps{display:grid;gap:10px;margin:14px 0}
.step{display:grid;grid-template-columns:36px 1fr;gap:12px;align-items:start}
.step b{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-family:var(--mono)}
.q{max-width:600px}
.prog{height:6px;background:var(--line);border-radius:3px;margin:12px 0 18px;overflow:hidden}

.opts{display:grid;gap:8px;margin:12px 0}
.opt{display:flex;align-items:center;gap:12px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;font:inherit;color:var(--ink);width:100%;min-height:52px}

.sk .n{font-weight:600;font-size:16px}

.sk .body{margin-top:8px;font-size:14px;color:var(--ink-2)}

.evf{display:grid;gap:8px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}

li{margin:4px 0}
.list{display:grid;gap:8px}

.src{font-size:13px;color:var(--ink-2)}

th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.tw{overflow-x:auto;margin:10px 0 18px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:9;box-shadow:0 6px 24px rgba(0,0,0,.2);max-width:90vw}

    signOut(); throw new Error('Please sign in again.');

  const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status)); return j;
}

// ---------- matcher and plan (unchanged logic) ----------
function score(path, a) { const hits = []; for (const r of path.fit_rules) { const v = a[r.field]; if (v == null) continue; const m = Array.isArray(v) ? v.includes(r.value) : String(v) === String(r.value); if (m) hits.push(r); } return { path, total: path.base_score + hits.reduce((s, r) => s + r.score, 0), hits: hits.sort((x, y) => y.score - x.score) }; }
const rank = a => PATHS.map(p => score(p, a)).sort((x, y) => y.total - x.total);
function readiness(path, ev) { const sk = path.skills || []; const tot = sk.reduce((s, x) => s + x.weight, 0) || 1; const have = sk.filter(x => ev[x.id]).reduce((s, x) => s + x.weight, 0); const req = sk.filter(x => x.level === 'required'); return { pct: Math.round(have / tot * 100), req: req.length, reqHave: req.filter(x => ev[x.id]).length, total: sk.length, have: sk.filter(x => ev[x.id]).length }; }
function gapOf(path, ev) { return (path.skills || []).filter(x => !ev[x.id]).sort((a, b) => (a.level === b.level ? b.weight - a.weight : a.level === 'required' ? -1 : 1)); }
function plan(path, ev) { const gap = gapOf(path, ev); const months = [[], [], []], later = [], used = [0, 0, 0]; for (const g of gap) { const s = KBY[g.id]; if (!s) continue; const h = Math.min(...s.learning.map(l => l.hours || 20)); const item = { ...g, hours: h }; let placed = false; if (g.level === 'required') { for (let i = 0; i < 3; i++) { if (months[i].length < 3 && (used[i] + h <= 30 || months[i].length === 0)) { months[i].push(item); used[i] += h; placed = true; break; } } } if (!placed) later.push(item); } return { months, later, used, weekly: Math.ceil((used[0] || 0) / 4) }; }
function jobMatch(job, ev) { const seen = new Set(); const m = job.requirements.filter(r => r.skill_id && !seen.has(r.skill_id) && seen.add(r.skill_id)); const met = m.filter(r => ev[r.skill_id]); return { mapped: m.length, met: met.length, missing: m.filter(r => !ev[r.skill_id]), other: job.requirements.filter(r => !r.skill_id).length, pct: m.length ? Math.round(met.length / m.length * 100) : 0 }; }
const trend = p => `<span class="pill ${p.door_state}">${t('trend_' + p.door_state)}</span>`;
function whyLine(r) { const pos = r.hits.filter(h => h.score > 0).slice(0, 2).map(h => lc(h.reason.replace(/\.$/, ''))); return pos.length ? pos.join('; ' + (LANG === 'hi' ? 'और ' : 'and ')) + '.' : clean(r.path.tagline); }
function careLine(r) { const neg = r.hits.filter(h => h.score < 0)[0]; if (neg) return neg.reason; if (r.path.door_state === 'shrinking') return t('shrink_line'); const k = answers.college_tier ? 'tier' + answers.college_tier : 'tier3'; return clean((r.path.tiers_realistic[k] || '').split(/(?<=\.)\s/)[0]); }

const regionOf = loc => { const s = String(loc || '').toLowerCase(); if (/bengaluru|bangalore|chennai|hyderabad|karnataka|tamil|telangana|andhra|kerala|kochi|coimbatore|madurai|mysuru|hosur|vizag|visakhapatnam|tirupati/.test(s)) return 'south'; if (/mumbai|pune|maharashtra|gujarat|ahmedabad|surat|vadodara|sanand|dholera|goa|nashik|nagpur/.test(s)) return 'west'; if (/delhi|noida|gurgaon|gurugram|ncr|uttar pradesh|lucknow|kanpur|punjab|chandigarh|haryana|rajasthan|jaipur|uttarakhand|dehradun|himachal|jammu/.test(s)) return 'north'; if (/kolkata|west bengal|odisha|bhubaneswar|bihar|patna|jharkhand|ranchi|assam|guwahati|manipur/.test(s)) return 'east_ne'; if (/bhopal|indore|madhya|chhattisgarh|raipur/.test(s)) return 'central'; return null; };
const oldAd = j => { if (!j.posted_on || j.source === 'notification') return false; const d = (Date.parse(D.jobs.seen_on) - Date.parse(j.posted_on)) / 86400000; return d > 60; };
const payLine = j => { if (!j.salary_text) return ''; const s = String(j.salary_text); const nums = (s.match(/\d[\d,]*(?:\.\d+)?/g) || []).map(x => Math.round(parseFloat(x.replace(/,/g, '')))); const low = /unpaid|stipend/i.test(s) || (nums.length && /month/i.test(s) && Math.max(...nums) < 15000); const txt = nums.length ? ('₹' + nums.map(n => n.toLocaleString('en-IN')).join(' to ') + (/month/i.test(s) ? '/month' : /year|annum|lpa/i.test(s) ? '/year' : '')) : (/competitive|industry/i.test(s) ? '' : s.slice(0, 40)); return (txt ? ' · ' + txt : '') + (low ? ` · <span class="pill low">${LANG === 'hi' ? 'कम / बिना वेतन' : 'unpaid or low pay'}</span>` : ''); };
function jobCard(j, m) {
  const seen = new Set(); const skills = j.requirements.filter(r => r.skill_id && KBY[r.skill_id] && !seen.has(r.skill_id) && seen.add(r.skill_id)).map(r => KBY[r.skill_id].name);
  return `<div class="jc"><div class="t">${esc(j.company)}</div><div class="d">${esc(j.title)}${j.location ? ' · ' + esc(j.location) : ''}${payLine(j)}${j.posted_on ? ' · ' + esc(t(j.source === 'notification' ? 'notif' : 'posted')) + ' ' + esc(j.posted_on) : ''}${oldAd(j) ? ` · <span class="pill good">${esc(t('may_closed'))}</span>` : ''}</div>
    ${m ? `<div class="mbar"><i style="width:${m.pct}%"></i></div><div class="small"><b>${esc(t('j_match', { a: m.met, b: m.mapped }))}</b>${m.missing.length ? ` · ${esc(t('j_missing'))}: ${esc(m.missing.slice(0, 4).map(r => KBY[r.skill_id] ? KBY[r.skill_id].name : r.text).join(', '))}${m.missing.length > 4 ? ' +' + (m.missing.length - 4) : ''}` : ''}${m.other ? ` · +${m.other} ${esc(LANG === 'hi' ? 'और बातें विज्ञापन में' : (m.other === 1 ? 'other thing in the ad' : 'other things in the ad'))}` : ''}</div>` : `<div class="small" style="margin-top:6px"><b>${esc(t('asks'))}:</b> ${esc(skills.join(', '))}${j.requirements.some(r => !r.skill_id) ? ` <span class="cap">+${j.requirements.filter(r => !r.skill_id).length}</span>` : ''}</div>`}
    <a class="btn sm ghost" style="margin-top:10px" href="${esc(j.url)}" target="_blank" rel="noopener" data-job="${esc(j.id)}">${esc(t('j_open'))}</a></div>`;
}

async function publicPage(slug) {
  setNav(''); app.innerHTML = '<p class="cap">…</p>';
  let d; try { d = await api('public/' + encodeURIComponent(slug)); } catch (e) { app.innerHTML = `<h2 style="margin-top:0">Not found</h2><p>This page is private or does not exist.</p>`; return; }
  const u = d.user, ev = d.evidence || {}; const primary = PBY[u.primary_path] || PBY[(u.ranking || [{}])[0].id]; if (!primary) { app.innerHTML = '<p>Nothing to show yet.</p>'; return; }
  const rd = readiness(primary, ev);
  app.innerHTML = `<div class="row between" style="align-items:flex-start"><div><h1 style="font-size:clamp(24px,5vw,34px)">${esc(u.name || (LANG === 'hi' ? 'एक इंजीनियर' : 'An engineer (name not set)'))}</h1><p class="lead" style="margin:6px 0">${esc(u.headline || '')}</p><p class="small">${esc(u.college || '')} ${u.answers && u.answers.branch ? '· ' + esc(LABEL['branch:' + u.answers.branch]) : ''} ${u.answers && u.answers.graduation_year ? '· ' + esc(LABEL['graduation_year:' + u.answers.graduation_year]) : ''}</p></div><div style="text-align:center;font-size:12px"><div class="ring" style="--p:${rd.pct}"><b>${rd.pct}%</b></div><div style="margin-top:4px">${esc(primary.name)}</div></div></div>
    <p class="small">${rd.have} of ${rd.total} skills for <a href="#/path/${primary.id}">${esc(primary.name)}</a> shown with proof (${rd.reqHave} of ${rd.req} must-haves). Every item links to the proof.</p>
    <h2>Proof</h2>${(primary.skills || []).filter(x => ev[x.id]).map(x => { const s = KBY[x.id], e = ev[x.id]; return `<div class="sk"><div class="h"><div class="st done">✓</div><div><div class="n">${esc(s.name)} <span class="pill ${x.level === 'required' ? 'must' : 'good'}">${x.level === 'required' ? 'must have' : 'good to have'}</span></div><div class="small"><a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.url)}</a> ${e.note ? '· ' + esc(e.note) : ''} <span class="cap">· ${esc((e.added || '').slice(0, 10))}</span></div></div></div></div>`; }).join('') || '<p class="small">No proof yet.</p>'}
    <h2>Working on next</h2><div class="chips">${gapOf(primary, ev).slice(0, 8).map(x => `<span class="chip">${esc(KBY[x.id] ? KBY[x.id].name : x.id)}</span>`).join('')}</div>
    <p class="cap" style="margin-top:22px">${u.updated ? 'Updated ' + esc(String(u.updated).slice(0, 10)) + '. ' : ''}Made on <a href="#/">NextRung</a>, free and open source. <a href="#/quiz">Make yours</a>.</p>`;
}

function pathsList() {
  setNav('paths'); const order = [...PATHS].sort((a, b) => b.base_score - a.base_score);
  app.innerHTML = `<h1 style="font-size:clamp(24px,5vw,32px)">${esc(t('paths_h'))}</h1><p class="lead">${esc(t('paths_lead'))}</p>
  <div class="list" style="margin-top:14px">${order.map(p => `<a class="pathrow" href="#/path/${p.id}"><span><span class="t">${esc(p.name)}</span><br><span class="d">${esc(clean(p.tagline))}</span></span>${trend(p)}</a>`).join('')}</div>`;
}

function pathPage(id) {
  setNav('paths'); const p = PBY[id]; if (!p) { app.innerHTML = '<p>No such route.</p>'; return; }
  const fb = PBY[p.fallback_path_id]; const ev = (me && me.evidence) || {}; const jobs = JOBS.filter(j => j.path_id === p.id);
  const tier = answers.college_tier ? 'tier' + answers.college_tier : null; const sources = [...new Set(p.stat_ids_used || [])].filter(i => SBY[i]);
  const bl = {CS:'CS/AI/DS',IT:'IT',ECE:'ECE',EE:'EE',MECH:'Mech',CIVIL:'Civil',CHEM:'Chem/Bio/Met',OTHER:'Other'};
  app.innerHTML = `
    <div class="row between" style="align-items:flex-start"><h1 style="font-size:clamp(24px,5vw,34px)">${esc(p.name)}</h1>${trend(p)}</div>
    <p class="lead" style="margin-top:8px">${esc(clean(p.tagline))}</p>

    <div class="row"><div class="card" style="flex:1;min-width:200px"><div class="eyebrow">${esc(t('pay'))}</div><div style="font-family:var(--mono);font-size:22px">${p.pay_band.low_lpa != null ? `₹${p.pay_band.low_lpa} to ${p.pay_band.high_lpa} lakh/yr` : '—'}</div><p class="cap" style="margin:6px 0 0">${esc(clean(p.pay_band.note))}</p></div>
      <div class="card" style="flex:1;min-width:200px"><div class="eyebrow">${esc(t('jobs_year'))}</div><div style="font-family:var(--mono);font-size:22px">${p.door_size.people_per_year != null ? inr(p.door_size.people_per_year) : '—'}</div><p class="cap" style="margin:6px 0 0">${esc(clean(p.door_size.caveat))}</p></div></div>
    <h2>${esc(t('musts_h'))}</h2>
    <div class="chips">${(p.skills || []).map(x => { const s = KBY[x.id]; return s ? `<span class="chip ${ev[x.id] ? 'done' : ''}">${esc(s.name)}${x.level === 'required' ? ' <span class="cap">· must</span>' : ''}</span>` : ''; }).join('')}</div>
    <p class="small" style="margin-top:10px">${esc(LANG === 'hi' ? 'कंपनियाँ अभी क्या माँगती हैं:' : 'What employers check right now:')}</p><ul class="clean small">${p.entry_requirements.map(x => `<li>${esc(clean(x))}</li>`).join('')}</ul>
    <a class="btn wide" href="#/plan/${p.id}">${esc(t('get_plan'))}</a>
    <p class="small" style="margin-top:14px"><b>${esc(LANG === 'hi' ? 'किन ब्रांच के लिए:' : 'Best for:')}</b> ${esc(Object.keys(bl).filter(b => (p.branches[b] ?? 0) >= 2).map(b => bl[b]).join(', ') || '—')}${Object.keys(bl).some(b => (p.branches[b] ?? 0) === 0) ? ` · <b>${esc(LANG === 'hi' ? 'शायद ही:' : 'Rarely:')}</b> ${esc(Object.keys(bl).filter(b => (p.branches[b] ?? 0) === 0).map(b => bl[b]).join(', '))}` : ''}</p>
    <h2>${esc(t('ads_h'))} · ${jobs.length}</h2>${jobs.slice(0, 6).map(j => jobCard(j, null)).join('')}${jobs.length > 6 ? `<p class="small"><a href="#/jobs/${p.id}">${esc(LANG === 'hi' ? 'सभी देखें' : 'See all')} ${jobs.length}</a></p>` : ''}
    ${fb ? `<p class="small" style="margin-top:14px"><b>${esc(t('backup'))}:</b> <a href="#/path/${fb.id}">${esc(fb.name)}</a></p>` : ''}
    <h2>${esc(t('more_h'))}</h2>
    <details><summary>${esc(t('hiring_h'))}</summary><div class="in">${p.employers.map(e => `<div class="small" style="margin:8px 0"><a href="${esc(e.source_url)}" target="_blank" rel="noopener"><b>${esc(e.name)}</b></a> · ${esc(e.location)}<br>${esc(e.roles)} <span class="cap">· ${esc(e.seen_on)}</span></div>`).join('')}</div></details>
    <details><summary>${esc(t('two_year'))}</summary><div class="in">${p.two_year_plan.map(b => `<h4>${esc(b.block)} · ${esc(b.title)}</h4><b>Learn</b><ul>${b.learn.map(x => `<li>${esc(clean(x))}</li>`).join('')}</ul><b>Build</b><ul>${b.build.map(x => `<li>${esc(clean(x))}</li>`).join('')}</ul><b>Show</b><ul>${b.evidence.map(x => `<li>${esc(clean(x))}</li>`).join('')}</ul><b>Target</b><ul>${b.target.map(x => `<li>${esc(clean(x))}</li>`).join('')}</ul>`).join('')}</div></details>
    <details><summary>${esc(t('project'))}</summary><div class="in"><p><b>${esc(p.evidenced_project_spec.title)}</b></p><p>${esc(clean(p.evidenced_project_spec.scope))}</p><p><b>Domain.</b> ${esc(p.evidenced_project_spec.domain)}</p><p><b>Using AI to build it.</b> ${esc(p.evidenced_project_spec.agent_use)}</p><p><b>Done looks like.</b> ${esc(p.evidenced_project_spec.done_looks_like)}</p><p><b>Checked by.</b> ${esc(p.evidenced_project_spec.verification)}</p></div></details>
    <details><summary>${esc(t('ai_h'))}</summary><div class="in">${p.ai_task_shift.map(r => `<div style="margin:10px 0"><b>${esc(r.task_2019)}</b><br><span class="small">Now: ${esc(r.now)}</span><br><span class="small">You still own: ${esc(r.human_owns)}</span></div>`).join('')}</div></details>
    <details><summary>${esc(t('rules_h'))}</summary><div class="in"><p class="cap">Base ${p.base_score} of 10 for how many fresher jobs exist this year, then these rules against your answers.</p>${p.fit_rules.map(r => `<div class="small" style="margin:6px 0"><span style="font-family:var(--mono);color:${r.score > 0 ? 'var(--grow)' : 'var(--neg)'}">${r.score > 0 ? '+' : ''}${r.score}</span> <b>${esc(LABEL[r.field + ':' + r.value] || r.value)}</b>: ${esc(r.reason)}</div>`).join('')}</div></details>
    <details><summary>${esc(t('sources_h'))}</summary><div class="in"><ul class="src">${sources.map(i => { const s = SBY[i]; return `<li><a href="${esc(s.source_url || '#')}" target="_blank" rel="noopener">${esc(s.source_title || i)}</a> <span class="cap">(${esc(s.period)}) <span class="pill ${s.confidence}">${s.confidence}</span></span></li>`; }).join('')}</ul><p class="cap">Last reviewed ${esc(p.last_reviewed)}.</p></div></details>`;
  app.querySelectorAll('[data-job]').forEach(a => a.addEventListener('click', () => track('job_opened', { id: a.dataset.job })));
}

function jobsPage(pathId, filter) {
  setNav('jobs'); const f = (filter || '').toLowerCase();
  const ev = (me && me.evidence) || {}; const sel = pathId && PBY[pathId] ? pathId : '';
  const list = JOBS.filter(j => (!sel || j.path_id === sel) && (!f || (j.company + ' ' + j.title + ' ' + (j.location || '') + ' ' + j.requirements.map(r => (r.skill_id && KBY[r.skill_id] ? KBY[r.skill_id].name : r.text)).join(' ')).toLowerCase().includes(f)));
  app.innerHTML = `<h1 style="font-size:clamp(24px,5vw,32px)">${esc(t('jobs_h'))}</h1><p class="lead">${esc(t('jobs_lead', { d: D.jobs.seen_on }))}</p>
    <div class="row"><select id="jp" style="flex:1;min-width:160px"><option value="">${esc(t('all_routes'))}</option>${PATHS.map(p => `<option value="${p.id}" ${p.id === sel ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select><input id="jf" placeholder="${esc(t('filter'))}" value="${esc(filter || '')}" style="flex:2;min-width:180px"></div>
    <p class="cap" style="margin-top:8px">${list.length}</p>
    ${list.map(j => jobCard(j, signedIn() && me ? jobMatch(j, ev) : null)).join('')}`;
  document.getElementById('jp').addEventListener('change', e => { location.hash = '#/jobs/' + e.target.value; });
  const inp = document.getElementById('jf'); inp.addEventListener('input', () => { const pos = inp.selectionStart; jobsPage(sel, inp.value); const n = document.getElementById('jf'); n.focus(); n.setSelectionRange(pos, pos); });
  app.querySelectorAll('[data-job]').forEach(a => a.addEventListener('click', () => track('job_opened', { id: a.dataset.job })));
}

function sources(filter) {
  setNav(''); const groups = [['supply', 'Supply: how many engineers India produces'], ['demand', 'Demand: entry-level tech hiring'], ['paths', 'Paths: the other doors'], ['gap', 'Gaps: numbers we could not source']]; const f = (filter || '').toLowerCase();
  const rows = g => STATS.filter(s => s.id.startsWith(g + '.') && (!f || (s.metric + ' ' + s.source_title + ' ' + s.period).toLowerCase().includes(f)));
  app.innerHTML = `<h1 style="font-size:clamp(24px,5vw,32px)">Every number on this site, with where it came from</h1>
    <p class="lead">${STATS.length} records. <span class="pill official">official</span> government or company filings; <span class="pill industry">industry</span> NASSCOM, staffing firms, research labs; <span class="pill media">media</span> press reporting an official figure; <span class="pill low">low</span> aggregator or unverified.</p>
    <p><input id="ev-filter" placeholder="Filter, e.g. GCC, PLFS, fresher" value="${esc(filter || '')}" style="width:100%;max-width:420px"></p>
    ${groups.map(([g, ttl]) => { const r = rows(g); return r.length ? `<h2>${ttl}</h2><div class="tw"><table><thead><tr><th>Metric</th><th>Value</th><th>Period</th><th>Source</th></tr></thead><tbody>${r.map(s => `<tr><td>${esc(s.metric)}${s.contradiction ? `<br><span class="cap">Contradiction: ${esc(s.contradiction)}</span>` : ''}</td><td style="font-family:var(--mono);white-space:nowrap">${fmt(s)}</td><td class="cap">${esc(s.period)}</td><td>${s.source_url ? `<a href="${esc(s.source_url)}" target="_blank" rel="noopener">${esc(s.source_title)}</a>` : '—'} <span class="pill ${s.confidence}">${s.confidence}</span></td></tr>`).join('')}</tbody></table></div>` : ''; }).join('')}`;
  const inp = document.getElementById('ev-filter'); inp.addEventListener('input', () => { const pos = inp.selectionStart; sources(inp.value); const n = document.getElementById('ev-filter'); n.focus(); n.setSelectionRange(pos, pos); });
}

function about() {
  setNav('');
  app.innerHTML = `<h1 style="font-size:clamp(24px,5vw,32px)">${esc(LANG === 'hi' ? 'NextRung क्यों है' : 'Why NextRung exists')}</h1>
  <p class="lead">India produces about 8 lakh engineering degree holders a year. The big IT companies that hired 4 lakh freshers in FY22 hired 1.6 lakh in FY24, and AI now does the routine work that was a fresher's first job. Most graduates are told to walk through a door that is closing. NextRung shows the doors that are open, what each asks for, and the shortest free route to prove you are ready.</p>
  <h2>Who made this</h2>
  <p>Started by Manikandan M G, an engineering leader in Bengaluru who has hired and built teams of hundreds of engineers and watched AI change what a fresher must show to get hired. It is open source; contributors are welcome, especially placement officers, hiring managers and recent graduates.</p>
  <h2>Honesty rules</h2>
  <p>Free, no course, no fees, ever. Not a job board and not a guarantee. Every number has a source and a date. Projections are called projections. Where two good sources disagree, both are shown. Where no number exists, we say so. The ranking is a set of written rules you can read on each route page, not a chatbot.</p>
  <h2>Your data</h2>
  <p>Answers stay in your browser until you sign in. With an account, your answers, plan and proof links are saved so you can come back. Sign-in is a one-time code by email; there is no password. Your page is private unless you switch it on, and it never shows your email. You can delete everything from Settings.</p>
  <h2>How it is kept up to date</h2>
  <p>Four agent skills refresh the content: statistics from primary sources (no number without a URL), the route records, the skills and free learning links (every link opened before it is listed), and fresher job ads mapped to skills. Changes are reviewed by people before they go live.</p>
  <p class="cap">Version ${SITE_VERSION}, September 2026.</p>`;
}

function route() {
  const h = location.hash.replace(/^#\/?/, ''); const [r, a] = h.split('/'); window.scrollTo({ top: 0 }); applyChrome();
  if (!r) return home();
  if (r === 'quiz') return quiz(parseInt(a || '0', 10) || 0);
  if (r === 'results') return results();
  if (r === 'plan') return planPreview(a);
  if (r === 'signin') return signin();
  if (r === 'me') return mePage(a);
  if (r === 'p') return publicPage(decodeURIComponent(a || ''));
  if (r === 'paths') return pathsList();
  if (r === 'path') return pathPage(a);
  if (r === 'jobs') return jobsPage(a, '');
  if (r === 'sources' || r === 'evidence') return sources('');
  if (r === 'about') return about();
  home();
}
window.addEventListener('hashchange', route);
route();
</script>
