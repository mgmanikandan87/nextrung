<title>NextRung</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F6F7F4; --surface:#FFFFFF; --ink:#1B2A4A; --ink-2:#4B5768; --ink-3:#7C8797; --line:#DDE1DA;
  --accent:#0E7C6B; --accent-ink:#FFFFFF; --accent-soft:#E3F1EC;
  --grow:#1E7F4F; --grow-soft:#E1F2E7; --steady:#4F6B8F; --steady-soft:#E6ECF4; --shrink:#B7600A; --shrink-soft:#F8E9D8;
  --neg:#A63D2F; --neg-soft:#F6E3DF;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",sans-serif; --body:"IBM Plex Sans","Segoe UI",Helvetica,Arial,sans-serif; --mono:"IBM Plex Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F151E; --surface:#161E29; --ink:#E7EAF0; --ink-2:#B4BCC8; --ink-3:#7F8A9A; --line:#2A3441;
  --accent:#3FB59F; --accent-ink:#0B1A16; --accent-soft:#16302B;
  --grow:#5CC98A; --grow-soft:#16301F; --steady:#8FB0DA; --steady-soft:#1B2738; --shrink:#E5A25A; --shrink-soft:#3A2A14;
  --neg:#E2867A; --neg-soft:#3A2220;
}}
:root[data-theme="dark"]{
  --bg:#0F151E; --surface:#161E29; --ink:#E7EAF0; --ink-2:#B4BCC8; --ink-3:#7F8A9A; --line:#2A3441;
  --accent:#3FB59F; --accent-ink:#0B1A16; --accent-soft:#16302B;
  --grow:#5CC98A; --grow-soft:#16301F; --steady:#8FB0DA; --steady-soft:#1B2738; --shrink:#E5A25A; --shrink-soft:#3A2A14;
  --neg:#E2867A; --neg-soft:#3A2220;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;margin:0}
a{color:var(--accent)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .in{max-width:860px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:-.01em;text-decoration:none;color:var(--ink)}
.brand small{font-family:var(--body);font-weight:500;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-left:8px}
nav{display:flex;gap:2px;flex-wrap:wrap;justify-content:flex-end}
nav a{font-size:14px;font-weight:500;color:var(--ink-2);text-decoration:none;padding:6px 9px;border-radius:6px;white-space:nowrap}
nav a.on{background:var(--accent-soft);color:var(--accent)}
nav a.me{border:1.5px solid var(--accent);color:var(--accent)}
main{max-width:860px;margin:0 auto;padding:24px 16px 64px}
h1,h2,h3,h4{font-family:var(--display);letter-spacing:-.015em;line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(28px,5.5vw,42px);font-weight:700}
h2{font-size:23px;font-weight:700;margin-top:34px;margin-bottom:12px}
h3{font-size:18px;font-weight:700;margin-top:18px;margin-bottom:8px}
h4{font-size:15px;font-weight:700;margin:12px 0 6px}
p{margin:0 0 12px;max-width:68ch}
.lead{font-size:18px;color:var(--ink-2);max-width:62ch}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:15px;border:0;border-radius:8px;padding:11px 16px;cursor:pointer;text-decoration:none;font-family:var(--body)}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn.sm{padding:7px 11px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,.opt:focus-visible,nav a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:22px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.stat b{display:block;font-family:var(--mono);font-size:26px;font-weight:500;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--ink-2)}
.bars{display:grid;gap:8px;margin:14px 0 6px}
.bar{display:grid;grid-template-columns:minmax(120px,1.2fr) 3fr;gap:10px;align-items:center;font-size:13px}
.bar .lbl{color:var(--ink-2);line-height:1.25}
.bar .trk{display:flex;align-items:center;gap:8px}
.bar .fill{height:14px;background:var(--accent);border-radius:3px;min-width:2px}
.bar.dim .fill{background:var(--steady)}
.bar .val{font-family:var(--mono);font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.cap{font-size:12px;color:var(--ink-3)}
.small{font-size:13px;color:var(--ink-2)}
.pill{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.02em;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.growing,.pill.official,.pill.ok{background:var(--grow-soft);color:var(--grow)}
.pill.steady,.pill.industry,.pill.req{background:var(--steady-soft);color:var(--steady)}
.pill.shrinking,.pill.media,.pill.pref{background:var(--shrink-soft);color:var(--shrink)}
.pill.low,.pill.gap{background:var(--neg-soft);color:var(--neg)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;margin:12px 0}
.card.rank{border-left:5px solid var(--accent)}
.card h3{margin-top:0}
.reason{display:grid;grid-template-columns:22px 1fr;gap:8px;font-size:14px;margin:6px 0}
.reason .s{font-family:var(--mono);font-weight:500;text-align:right}
.reason.pos .s{color:var(--grow)} .reason.neg .s{color:var(--neg)}
.q{max-width:640px}
.prog{height:6px;background:var(--line);border-radius:3px;margin:14px 0 22px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);transition:width .25s}
.opts{display:grid;gap:8px;margin:14px 0}
.opt{display:flex;align-items:center;gap:12px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;font:inherit;color:var(--ink);width:100%}
.opt .k{width:22px;height:22px;border-radius:50%;border:2px solid var(--ink-3);flex:0 0 auto}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .k{border-color:var(--accent);background:var(--accent)}
.opt.multi .k{border-radius:5px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.tw{overflow-x:auto;margin:10px 0 18px;-webkit-overflow-scrolling:touch}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.kv{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.kv .eyebrow{margin-bottom:4px}
.kv b{font-family:var(--mono);font-weight:500;font-size:22px;font-variant-numeric:tabular-nums}
.kv p{font-size:13px;color:var(--ink-2);margin:6px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;padding:4px 9px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.chip.f3{border-color:var(--grow);color:var(--grow);font-weight:600}.chip.f2{border-color:var(--accent);color:var(--accent)}.chip.f0{color:var(--ink-3);text-decoration:line-through}
details{border:1px solid var(--line);border-radius:10px;background:var(--surface);margin:8px 0}
summary{cursor:pointer;padding:12px 14px;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:10px}
summary::after{content:"+";font-family:var(--mono);color:var(--ink-3)}
details[open] summary::after{content:"–"}
details .in{padding:0 14px 14px;font-size:14px}
details h4{margin:10px 0 4px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
details ul{margin:0;padding-left:18px}
ul.clean{padding-left:18px;margin:0 0 12px}
li{margin:3px 0}
.src{font-size:13px;color:var(--ink-2)}
.list{display:grid;gap:10px}
.pathrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;text-decoration:none;color:var(--ink)}
.pathrow .t{font-weight:600}.pathrow .d{font-size:13px;color:var(--ink-2)}
.note{border-left:3px solid var(--shrink);padding:8px 12px;background:var(--shrink-soft);border-radius:0 8px 8px 0;font-size:14px;margin:12px 0}
.ok-note{border-left:3px solid var(--grow);padding:8px 12px;background:var(--grow-soft);border-radius:0 8px 8px 0;font-size:14px;margin:12px 0}
input,select,textarea{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);max-width:100%}
label.f{display:grid;gap:4px;font-size:13px;color:var(--ink-2)}
.ring{display:inline-grid;place-items:center;width:84px;height:84px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--line) 0);position:relative;flex:0 0 auto}
.ring::before{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--surface)}
.ring b{position:relative;font-family:var(--mono);font-size:18px;font-weight:500}
.skill{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line)}
.skill .st{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:700;border:2px solid var(--line);color:var(--ink-3)}
.skill .st.done{background:var(--grow);border-color:var(--grow);color:#fff}
.skill .st.prog{border-color:var(--accent);color:var(--accent)}
.skill .n{font-weight:600}
.skill .learn{font-size:13px;color:var(--ink-2);margin-top:4px}
.skill .learn a{margin-right:8px}
.evf{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.evf input,.evf select{padding:6px 8px;font-size:13px}
.match{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.mbar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;min-width:80px}
.mbar i{display:block;height:100%;background:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:9;box-shadow:0 6px 24px rgba(0,0,0,.2)}
footer{max-width:860px;margin:0 auto;padding:16px;font-size:13px;color:var(--ink-3);border-top:1px solid var(--line)}
@media (max-width:520px){ nav a{padding:6px 7px;font-size:13px} .brand small{display:none} .bar{grid-template-columns:1fr;gap:3px} .skill{grid-template-columns:auto 1fr} .skill .act{grid-column:2} }
@media (prefers-reduced-motion:reduce){ .prog i{transition:none} }
@media print{ .top,footer,.btn,.evf,.noprint,nav{display:none !important} body{background:#fff;color:#000} main{max-width:none;padding:0} .card,.kv,.skill{break-inside:avoid} a{color:#000;text-decoration:none} .ring{-webkit-print-color-adjust:exact;print-color-adjust:exact} }
</style>

<div class="top"><div class="in">
  <a class="brand" href="#/">NextRung<small>for engineers</small></a>
  <nav id="nav"><a href="#/quiz" data-r="quiz">Find my direction</a><a href="#/paths" data-r="paths">Paths</a><a href="#/jobs" data-r="jobs">Openings</a><a href="#/evidence" data-r="evidence">Evidence</a><a href="#/about" data-r="about">About</a><a href="#/me" data-r="me" class="me" id="nav-me">Sign in</a></nav>
</div></div>
<main id="app"></main>
<footer>NextRung: open-source, evidence-first career direction for Indian engineering graduates. Numbers refreshed <span id="asof"></span>. Nothing here is a guarantee of a job; it is the best available evidence, with sources.</footer>

<script id="data" type="application/json">/*__DATA__*/</script>
<script>
const ENDPOINT = '__ENDPOINT__'; // set by deploy/deploy.sh
const API = /^https:\/\//.test(ENDPOINT) ? ENDPOINT : null;
const SITE_VERSION = '0.2.0';
const D = JSON.parse(document.getElementById('data').textContent);
const PATHS = D.paths, QS = D.questions.questions, STATS = D.stats, SKILLS = D.skills.skills, JOBS = D.jobs.postings;
const SBY = Object.fromEntries(STATS.map(s => [s.id, s]));
const PBY = Object.fromEntries(PATHS.map(p => [p.id, p]));
const KBY = Object.fromEntries(SKILLS.map(s => [s.id, s]));
const LABEL = {}; QS.forEach(q => q.options.forEach(o => LABEL[q.field + ':' + o.value] = o.label));
document.getElementById('asof').textContent = (STATS[0] && STATS[0].as_of) || '';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const inr = n => { if (n == null) return '—'; const a = Math.abs(n); if (a >= 1e7) return (n/1e7).toFixed(a >= 1e9 ? 0 : 2).replace(/\.00$/,'') + ' crore'; if (a >= 1e5) return (n/1e5).toFixed(a >= 1e6 ? 1 : 2).replace(/\.?0+$/,'') + ' lakh'; return n.toLocaleString('en-IN'); };
const fmt = s => { if (s.value == null) return '—'; if (s.unit === 'ratio') return (s.value*100).toFixed(Math.abs(s.value) < 0.1 ? 1 : 0) + '%'; if (s.unit === 'INR') return '₹' + inr(s.value); if (s.unit === 'INR per year' || s.unit === 'INR per month') return '₹' + s.value.toLocaleString('en-IN'); if (['people','seats','students','openings'].includes(s.unit)) return inr(s.value); return s.value.toLocaleString('en-IN'); };
const statLink = id => { const s = SBY[id]; if (!s) return ''; return `<a href="${esc(s.source_url||'#')}" target="_blank" rel="noopener">${esc(s.source_title||id)}</a> <span class="cap">(${esc(s.period)}) <span class="pill ${s.confidence}">${s.confidence}</span></span>`; };
const ls = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }, del(k) { try { localStorage.removeItem(k); } catch (e) {} } };
let toastT; function toast(m) { let t = document.getElementById('toast'); if (!t) { t = document.createElement('div'); t.id = 'toast'; t.className = 'toast'; document.body.appendChild(t); } t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2600); }

// ---------- state ----------
let answers = ls.get('nr.answers', {}) || {};
const saveAnswers = () => ls.set('nr.answers', answers);
let auth = ls.get('nr.auth', null);
let me = null;            // {user, evidence}
const signedIn = () => !!(auth && auth.id_token);

async function api(path, opts = {}, retry = true) {
  if (!API) throw new Error('This copy of the site has no backend configured.');
  const h = { 'content-type': 'application/json' };
  if (signedIn()) h['authorization'] = 'Bearer ' + auth.id_token;
  const r = await fetch(API + path.replace(/^\//, ''), { method: opts.method || 'GET', headers: h, body: opts.body ? JSON.stringify(opts.body) : undefined });
  if (r.status === 401 && signedIn() && retry && auth.refresh_token) {
    const rr = await fetch(API + 'auth/refresh', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ refresh_token: auth.refresh_token }) });
    if (rr.ok) { const j = await rr.json(); auth.id_token = j.id_token; ls.set('nr.auth', auth); return api(path, opts, false); }
    signOut(); throw new Error('Please sign in again.');
  }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
  return j;
}
function signOut() { auth = null; me = null; ls.del('nr.auth'); setNavMe(); }
function setNavMe() { const a = document.getElementById('nav-me'); a.textContent = signedIn() ? 'My standing' : 'Sign in'; }
async function loadMe() { if (!signedIn()) return null; me = await api('me'); return me; }

// ---------- matcher ----------
function score(path, a) {
  const hits = [];
  for (const r of path.fit_rules) { const v = a[r.field]; if (v == null) continue; const m = Array.isArray(v) ? v.includes(r.value) : String(v) === String(r.value); if (m) hits.push(r); }
  return { path, total: path.base_score + hits.reduce((s, r) => s + r.score, 0), hits: hits.sort((x, y) => y.score - x.score) };
}
const rank = a => PATHS.map(p => score(p, a)).sort((x, y) => y.total - x.total);
function profileLine(a) { const parts = []; if (a.branch) parts.push(LABEL['branch:' + a.branch]); if (a.college_tier) parts.push('tier-' + a.college_tier + ' college'); if (a.region) parts.push(LABEL['region:' + a.region].split(' (')[0]); if (a.relocation) parts.push(LABEL['relocation:' + a.relocation].replace(/^Only /, 'only ').replace(/^Anywhere/, 'anywhere')); return parts.join(', '); }
function explain(r, i) {
  const pos = r.hits.filter(h => h.score > 0).slice(0, 2).map(h => h.reason.replace(/\.$/, ''));
  const neg = r.hits.filter(h => h.score < 0)[0];
  let t = `${r.path.name} ranks ${['first','second','third'][i] || (i+1)+'th'}`;
  t += pos.length ? ` because ${pos.join('; and ')}.` : ` mainly on the size of its door this year.`;
  if (neg) t += ` Watch out: ${neg.reason.replace(/\.$/, '')}.`;
  const fb = PBY[r.path.fallback_path_id]; if (fb) t += ` Fallback that shares most of the preparation: ${fb.name}.`;
  return t;
}

// ---------- standing: readiness, gap, plan, job match ----------
function readiness(path, ev) {
  const sk = path.skills || []; const tot = sk.reduce((s, x) => s + x.weight, 0) || 1;
  const have = sk.filter(x => ev[x.id]).reduce((s, x) => s + x.weight, 0);
  const req = sk.filter(x => x.level === 'required'); const reqHave = req.filter(x => ev[x.id]).length;
  return { pct: Math.round(have / tot * 100), req: req.length, reqHave, total: sk.length, have: sk.filter(x => ev[x.id]).length };
}
function gapOf(path, ev) { return (path.skills || []).filter(x => !ev[x.id]).sort((a, b) => (a.level === b.level ? b.weight - a.weight : a.level === 'required' ? -1 : 1)); }
function plan(path, ev) {
  const gap = gapOf(path, ev); const sprints = [[], [], []]; const later = []; const cap = 90; const used = [0, 0, 0];
  for (const g of gap) { const s = KBY[g.id]; if (!s) continue; const h = Math.min(...s.learning.map(l => l.hours || 20)); let placed = false;
    for (let i = 0; i < 3; i++) { if (used[i] + h <= cap || sprints[i].length === 0) { sprints[i].push({ ...g, hours: h }); used[i] += h; placed = true; break; } }
    if (!placed) later.push({ ...g, hours: h }); }
  return { sprints, later, used };
}
function jobMatch(job, ev) { const m = job.requirements.filter(r => r.skill_id); const met = m.filter(r => ev[r.skill_id]); return { mapped: m.length, met: met.length, missing: m.filter(r => !ev[r.skill_id]), unmapped: job.requirements.length - m.length, pct: m.length ? Math.round(met.length / m.length * 100) : 0 }; }

// ---------- views ----------
const app = document.getElementById('app');
function setNav(r) { document.querySelectorAll('#nav a').forEach(x => x.classList.toggle('on', x.dataset.r === r)); setNavMe(); }

function home() {
  setNav('');
  const g = SBY['supply.aishe.btech_outturn.2023_24'], fy24 = SBY['supply.teamlease.it_fresher_hiring.fy24'], gccF = SBY['demand.gcc.fresher_share.2025'];
  const bars = [['B.E./B.Tech graduates a year', 820000, false], ['Employable, India Skills Report 2026 (70%)', 575000, true], ['Employable, Mercer-Mettl 2025 (42.6%)', 350000, true], ['IT services freshers hired, FY24', 160000, false], ['Top-5 IT firms fresher plans, FY27', 70000, false], ['GCC entry-level jobs a year (to 2030)', 20000, false], ['Government / PSU engineer posts a year', 10000, false]];
  app.innerHTML = `
  <div class="eyebrow">For final-year students and recent graduates, every branch</div>
  <h1>The first rung of the ladder is gone. Here is your next one.</h1>
  <p class="lead" style="margin-top:14px">AI agents now do the routine work freshers were hired for, and IT services, the door most of India's engineers were told to walk through, is closing. NextRung shows you where you stand against what employers are asking for right now, and the shortest evidence-based route to the next rung.</p>
  <div class="row" style="margin:18px 0 8px"><a class="btn" href="#/quiz">Find my direction</a><a class="btn ghost" href="#/${signedIn() ? 'me' : 'signin'}">${signedIn() ? 'Open my standing' : 'I have an account'}</a></div>
  <div class="stats">
    <div class="stat"><b>${inr(g.value)}</b><span>engineering degree holders a year (AISHE 2023-24)</span></div>
    <div class="stat"><b>${inr(fy24.value)}</b><span>IT services fresher hires in FY24, down from 4 lakh in FY22</span></div>
    <div class="stat"><b>${(gccF.value*100)|0}%</b><span>fresher share of GCC hiring in 2025, from 28% in 2024</span></div>

function quiz(step) {
  setNav('quiz');

  app.innerHTML = `<div class="q">
    <div class="eyebrow">Question ${step + 1} of ${QS.length}</div>
    <div class="prog"><i style="width:${(step / QS.length * 100).toFixed(0)}%"></i></div>
    <h2 style="margin-top:0">${esc(q.prompt)}</h2>
    ${q.type === 'multi' ? `<p class="cap">Pick up to ${q.max}.</p>` : ''}
    <div class="opts">${q.options.map(o => `<button class="opt ${q.type} ${sel(o.value) ? 'sel' : ''}" data-v="${esc(o.value)}" id="opt-${q.id}-${esc(o.value)}"><span class="k"></span><span>${esc(o.label)}</span></button>`).join('')}</div>
    <div class="row" style="margin-top:18px">${step > 0 ? `<a class="btn ghost" href="#/quiz/${step - 1}">Back</a>` : ''}<a class="btn" id="next" href="#/quiz/${step + 1}">${step === QS.length - 1 ? 'Show my directions' : 'Next'}</a></div></div>`;
  const next = document.getElementById('next'); if (step === QS.length - 1) next.href = '#/results';
  const refresh = () => { const ok = q.type === 'multi' ? (Array.isArray(answers[q.field]) && answers[q.field].length > 0) : answers[q.field] != null; next.style.opacity = ok ? 1 : .45; next.style.pointerEvents = ok ? 'auto' : 'none'; };
  refresh();
  app.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => {
    const v = b.dataset.v;
    if (q.type === 'multi') { let arr = Array.isArray(answers[q.field]) ? [...answers[q.field]] : []; if (v === 'none') arr = arr.includes('none') ? [] : ['none']; else { arr = arr.filter(x => x !== 'none'); arr = arr.includes(v) ? arr.filter(x => x !== v) : [...arr, v].slice(-q.max); } answers[q.field] = arr; app.querySelectorAll('.opt').forEach(x => x.classList.toggle('sel', arr.includes(x.dataset.v))); saveAnswers(); refresh(); return; }
    answers[q.field] = v; app.querySelectorAll('.opt').forEach(x => x.classList.toggle('sel', x.dataset.v === v)); saveAnswers(); refresh(); setTimeout(() => { location.hash = next.getAttribute('href'); }, 180);
  }));
}

}

    <div class="eyebrow">Path</div>

    <h3>Skills employers screen for</h3>

    <div class="chips">${(p.skills || []).map(x => { const s = KBY[x.id]; return s ? `<span class="chip ${ev[x.id] ? 'f3' : ''}" title="${esc(s.description)}">${esc(s.name)} <span class="cap">${x.level === 'required' ? '· required' : ''}</span></span>` : ''; }).join('')}</div>

    <div class="tw"><table><thead><tr><th>Employer</th><th>Requirements</th><th>Seen</th></tr></thead><tbody>${jobs.map(j => `<tr><td><a href="${esc(j.url)}" target="_blank" rel="noopener">${esc(j.company)}</a><br><span class="cap">${esc(j.title)} · ${esc(j.location || '')}</span></td><td class="small">${j.requirements.map(r => r.skill_id && KBY[r.skill_id] ? `<span class="chip" style="font-size:12px;padding:2px 6px">${esc(KBY[r.skill_id].name)}</span>` : `<span class="cap">${esc(r.text)}</span>`).join(' ')}</td><td class="cap">${esc(j.posted_on || j.seen_on || '')}</td></tr>`).join('') || '<tr><td colspan="3" class="cap">None loaded yet.</td></tr>'}</tbody></table></div>

    <div class="tw"><table><thead><tr><th>If you answered</th><th>Score</th><th>Because</th></tr></thead><tbody>${p.fit_rules.map(r => `<tr><td>${esc(LABEL[r.field + ':' + r.value] || r.value)}</td><td class="match" style="color:${r.score > 0 ? 'var(--grow)' : 'var(--neg)'}">${r.score > 0 ? '+' : ''}${r.score}</td><td>${esc(r.reason)}</td></tr>`).join('')}</tbody></table></div>
    <h2>Sources used on this page</h2><ul class="src">${sources.map(i => `<li>${statLink(i)}</li>`).join('')}</ul>

function jobsPage(filter) {
  setNav('jobs');
  const f = (filter || '').toLowerCase();
  app.innerHTML = `<div class="eyebrow">Openings</div><h1 style="font-size:clamp(26px,5vw,36px)">${JOBS.length} fresher openings and notifications, mapped to skills</h1>
    <p class="lead">Seen ${esc(D.jobs.seen_on)}. Refreshed by an agent run each quarter; postings close, so treat the list as a picture of what employers ask for, and always check the link.</p>
    <p><input id="jf" placeholder="Filter by company, title, city, skill" value="${esc(filter || '')}" style="width:100%;max-width:420px"></p>
    ${PATHS.map(p => { const js = JOBS.filter(j => j.path_id === p.id && (!f || (j.company + ' ' + j.title + ' ' + (j.location||'') + ' ' + j.requirements.map(r => (r.skill_id && KBY[r.skill_id] ? KBY[r.skill_id].name : r.text)).join(' ')).toLowerCase().includes(f))); return js.length ? `<h2><a href="#/path/${p.id}" style="text-decoration:none;color:inherit">${esc(p.name)}</a> <span class="cap">${js.length}</span></h2><div class="tw"><table><thead><tr><th>Employer</th><th>Asks for</th><th>Seen</th></tr></thead><tbody>${js.map(j => `<tr><td><a href="${esc(j.url)}" target="_blank" rel="noopener">${esc(j.company)}</a><br><span class="cap">${esc(j.title)} · ${esc(j.location || '')}</span></td><td class="small">${j.requirements.filter(r => r.skill_id && KBY[r.skill_id]).map(r => esc(KBY[r.skill_id].name)).join(', ')}${j.requirements.some(r => !r.skill_id) ? ' <span class="cap">+' + j.requirements.filter(r => !r.skill_id).length + ' more</span>' : ''}</td><td class="cap">${esc(j.posted_on || j.seen_on || '')}</td></tr>`).join('')}</tbody></table></div>` : ''; }).join('')}`;
  const inp = document.getElementById('jf'); inp.addEventListener('input', () => { const pos = inp.selectionStart; jobsPage(inp.value); const n = document.getElementById('jf'); n.focus(); n.setSelectionRange(pos, pos); });
}

function evidence(filter) {
  setNav('evidence');
  const groups = [['supply','Supply: how many engineers India produces'],['demand','Demand: entry-level tech hiring'],['paths','Paths: the other doors'],['gap','Gaps: numbers we could not source']];
  const f = (filter || '').toLowerCase();
  const rows = g => STATS.filter(s => s.id.startsWith(g + '.') && (!f || (s.metric + ' ' + s.source_title + ' ' + s.period).toLowerCase().includes(f)));
  app.innerHTML = `<div class="eyebrow">Evidence</div><h1 style="font-size:clamp(26px,5vw,36px)">Every number on this site, with where it came from</h1>
    <p class="lead">${STATS.length} records. Confidence: <span class="pill official">official</span> government or company filings; <span class="pill industry">industry</span> NASSCOM, staffing firms, research labs; <span class="pill media">media</span> press reporting an official figure; <span class="pill low">low</span> aggregator or unverified.</p>
    <p><input id="ev-filter" placeholder="Filter, e.g. GCC, PLFS, fresher" value="${esc(filter || '')}" style="width:100%;max-width:420px"></p>
    ${groups.map(([g, t]) => { const r = rows(g); return r.length ? `<h2>${t}</h2><div class="tw"><table><thead><tr><th>Metric</th><th>Value</th><th>Period</th><th>Source</th></tr></thead><tbody>${r.map(s => `<tr><td>${esc(s.metric)}${s.contradiction ? `<br><span class="cap">Contradiction: ${esc(s.contradiction)}</span>` : ''}</td><td class="match">${fmt(s)}</td><td class="cap">${esc(s.period)}</td><td>${s.source_url ? `<a href="${esc(s.source_url)}" target="_blank" rel="noopener">${esc(s.source_title)}</a>` : '—'} <span class="pill ${s.confidence}">${s.confidence}</span></td></tr>`).join('')}</tbody></table></div>` : ''; }).join('')}`;
  const inp = document.getElementById('ev-filter'); inp.addEventListener('input', () => { const pos = inp.selectionStart; evidence(inp.value); const n = document.getElementById('ev-filter'); n.focus(); n.setSelectionRange(pos, pos); });
}

function about() {
  setNav('about');
  app.innerHTML = `<div class="eyebrow">About</div><h1 style="font-size:clamp(26px,5vw,36px)">Why NextRung exists, and how it is kept honest</h1>
  <p class="lead">India produces about 8 lakh engineering degree holders a year. The IT services door that absorbed 4 lakh of them in FY22 took 1.6 lakh in FY24 and is still shrinking, and AI agents now do the routine work that was the first rung. At least 6 lakh graduates a year need a direction that is not "join an IT services company", and a way to prove they are ready for it.</p>
  <h2>How it works</h2>
  <p>Ten questions build a profile. A rules engine, not a language model, scores nine paths: a base score for how many fresher seats the door has this year, plus fit rules written by people and shown on every path page. Each path names the skills employers screen for. Your standing is the share of those skills you have evidence for, compared against the requirements in fresher postings seen this quarter. The gap becomes a 90-day plan with free-first learning and a proof of done per skill.</p>
  <p>Four agent skills maintain the content: one refreshes the statistics from primary sources and refuses to emit a number without a URL; one maintains the path records; one maintains the skills taxonomy and learning options (every link opened before it is listed); one ingests fresher postings and maps their requirements to skills. Changes arrive as pull requests that maintainers review.</p>
  <h2>Your data</h2>
  <p>Answers stay in your browser until you sign in. With an account, your answers, ranking, evidence links and plan are stored so you can come back. Sign-in is a one-time code by email; there is no password. Your page is private unless you switch it to public, and a public page never shows your email. You can delete everything from your standing page.</p>
  <h2>What it is not</h2>
  <p>Not a job board, a course, or a guarantee. Projections are labelled projections. Where two credible sources disagree, both are shown. Where no number exists, the site says so instead of inventing one.</p>
  <h2>Contribute</h2>
  <p>The data, matcher, skills taxonomy, job mappings and this site are open source. Fix a number with a source, add an employer with a recent page, challenge a fit rule, add a learning option that is free and good, or translate a path into Hindi, Tamil, Telugu or Kannada. Placement officers, hiring managers and recent graduates are the reviewers this needs most.</p>
  <p class="cap">Version ${SITE_VERSION}, September 2026. Built to be argued with.</p>`;
}

function route() {
  const h = location.hash.replace(/^#\/?/, ''); const [r, a] = h.split('/'); window.scrollTo({ top: 0 }); setNavMe();
  if (!r) return home();
  if (r === 'quiz') return quiz(parseInt(a || '0', 10) || 0);
  if (r === 'results') return results();
  if (r === 'signin') return signin();
  if (r === 'me') return mePage();
  if (r === 'p') return publicPage(decodeURIComponent(a || ''));
  if (r === 'paths') return pathsList();
  if (r === 'path') return pathPage(a);
  if (r === 'jobs') return jobsPage('');
  if (r === 'evidence') return evidence('');
  if (r === 'about') return about();
  home();
}
window.addEventListener('hashchange', route);
route();
</script>
