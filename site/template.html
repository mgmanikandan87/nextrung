function score(path, a) { const hits = []; for (const r of path.fit_rules) { const v = a[r.field]; if (v == null) continue; const m = Array.isArray(v) ? v.includes(r.value) : String(v) === String(r.value); if (m) hits.push(r); } return { path, total: path.base_score + hits.reduce((s, r) => s + r.score, 0), hits: hits.sort((x, y) => y.score - x.score) }; }
const rank = a => PATHS.map(p => score(p, a)).sort((x, y) => y.total - x.total);
function readiness(path, ev) { const sk = path.skills || []; const tot = sk.reduce((s, x) => s + x.weight, 0) || 1; const have = sk.filter(x => ev[x.id]).reduce((s, x) => s + x.weight, 0); const req = sk.filter(x => x.level === 'required'); return { pct: Math.round(have / tot * 100), req: req.length, reqHave: req.filter(x => ev[x.id]).length, total: sk.length, have: sk.filter(x => ev[x.id]).length }; }
const pri = x => x.weight * (1 + 2 * (x.demand || 0)); // weight from the route record, boosted by how many of the route's fresher ads ask for it
function gapOf(path, ev) { return (path.skills || []).filter(x => !ev[x.id]).sort((a, b) => (a.level === b.level ? pri(b) - pri(a) : a.level === 'required' ? -1 : 1)); }
function plan(path, ev) { const gap = gapOf(path, ev); const months = [[], [], []], later = [], used = [0, 0, 0]; for (const g of gap) { const s = KBY[g.id]; if (!s) continue; const h = Math.min(...s.learning.map(l => l.hours || 20)); const item = { ...g, hours: h }; let placed = false; if (g.level === 'required') { for (let i = 0; i < 3; i++) { if (months[i].length < 3 && (used[i] + h <= 30 || months[i].length === 0)) { months[i].push(item); used[i] += h; placed = true; break; } } } if (!placed) later.push(item); } return { months, later, used, weekly: Math.ceil((used[0] || 0) / 4) }; }
function jobMatch(job, ev) { const seen = new Set(); const m = job.requirements.filter(r => r.skill_id && !seen.has(r.skill_id) && seen.add(r.skill_id)); const met = m.filter(r => ev[r.skill_id]); return { mapped: m.length, met: met.length, missing: m.filter(r => !ev[r.skill_id]), other: job.requirements.filter(r => !r.skill_id).length, pct: m.length ? Math.round(met.length / m.length * 100) : 0 }; }
const trend = p => `<span class="pill ${p.door_state}">${t('trend_' + p.door_state)}</span>`;
function whyLine(r) { const pos = r.hits.filter(h => h.score > 0).slice(0, 2).map(h => lc(h.reason.replace(/\.$/, ''))); return pos.length ? pos.join('; ' + (LANG === 'hi' ? 'और ' : 'and ')) + '.' : clean(r.path.tagline); }
function careLine(r) { const neg = r.hits.filter(h => h.score < 0)[0]; if (neg) return neg.reason; if (r.path.door_state === 'shrinking') return t('shrink_line'); const k = answers.college_tier ? 'tier' + answers.college_tier : 'tier3'; return clean((r.path.tiers_realistic[k] || '').split(/(?<=\.)\s/)[0]); }

const regionOf = loc => { const s = String(loc || '').toLowerCase(); if (/bengaluru|bangalore|chennai|hyderabad|karnataka|tamil|telangana|andhra|kerala|kochi|coimbatore|madurai|mysuru|hosur|vizag|visakhapatnam|tirupati/.test(s)) return 'south'; if (/mumbai|pune|maharashtra|gujarat|ahmedabad|surat|vadodara|sanand|dholera|goa|nashik|nagpur/.test(s)) return 'west'; if (/delhi|noida|gurgaon|gurugram|ncr|uttar pradesh|lucknow|kanpur|punjab|chandigarh|haryana|rajasthan|jaipur|uttarakhand|dehradun|himachal|jammu/.test(s)) return 'north'; if (/kolkata|west bengal|odisha|bhubaneswar|bihar|patna|jharkhand|ranchi|assam|guwahati|manipur/.test(s)) return 'east_ne'; if (/bhopal|indore|madhya|chhattisgarh|raipur/.test(s)) return 'central'; return null; };
const oldAd = j => { if (!j.posted_on || j.source === 'notification') return false; const d = (Date.parse(D.jobs.seen_on) - Date.parse(j.posted_on)) / 86400000; return d > 60; };
const payLine = j => { if (!j.salary_text) return ''; const s = String(j.salary_text); const nums = (s.match(/\d[\d,]*(?:\.\d+)?/g) || []).map(x => Math.round(parseFloat(x.replace(/,/g, '')))); const low = /unpaid|stipend/i.test(s) || (nums.length && /month/i.test(s) && Math.max(...nums) < 15000); const txt = nums.length ? ('₹' + nums.map(n => n.toLocaleString('en-IN')).join(' to ') + (/month/i.test(s) ? '/month' : /year|annum|lpa/i.test(s) ? '/year' : '')) : (/competitive|industry/i.test(s) ? '' : s.slice(0, 40)); return (txt ? ' · ' + txt : '') + (low ? ` · <span class="pill low">${LANG === 'hi' ? 'कम / बिना वेतन' : 'unpaid or low pay'}</span>` : ''); };
function jobCard(j, m) {
  const seen = new Set(); const skills = j.requirements.filter(r => r.skill_id && KBY[r.skill_id] && !seen.has(r.skill_id) && seen.add(r.skill_id)).map(r => KBY[r.skill_id].name);

    <a class="btn sm ghost" style="margin-top:10px" href="${esc(j.url)}" target="_blank" rel="noopener" data-job="${esc(j.id)}">${esc(t('j_open'))}</a></div>`;

function about() {
  setNav('');
  app.innerHTML = `<h1 style="font-size:clamp(24px,5vw,32px)">${esc(LANG === 'hi' ? 'NextRung क्यों है' : 'Why NextRung exists')}</h1>
  <p class="lead">India produces about 8 lakh engineering degree holders a year. The big IT companies that hired 4 lakh freshers in FY22 hired 1.6 lakh in FY24, and AI now does the routine work that was a fresher's first job. Most graduates are told to walk through a door that is closing. NextRung shows the doors that are open, what each asks for, and the shortest free route to prove you are ready.</p>
  <h2>Who made this</h2>
  <p>Started by Manikandan M G, an engineering leader in Bengaluru who has hired and built teams of hundreds of engineers and watched AI change what a fresher must show to get hired. It is open source; contributors are welcome, especially placement officers, hiring managers and recent graduates.</p>
  <h2>Honesty rules</h2>
  <p>Free, no course, no fees, ever. Not a job board and not a guarantee. Every number has a source and a date. Projections are called projections. Where two good sources disagree, both are shown. Where no number exists, we say so. The ranking is a set of written rules you can read on each route page, not a chatbot.</p>
  <h2>Your data</h2>
  <p>Answers stay in your browser until you sign in. With an account, your answers, plan and proof links are saved so you can come back. Sign-in is a one-time code by email; there is no password. Your page is private unless you switch it on, and it never shows your email. If you link a mentor, they see your plan, proof links, check results and your own confidence ratings, and nothing else; you can remove a mentor any time. You can delete everything from Settings.</p>
  <h2>How we keep it honest</h2>
  <p>Nothing counts because you said it. A proof link is checked where the source allows it (a GitHub repository that is yours with real commit history, a LeetCode profile with solved problems, a certificate page that loads), and labelled verified, seen, or broken. Each skill has a short check of six questions from real work; you predict your score first, and the gap between your guess and your result is the signal, not the score. A mentor can confirm a skill in person, ask you to redo a proof, or set your focus for the week. That is the whole point: a plan that fits where you actually are.</p>
  <h2>How it is kept up to date</h2>
  <p>Four agent skills refresh the content: statistics from primary sources (no number without a URL), the route records, the skills and free learning links (every link opened before it is listed), and fresher job ads mapped to skills. Changes are reviewed by people before they go live.</p>
  <p class="cap">Version ${SITE_VERSION}, September 2026.</p>`;
}

async function checkPage(skill) {
  setNav('me'); const sk = KBY[skill]; if (!sk || !CHECKS_AVAIL[skill]) { app.innerHTML = '<p>No check for this skill.</p>'; return; }
  if (!signedIn()) { location.hash = '#/signin'; return; }
  app.innerHTML = '<p class="cap">…</p>';
  let d; try { d = await api('checks/' + skill); } catch (e) { app.innerHTML = `<p>${esc(e.message)}</p><a class="btn ghost" href="#/me/plan">${esc(t('chk_back'))}</a>`; return; }
  const head = `<div class="eyebrow">${esc(t('chk_btn'))}</div><h1 style="font-size:clamp(22px,5vw,30px)">${esc(sk.name)}</h1>`;
  const resultView = (r, review) => { const g = r.predicted - r.score; const msg = g >= 2 ? t('chk_gap_over') : g <= -2 ? t('chk_gap_under') : t('chk_gap_ok');
    return `<div class="card rank"><div style="font-family:var(--mono);font-size:28px">${r.score} / ${r.n}</div><p style="margin:6px 0">${esc(t('chk_result', { s: r.score, n: r.n, p: r.predicted }))}</p><p class="small">${esc(msg)}</p><p class="cap">${esc(t('chk_again'))}</p></div>
      ${review && review.some(x => !x.ok) ? `<h2>${esc(t('chk_wrong'))}</h2>${review.filter(x => !x.ok).map(x => `<div class="card"><div class="cq">${esc(x.q)}</div><div class="small">${x.your != null ? `<span class="pill low">${esc(x.your)}</span> ` : ''}<span class="pill ok">${esc(x.correct)}</span></div><p class="small" style="margin:8px 0 0">${esc(x.explain)}</p></div>`).join('')}` : ''}
      <a class="btn wide" href="#/me/plan" style="margin-top:12px">${esc(t('chk_back'))}</a>`; };
  if (d.cooldown) { app.innerHTML = head + `<p class="small">${esc(t('chk_cool'))}</p>` + resultView(d.result, null); return; }
  let predicted = null;
  app.innerHTML = head + `<p class="lead">${esc(t('chk_intro'))}</p><div class="card"><p><b>${esc(t('chk_predict'))}</b></p><div class="pred" id="pred">${[0, 1, 2, 3, 4, 5, 6].map(n => `<button data-n="${n}">${n}</button>`).join('')}</div><div style="margin-top:12px"><button class="btn" id="go" disabled>${esc(t('chk_start'))}</button></div></div>${d.last ? `<p class="cap">${esc(t('chk_last'))}: ${d.last.score}/${d.last.n} · ${esc(String(d.last.at || '').slice(0, 10))}</p>` : ''}`;
  app.querySelectorAll('#pred button').forEach(b => b.addEventListener('click', () => { predicted = +b.dataset.n; app.querySelectorAll('#pred button').forEach(x => x.classList.toggle('sel', x === b)); document.getElementById('go').disabled = false; }));
  document.getElementById('go').addEventListener('click', () => {
    const ans = {};
    const render = () => { app.innerHTML = head + `<p class="cap">${esc(t('chk_meta'))} · ${Object.keys(ans).length}/${d.n} ${esc(t('chk_answered'))}</p>` + d.items.map((it, i) => `<div class="card"><div class="eyebrow">${i + 1} / ${d.n}</div><div class="cq">${esc(it.q)}</div><div class="opts" style="margin:0">${it.options.map((o, k) => `<button class="copt ${ans[it.id] === k ? 'sel' : ''}" data-i="${it.id}" data-k="${k}"><span class="k" style="width:18px;height:18px;border-radius:50%;border:2px solid var(--ink-3);flex:0 0 auto;margin-top:2px;${ans[it.id] === k ? 'background:var(--accent);border-color:var(--accent)' : ''}"></span><span>${esc(o)}</span></button>`).join('')}</div></div>`).join('') + `<button class="btn wide" id="submit" ${Object.keys(ans).length < d.n ? 'disabled' : ''}>${esc(t('chk_submit'))}</button>`;
      app.querySelectorAll('.copt').forEach(b => b.addEventListener('click', () => { ans[b.dataset.i] = +b.dataset.k; const y = window.scrollY; render(); window.scrollTo({ top: y }); }));
      const sb = document.getElementById('submit'); sb.addEventListener('click', async () => { sb.disabled = true; try { const j = await api('checks/' + skill, { method: 'POST', body: { answers: ans, predicted } }); track('check_done', { skill, score: j.result.score, predicted }); app.innerHTML = head + resultView(j.result, j.review); window.scrollTo({ top: 0 }); } catch (e) { toast(e.message); sb.disabled = false; } }); };
    render(); window.scrollTo({ top: 0 });
  });
}

      <div class="meta">self: <b>${e && e.self_level ? esc(lvl[e.self_level]) : '—'}</b> · check: <b>${c ? `${c.score}/${c.n} (predicted ${c.predicted}${c.gap >= 2 ? ', over' : c.gap <= -2 ? ', under' : ''})` : (CHECKS_AVAIL[x.id] ? 'not taken' : 'n/a')}</b>${c && c.attempts > 1 ? ` · ${c.attempts} attempts` : ''}</div></div></div>
      ${e ? `<div class="body">${e.type === 'mentor_confirmed' ? `<b>Confirmed by ${esc(e.review && e.review.by || 'mentor')}</b> ${e.note ? '· ' + esc(e.note) : ''}` : `<a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.url)}</a> ${vpill(e)} ${e.note ? '· ' + esc(e.note) : ''}<br><span class="cap">${esc((e.verify && e.verify.detail) || '')} · added ${fmtDate(e.added)}${e.verify && e.verify.facts && e.verify.facts.fork ? ' · fork' : ''}${e.verify && e.verify.facts && e.verify.facts.first_commit ? ` · commits ${esc(e.verify.facts.first_commit)} → ${esc(e.verify.facts.last_commit)}` : ''}</span>`}
        ${e.review ? `<div class="note ${e.review.verdict === 'redo' ? 'redo' : ''}">${e.review.verdict === 'redo' ? 'Redo asked' : 'Reviewed OK'}${e.review.comment ? ': ' + esc(e.review.comment) : ''} <span class="cap">· ${esc(e.review.by || '')} ${fmtDate(e.review.at)}</span></div>` : ''}</div>` : ''}
      <div class="row" style="margin-top:8px">
        ${e && e.type !== 'mentor_confirmed' ? `<button class="btn sm ghost" data-rev="ok" data-s="${x.id}">Looks good</button><button class="btn sm ghost" data-rev="redo" data-s="${x.id}">Ask to redo</button>` : ''}
        ${!e ? `<button class="btn sm ghost" data-confirm="${x.id}">Confirm in person</button>` : e.type === 'mentor_confirmed' ? `<button class="btn sm ghost" data-unconfirm="${x.id}">Undo confirm</button>` : ''}
        ${!evc[x.id] && st.focus_skill !== x.id ? `<button class="btn sm ghost" data-focus="${x.id}">Make this the focus</button>` : st.focus_skill === x.id ? `<button class="btn sm ghost" data-focus="">Clear focus</button>` : ''}
      </div>
      <form class="evf" data-rf="${x.id}" hidden><input name="comment" placeholder="One line for the student (optional)" style="width:100%"><input type="hidden" name="verdict"><div class="row"><button class="btn sm" type="submit">Send</button><button class="btn sm ghost" type="button" data-rc="${x.id}">Cancel</button></div></form></div>`; };
  const a = st.answers || {};
  app.innerHTML = `<p class="cap"><a href="#/mentor">← Your students</a>${me && me.user.role === 'admin' ? ' · <a href="#/admin">People list</a>' : ''}</p>
    <div class="row between" style="align-items:flex-start"><div><h1 style="font-size:clamp(22px,5vw,30px)">${esc(st.name || st.email)}</h1><p class="small" style="margin:4px 0">${esc(st.email)} · ${esc(st.college || '')} ${a.branch ? '· ' + esc(LABEL['branch:' + a.branch] || a.branch) : ''} ${a.college_tier ? '· tier ' + esc(a.college_tier) : ''} ${a.graduation_year ? '· ' + esc(LABEL['graduation_year:' + a.graduation_year] || a.graduation_year) : ''}<br><span class="cap">joined ${fmtDate(st.created)} · last active ${agoDays(st.last_active)} · GitHub ${esc(st.handles.github || '—')} · LeetCode ${esc(st.handles.leetcode || '—')}${st.public && st.public.enabled ? ` · <a href="#/p/${esc(st.public.slug)}">public page</a>` : ''}</span></p></div>${rd ? `<div style="text-align:center;font-size:12px"><div class="ring" style="--p:${rd.pct}"><b>${rd.pct}%</b></div><div style="margin-top:4px">${esc(p.name)}</div></div>` : ''}</div>
    ${st.flags.length ? `<div>${st.flags.map(f => `<span class="flag">${esc(f.text)}</span>`).join('')}</div>` : ''}
    <h2>Standing${p ? ' · ' + esc(p.name) : ''}</h2>
    ${p ? (p.skills || []).map(row).join('') : '<p class="small">This student has not picked a route yet.</p>'}
    <h2>Notes</h2><form class="card" id="note" style="display:grid;gap:8px"><textarea name="text" rows="3" placeholder="What should they do this week? One or two lines; the student gets it by email if email is on."></textarea><div><button class="btn sm" type="submit">Send note</button></div></form>
    ${(st.notes || []).map(n => `<div class="note"><b>${esc(n.by || '')}</b> <span class="cap">${fmtDate(n.at)}</span><br>${esc(n.text)}</div>`).join('')}`;
  const again = () => mentorStudent(sid);
  app.querySelectorAll('[data-rev]').forEach(b => b.addEventListener('click', () => { const f = app.querySelector(`form[data-rf="${b.dataset.s}"]`); f.hidden = false; f.verdict.value = b.dataset.rev; f.comment.placeholder = b.dataset.rev === 'redo' ? 'What should change? (the student sees this)' : 'One line for the student (optional)'; f.comment.focus(); }));
  app.querySelectorAll('[data-rc]').forEach(b => b.addEventListener('click', () => { app.querySelector(`form[data-rf="${b.dataset.rc}"]`).hidden = true; }));
  app.querySelectorAll('form[data-rf]').forEach(f => f.addEventListener('submit', async e => { e.preventDefault(); try { await api(`mentor/students/${sid}/review`, { method: 'PUT', body: { skill_id: f.dataset.rf, verdict: f.verdict.value, comment: f.comment.value.trim() } }); track('mentor_review', { verdict: f.verdict.value }); toast('Sent'); again(); } catch (er) { toast(er.message); } }));
  app.querySelectorAll('[data-confirm]').forEach(b => b.addEventListener('click', async () => { const c = prompt('Confirm ' + (KBY[b.dataset.confirm] || {}).name + ' in person: what did you see or discuss? (one line, shown to the student)'); if (c == null) return; try { await api(`mentor/students/${sid}/plan`, { method: 'PUT', body: { confirm_skill: b.dataset.confirm, comment: c } }); again(); } catch (er) { toast(er.message); } }));
  app.querySelectorAll('[data-unconfirm]').forEach(b => b.addEventListener('click', async () => { try { await api(`mentor/students/${sid}/plan`, { method: 'PUT', body: { unconfirm_skill: b.dataset.unconfirm } }); again(); } catch (er) { toast(er.message); } }));
  app.querySelectorAll('[data-focus]').forEach(b => b.addEventListener('click', async () => { try { await api(`mentor/students/${sid}/plan`, { method: 'PUT', body: { focus_skill: b.dataset.focus || null } }); again(); } catch (er) { toast(er.message); } }));
  document.getElementById('note').addEventListener('submit', async e => { e.preventDefault(); const f = e.target; if (!f.text.value.trim()) return; try { await api(`mentor/students/${sid}/note`, { method: 'POST', body: { text: f.text.value.trim() } }); track('mentor_note'); toast('Sent'); again(); } catch (er) { toast(er.message); } });
}

// ---------- admin console ----------
async function adminPage(q) {
  setNav('admin'); if (!signedIn()) { location.hash = '#/signin'; return; }
  app.innerHTML = '<p class="cap">…</p>';
  try { await loadMe(); } catch (e) { app.innerHTML = `<p>${esc(e.message)}</p>`; return; }
  if (me.user.role !== 'admin') { app.innerHTML = '<h2 style="margin-top:0">Admin only</h2>'; return; }
  let o, u; try { [o, u] = await Promise.all([api('admin/overview'), api('admin/users' + (q ? '?q=' + encodeURIComponent(q) : ''))]); } catch (e) { app.innerHTML = `<p>${esc(e.message)}</p>`; return; }
  track('admin_viewed');
  const F = ['start', 'quiz_done', 'results_viewed', 'plan_viewed', 'signin_started', 'signed_in', 'proof_added', 'check_done', 'public_on', 'mentor_linked'];
  const stat = (v, l) => `<div class="stat"><b>${v}</b><span>${esc(l)}</span></div>`;
  app.innerHTML = `<h1 style="font-size:clamp(22px,5vw,30px)">Admin</h1>
    <div class="row" style="margin:12px 0">${stat(o.users, 'accounts')}${stat(o.active_7d, 'active last 7 days')}${stat(o.roles.mentor || 0, 'mentors')}${stat(o.mentor_links, 'mentor links')}${stat(o.proofs, 'proofs')}${stat(o.checks_taken, 'checks taken')}</div>
    <p class="small">Proof status: ${Object.entries(o.proof_status).map(([k, v]) => `<span class="pill ${k === 'none' ? 'good' : k}">${esc(k)} ${v}</span>`).join(' ') || '—'} · Routes: ${Object.entries(o.paths).sort((a, b) => b[1] - a[1]).map(([k, v]) => `${esc(PBY[k] ? PBY[k].name : k)} ${v}`).join(', ') || '—'}</p>
    <h2>Funnel</h2><div class="tw"><table><thead><tr><th>event</th><th>7 days</th><th>30 days</th><th>all</th></tr></thead><tbody><tr><td>sessions</td><td>${o.sessions['7d']}</td><td>${o.sessions['30d']}</td><td>${o.sessions.all}</td></tr>${F.map(k => `<tr><td>${esc(k)}</td><td>${o.funnel['7d'][k] || 0}</td><td>${o.funnel['30d'][k] || 0}</td><td>${o.funnel.all[k] || 0}</td></tr>`).join('')}</tbody></table></div>
    <h2>Assign a mentor</h2><form class="card row" id="assign"><input name="student" type="email" placeholder="student email" style="flex:1;min-width:180px"><input name="mentor" type="email" placeholder="mentor email" style="flex:1;min-width:180px"><button class="btn sm" type="submit">Send request</button></form><p class="cap">The student gets a request to allow it. Nothing is shared until they do.</p>
    <h2>People · ${u.total}</h2><p><input id="uq" placeholder="Search email, name, college" value="${esc(q || '')}" style="width:100%;max-width:420px"></p>
    <div class="tw"><table><thead><tr><th>email</th><th>name</th><th>role</th><th>route</th><th>mentor</th><th>active</th></tr></thead><tbody>${u.users.map(x => `<tr><td><a href="#/mentor/${esc(x.id)}"><b>${esc(x.email)}</b></a><br><span class="cap">open their view</span></td><td>${esc(x.name || '')}<br><span class="cap">${esc(x.college || '')}</span></td><td><select data-role="${x.id}"><option ${x.role === 'student' ? 'selected' : ''}>student</option><option ${x.role === 'mentor' ? 'selected' : ''}>mentor</option><option ${x.role === 'admin' ? 'selected' : ''}>admin</option></select>${x.mentor_code ? `<br><span class="cap" style="font-family:var(--mono)">${esc(x.mentor_code)}</span>` : ''}</td><td>${esc(x.primary_path ? (PBY[x.primary_path] || {}).name || x.primary_path : '—')}</td><td>${x.mentor ? esc(x.mentor.name) + (x.mentor.status === 'pending' ? ' <span class="cap">(pending)</span>' : '') : '—'}</td><td class="cap">${agoDays(x.last_active)}</td></tr>`).join('')}</tbody></table></div>
    <div class="row" style="margin-top:16px"><button class="btn sm ghost" id="digest">Send the weekly digest now</button><span class="cap" id="dmsg"></span></div>
    <p class="cap" style="margin-top:12px">Exports (events and quiz responses as CSV) use the export key from SSM; the Monday ops agent already reads them. Version ${esc(o.version)}.</p>`;
  app.querySelectorAll('[data-role]').forEach(sel => sel.addEventListener('change', async () => { try { await api('admin/users/' + sel.dataset.role, { method: 'PUT', body: { role: sel.value } }); toast('Saved'); adminPage(q); } catch (er) { toast(er.message); } }));
  document.getElementById('assign').addEventListener('submit', async e => { e.preventDefault(); const f = e.target; try { await api('admin/assign', { method: 'PUT', body: { student_email: f.student.value.trim(), mentor_email: f.mentor.value.trim() } }); toast('Request sent'); adminPage(q); } catch (er) { toast(er.message); } });
  const uq = document.getElementById('uq'); uq.addEventListener('change', () => { location.hash = '#/admin/' + encodeURIComponent(uq.value.trim()); });
  document.getElementById('digest').addEventListener('click', async () => { const m = document.getElementById('dmsg'); m.textContent = '…'; try { const j = await api('admin/digest', { method: 'POST' }); m.textContent = `${j.mentors.length} mentor digest(s), ${j.students.length} student nudge(s)` + (j.email_enabled ? ' sent' : ' — email is off (no SES sender set), nothing was sent'); } catch (er) { m.textContent = er.message; } });
}

function route() {
  const h = location.hash.replace(/^#\/?/, ''); const [r, a] = h.split('/'); window.scrollTo({ top: 0 }); applyChrome();
  if (!r) return home();
  if (r === 'quiz') return quiz(parseInt(a || '0', 10) || 0);
  if (r === 'results') return results();
  if (r === 'plan') return planPreview(a);
  if (r === 'signin') return signin();
  if (r === 'me') return mePage(a);
  if (r === 'p') return publicPage(decodeURIComponent(a || ''));
  if (r === 'check') return checkPage(a);
  if (r === 'mentor') return mentorPage(a);
  if (r === 'admin') return adminPage(decodeURIComponent(a || ''));
  if (r === 'paths') return pathsList();
  if (r === 'path') return pathPage(a);
  if (r === 'jobs') return jobsPage(a, '');
  if (r === 'sources' || r === 'evidence') return sources('');
  if (r === 'about') return about();
  home();
}
window.addEventListener('hashchange', route);
route();
</script>
