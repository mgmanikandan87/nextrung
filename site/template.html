<title>Disha for Engineers</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F6F7F4; --surface:#FFFFFF; --ink:#1B2A4A; --ink-2:#4B5768; --ink-3:#7C8797; --line:#DDE1DA;
  --accent:#0E7C6B; --accent-ink:#FFFFFF; --accent-soft:#E3F1EC;
  --grow:#1E7F4F; --grow-soft:#E1F2E7; --steady:#4F6B8F; --steady-soft:#E6ECF4; --shrink:#B7600A; --shrink-soft:#F8E9D8;
  --neg:#A63D2F; --neg-soft:#F6E3DF;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",sans-serif; --body:"IBM Plex Sans","Segoe UI",Helvetica,Arial,sans-serif; --mono:"IBM Plex Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F151E; --surface:#161E29; --ink:#E7EAF0; --ink-2:#B4BCC8; --ink-3:#7F8A9A; --line:#2A3441;
  --accent:#3FB59F; --accent-ink:#0B1A16; --accent-soft:#16302B;
  --grow:#5CC98A; --grow-soft:#16301F; --steady:#8FB0DA; --steady-soft:#1B2738; --shrink:#E5A25A; --shrink-soft:#3A2A14;
  --neg:#E2867A; --neg-soft:#3A2220;
}}
:root[data-theme="dark"]{
  --bg:#0F151E; --surface:#161E29; --ink:#E7EAF0; --ink-2:#B4BCC8; --ink-3:#7F8A9A; --line:#2A3441;
  --accent:#3FB59F; --accent-ink:#0B1A16; --accent-soft:#16302B;
  --grow:#5CC98A; --grow-soft:#16301F; --steady:#8FB0DA; --steady-soft:#1B2738; --shrink:#E5A25A; --shrink-soft:#3A2A14;
  --neg:#E2867A; --neg-soft:#3A2220;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;margin:0}
a{color:var(--accent)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .in{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:-.01em;text-decoration:none;color:var(--ink)}
.brand small{font-family:var(--body);font-weight:500;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-left:8px}
nav{display:flex;gap:4px}
nav a{font-size:14px;font-weight:500;color:var(--ink-2);text-decoration:none;padding:6px 10px;border-radius:6px}
nav a.on{background:var(--accent-soft);color:var(--accent)}
main{max-width:760px;margin:0 auto;padding:24px 16px 64px}
h1,h2,h3{font-family:var(--display);letter-spacing:-.015em;line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(30px,6vw,44px);font-weight:700}
h2{font-size:24px;font-weight:700;margin-top:36px;margin-bottom:12px}
h3{font-size:18px;font-weight:700;margin-top:20px;margin-bottom:8px}
p{margin:0 0 12px;max-width:66ch}
.lead{font-size:19px;color:var(--ink-2);max-width:60ch}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:16px;border:0;border-radius:8px;padding:12px 18px;cursor:pointer;text-decoration:none;font-family:var(--body)}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn:focus-visible,.opt:focus-visible,nav a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:22px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.stat b{display:block;font-family:var(--mono);font-size:26px;font-weight:500;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--ink-2)}
.bars{display:grid;gap:8px;margin:14px 0 6px}
.bar{display:grid;grid-template-columns:minmax(120px,1.2fr) 3fr;gap:10px;align-items:center;font-size:13px}
.bar .lbl{color:var(--ink-2);line-height:1.25}
.bar .trk{display:flex;align-items:center;gap:8px}
.bar .fill{height:14px;background:var(--accent);border-radius:3px;min-width:2px}
.bar.dim .fill{background:var(--steady)}
.bar .val{font-family:var(--mono);font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.cap{font-size:12px;color:var(--ink-3)}
.pill{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.02em;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.growing{background:var(--grow-soft);color:var(--grow)}
.pill.steady{background:var(--steady-soft);color:var(--steady)}
.pill.shrinking{background:var(--shrink-soft);color:var(--shrink)}
.pill.official{background:var(--grow-soft);color:var(--grow)} .pill.industry{background:var(--steady-soft);color:var(--steady)} .pill.media{background:var(--shrink-soft);color:var(--shrink)} .pill.low{background:var(--neg-soft);color:var(--neg)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;margin:12px 0}
.card.rank{border-left:5px solid var(--accent)}
.card h3{margin-top:0}
.reason{display:grid;grid-template-columns:22px 1fr;gap:8px;font-size:14px;margin:6px 0}
.reason .s{font-family:var(--mono);font-weight:500;text-align:right}
.reason.pos .s{color:var(--grow)} .reason.neg .s{color:var(--neg)}
.q{max-width:640px}
.prog{height:6px;background:var(--line);border-radius:3px;margin:14px 0 22px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);transition:width .25s}
.opts{display:grid;gap:8px;margin:14px 0}
.opt{display:flex;align-items:center;gap:12px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;font:inherit;color:var(--ink);width:100%}
.opt .k{width:22px;height:22px;border-radius:50%;border:2px solid var(--ink-3);flex:0 0 auto;display:grid;place-items:center}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .k{border-color:var(--accent);background:var(--accent)}
.opt.multi .k{border-radius:5px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.tw{overflow-x:auto;margin:10px 0 18px;-webkit-overflow-scrolling:touch}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.kv{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.kv .eyebrow{margin-bottom:4px}
.kv b{font-family:var(--mono);font-weight:500;font-size:22px;font-variant-numeric:tabular-nums}
.kv p{font-size:13px;color:var(--ink-2);margin:6px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;padding:4px 9px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.chip.f3{border-color:var(--grow);color:var(--grow);font-weight:600}.chip.f2{border-color:var(--accent);color:var(--accent)}.chip.f0{color:var(--ink-3);text-decoration:line-through}
details{border:1px solid var(--line);border-radius:10px;background:var(--surface);margin:8px 0}
summary{cursor:pointer;padding:12px 14px;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:10px}
summary::after{content:"+";font-family:var(--mono);color:var(--ink-3)}
details[open] summary::after{content:"–"}
details .in{padding:0 14px 14px;font-size:14px}
details h4{margin:10px 0 4px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
details ul{margin:0;padding-left:18px}
ul.clean{padding-left:18px;margin:0 0 12px}
li{margin:3px 0}
.src{font-size:13px;color:var(--ink-2)}
.src li{margin:4px 0}
.list{display:grid;gap:10px}
.pathrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;text-decoration:none;color:var(--ink)}
.pathrow .t{font-weight:600}.pathrow .d{font-size:13px;color:var(--ink-2)}
.note{border-left:3px solid var(--shrink);padding:8px 12px;background:var(--shrink-soft);border-radius:0 8px 8px 0;font-size:14px;margin:12px 0}
input,select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
footer{max-width:760px;margin:0 auto;padding:16px;font-size:13px;color:var(--ink-3);border-top:1px solid var(--line)}
@media (max-width:480px){ nav a{padding:6px 7px;font-size:13px} .brand small{display:none} .bar{grid-template-columns:1fr;gap:3px} }
@media (prefers-reduced-motion:reduce){ .prog i{transition:none} }
</style>

<div class="top"><div class="in">
  <a class="brand" href="#/">Disha<small>for engineers</small></a>
  <nav id="nav"><a href="#/quiz" data-r="quiz">Find my direction</a><a href="#/paths" data-r="paths">Paths</a><a href="#/evidence" data-r="evidence">Evidence</a><a href="#/about" data-r="about">About</a></nav>
</div></div>
<main id="app"></main>
<footer>Open-source, evidence-first guidance for Indian engineering graduates. Numbers refreshed <span id="asof"></span>. Nothing here is a guarantee of a job; it is the best available evidence, with sources.</footer>

<script id="data" type="application/json">/*__DATA__*/</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const PATHS = D.paths, QS = D.questions.questions, STATS = D.stats;
const SBY = Object.fromEntries(STATS.map(s => [s.id, s]));
const PBY = Object.fromEntries(PATHS.map(p => [p.id, p]));
const LABEL = {}; QS.forEach(q => q.options.forEach(o => LABEL[q.field + ':' + o.value] = o.label));
document.getElementById('asof').textContent = (STATS[0] && STATS[0].as_of) || '';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const inr = n => { if (n == null) return '—'; const a = Math.abs(n); if (a >= 1e7) return (n/1e7).toFixed(a >= 1e9 ? 0 : 2).replace(/\.00$/,'') + ' crore'; if (a >= 1e5) return (n/1e5).toFixed(a >= 1e6 ? 1 : 2).replace(/\.?0+$/,'') + ' lakh'; return n.toLocaleString('en-IN'); };
const fmt = s => { if (s.value == null) return '—'; if (s.unit === 'ratio') return (s.value*100).toFixed(Math.abs(s.value) < 0.1 ? 1 : 0) + '%'; if (s.unit === 'INR') return '₹' + inr(s.value); if (s.unit === 'INR per year' || s.unit === 'INR per month') return '₹' + s.value.toLocaleString('en-IN'); if (s.unit === 'people' || s.unit === 'seats' || s.unit === 'students' || s.unit === 'openings') return inr(s.value); return s.value.toLocaleString('en-IN'); };
const statLink = id => { const s = SBY[id]; if (!s) return ''; return `<a href="${esc(s.source_url||'#')}" target="_blank" rel="noopener">${esc(s.source_title||id)}</a> <span class="cap">(${esc(s.period)}) <span class="pill ${s.confidence}">${s.confidence}</span></span>`; };

// ---------- state ----------
let answers = {};
try { answers = JSON.parse(localStorage.getItem('disha.answers') || '{}') || {}; } catch (e) { answers = {}; }
const save = () => { try { localStorage.setItem('disha.answers', JSON.stringify(answers)); } catch (e) {} };

// ---------- matcher ----------
function score(path, a) {
  const hits = [];
  for (const r of path.fit_rules) {
    const v = a[r.field]; if (v == null) continue;
    const matched = Array.isArray(v) ? v.includes(r.value) : String(v) === String(r.value);
    if (matched) hits.push(r);
  }
  const total = path.base_score + hits.reduce((s, r) => s + r.score, 0);
  return { path, total, hits: hits.sort((x, y) => y.score - x.score) };
}
function rank(a) { return PATHS.map(p => score(p, a)).sort((x, y) => y.total - x.total); }
function profileLine(a) {
  const parts = [];
  if (a.branch) parts.push(LABEL['branch:' + a.branch]);
  if (a.college_tier) parts.push('tier-' + a.college_tier + ' college');
  if (a.region) parts.push(LABEL['region:' + a.region].split(' (')[0]);
  if (a.relocation) parts.push(LABEL['relocation:' + a.relocation].toLowerCase());
  return parts.join(', ');
}
function explain(r, i) {
  const pos = r.hits.filter(h => h.score > 0).slice(0, 2).map(h => h.reason.replace(/\.$/, ''));
  const neg = r.hits.filter(h => h.score < 0)[0];
  let t = `${r.path.name} ranks ${['first','second','third'][i]}`;
  t += pos.length ? ` because ${pos.join('; and ')}.` : ` mainly on the size of its door this year.`;
  if (neg) t += ` Watch out: ${neg.reason.replace(/\.$/, '')}.`;
  const fb = PBY[r.path.fallback_path_id]; if (fb) t += ` Fallback that shares most of the preparation: ${fb.name}.`;
  return t;
}

// ---------- views ----------
const app = document.getElementById('app');
function setNav(r) { document.querySelectorAll('#nav a').forEach(x => x.classList.toggle('on', x.dataset.r === r)); }

function home() {
  setNav('');
  const g = STATS.find(s => s.id === 'supply.aishe.btech_outturn.2023_24');
  const fy24 = SBY['supply.teamlease.it_fresher_hiring.fy24'], gccF = SBY['demand.gcc.fresher_share.2025'], ent = SBY['demand.xpheno.entry_level_openings.2026'];
  const bars = [
    ['B.E./B.Tech graduates a year', 820000, 'supply.aishe.btech_outturn.2023_24', false],
    ['Employable, India Skills Report 2026 (70%)', 575000, 'supply.isr2026.employability.btech', true],
    ['Employable, Mercer-Mettl 2025 (42.6%)', 350000, 'supply.mettl2025.employability.overall', true],
    ['IT services freshers hired, FY24', 160000, 'supply.teamlease.it_fresher_hiring.fy24', false],
    ['Top-5 IT firms fresher plans, FY27', 70000, 'demand.tcs.fresher_offers.fy27', false],
    ['GCC entry-level jobs a year (to 2030)', 20000, 'demand.gcc.entry_level_jobs_to_2030', false],
    ['Government / PSU engineer posts a year', 10000, 'paths.govt.upsc_ese_posts.2026', false],
  ];
  const max = 820000;
  app.innerHTML = `
  <div class="eyebrow">For final-year students and recent graduates, every branch</div>
  <h1>The first rung of the ladder is gone. Here is where the doors actually are.</h1>
  <p class="lead" style="margin-top:14px">AI agents now do the routine work freshers were hired for. IT services, the door most of India's engineers were told to walk through, is closing. Ten questions, and you get two or three directions with the evidence, a two-year plan and who is hiring.</p>
  <div class="row" style="margin:18px 0 8px"><a class="btn" href="#/quiz">Find my direction</a><a class="btn ghost" href="#/paths">See all nine paths</a></div>
  <div class="stats">
    <div class="stat"><b>${inr(g.value)}</b><span>engineering degree holders a year (AISHE 2023-24)</span></div>
    <div class="stat"><b>${inr(fy24.value)}</b><span>IT services fresher hires in FY24, down from 4 lakh in FY22</span></div>
    <div class="stat"><b>${(gccF.value*100)|0}%</b><span>fresher share of GCC hiring in 2025, from 28% in 2024</span></div>
    <div class="stat"><b>${inr(ent.value)}</b><span>live entry-level tech openings, May 2026, down 44%</span></div>
  </div>
  <h2>Supply versus the doors</h2>
  <p class="cap">People per year. Each bar is an independent estimate from the source named; they are not a funnel of the same people.</p>
  <div class="bars">${bars.map(b => `<div class="bar ${b[3]?'dim':''}"><div class="lbl">${esc(b[0])}</div><div class="trk"><div class="fill" style="width:${(b[1]/max*100).toFixed(1)}%"></div><span class="val">${inr(b[1])}</span></div></div>`).join('')}</div>
  <p class="cap">Sources on the <a href="#/evidence">evidence page</a>. The employability bars are two different tests of the same cohort; the truth is between them.</p>
  <h2>What this is</h2>
  <p>A free, open-source guide that treats you like an adult: it tells you which doors are growing, steady or shrinking, with the numbers and where they came from. It does not sell a course. Every direction comes with a plan you can start this week using mostly free resources, one project that gets you through interviews, and a fallback that shares most of the preparation.</p>
  <p>It is a rules engine, not a chatbot. Every ranking it gives can be explained back to you in plain words, and you can see the rules on each path page.</p>`;
}

function quiz(step) {
  setNav('quiz');
  step = Math.max(0, Math.min(QS.length - 1, step || 0));
  const q = QS[step];
  const cur = answers[q.field];
  const sel = v => q.type === 'multi' ? (Array.isArray(cur) && cur.includes(v)) : String(cur) === String(v);
  app.innerHTML = `<div class="q">
    <div class="eyebrow">Question ${step + 1} of ${QS.length}</div>
    <div class="prog"><i style="width:${((step) / QS.length * 100).toFixed(0)}%"></i></div>
    <h2 style="margin-top:0">${esc(q.prompt)}</h2>
    ${q.type === 'multi' ? `<p class="cap">Pick up to ${q.max}.</p>` : ''}
    <div class="opts">${q.options.map(o => `<button class="opt ${q.type} ${sel(o.value) ? 'sel' : ''}" data-v="${esc(o.value)}" id="opt-${q.id}-${esc(o.value)}"><span class="k"></span><span>${esc(o.label)}</span></button>`).join('')}</div>
    <div class="row" style="margin-top:18px">
      ${step > 0 ? `<a class="btn ghost" href="#/quiz/${step - 1}">Back</a>` : ''}
      <a class="btn" id="next" href="#/quiz/${step + 1}">${step === QS.length - 1 ? 'Show my directions' : 'Next'}</a>
    </div></div>`;
  const next = document.getElementById('next');
  if (step === QS.length - 1) next.href = '#/results';
  const refresh = () => { const ok = q.type === 'multi' ? (Array.isArray(answers[q.field]) && answers[q.field].length > 0) : answers[q.field] != null; next.style.opacity = ok ? 1 : .45; next.style.pointerEvents = ok ? 'auto' : 'none'; };
  refresh();
  app.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => {
    const v = b.dataset.v;
    if (q.type === 'multi') {
      let arr = Array.isArray(answers[q.field]) ? [...answers[q.field]] : [];
      if (v === 'none') arr = arr.includes('none') ? [] : ['none'];
      else { arr = arr.filter(x => x !== 'none'); arr = arr.includes(v) ? arr.filter(x => x !== v) : [...arr, v].slice(-q.max); }
      answers[q.field] = arr;
      app.querySelectorAll('.opt').forEach(x => x.classList.toggle('sel', arr.includes(x.dataset.v)));
    } else {
      answers[q.field] = v;
      app.querySelectorAll('.opt').forEach(x => x.classList.toggle('sel', x.dataset.v === v));
      save(); refresh();
      setTimeout(() => { location.hash = next.getAttribute('href'); }, 180);
      return;
    }
    save(); refresh();
  }));
}

function results() {
  setNav('quiz');
  const answered = QS.filter(q => answers[q.field] != null && !(Array.isArray(answers[q.field]) && !answers[q.field].length)).length;
  if (answered < 4) { app.innerHTML = `<h2 style="margin-top:0">Answer the questions first</h2><p>The ranking needs at least your branch, college, and what you like working on.</p><a class="btn" href="#/quiz">Start</a>`; return; }
  const ranked = rank(answers);
  const top = ranked.slice(0, 3);
  app.innerHTML = `
    <div class="eyebrow">Your directions</div>
    <h1 style="font-size:clamp(26px,5vw,36px)">${esc(profileLine(answers) || 'Your profile')}</h1>
    <p class="lead">Ranked on realism plus fit: how many fresher seats the door has this year, then how well it matches what you told us. Every point is explained.</p>
    ${top.map((r, i) => `<div class="card rank">
      <div class="row" style="justify-content:space-between"><h3>${i + 1}. ${esc(r.path.name)}</h3><span class="pill ${r.path.door_state}">${r.path.door_state} door</span></div>
      <p style="margin-top:6px">${esc(explain(r, i))}</p>
      <div class="eyebrow" style="margin-top:12px">Why this score (${r.path.base_score} base ${r.total - r.path.base_score >= 0 ? '+' : '−'} ${Math.abs(r.total - r.path.base_score)} fit = ${r.total})</div>
      ${r.hits.map(h => `<div class="reason ${h.score > 0 ? 'pos' : 'neg'}"><span class="s">${h.score > 0 ? '+' : ''}${h.score}</span><span>${esc(h.reason)}</span></div>`).join('') || '<p class="cap">No profile rule matched; ranked on door size alone.</p>'}
      <div class="row" style="margin-top:12px"><a class="btn" href="#/path/${r.path.id}">Open the ${esc(r.path.name)} plan</a></div>
    </div>`).join('')}
    <h2>The rest, for comparison</h2>
    <div class="list">${ranked.slice(3).map(r => `<a class="pathrow" href="#/path/${r.path.id}"><span><span class="t">${esc(r.path.name)}</span><br><span class="d">${esc(r.path.tagline)}</span></span><span class="val" style="font-family:var(--mono)">${r.total}</span></a>`).join('')}</div>
    <p class="cap" style="margin-top:18px"><a href="#/quiz/0">Change my answers</a> · <a href="#" id="reset">Clear and start over</a></p>`;
  document.getElementById('reset').addEventListener('click', e => { e.preventDefault(); answers = {}; save(); location.hash = '#/quiz'; });
}

function pathsList() {
  setNav('paths');
  const order = [...PATHS].sort((a, b) => b.base_score - a.base_score);
  app.innerHTML = `<div class="eyebrow">Nine directions</div><h1 style="font-size:clamp(26px,5vw,36px)">Every realistic path, ranked by how many fresher seats it has this year</h1>

}

    <h3>What employers screen for now</h3>

      <h4>Learn</h4><ul>${b.learn.map(x => `<li>${esc(x)}</li>`).join('')}</ul>

function evidence(filter) {
  setNav('evidence');
  const groups = [['supply','Supply: how many engineers India produces'],['demand','Demand: entry-level tech hiring'],['paths','Paths: the other doors'],['gap','Gaps: numbers we could not source']];
  const f = (filter || '').toLowerCase();
  const rows = g => STATS.filter(s => s.id.startsWith(g + '.') && (!f || (s.metric + ' ' + s.source_title + ' ' + s.period).toLowerCase().includes(f)));
  app.innerHTML = `<div class="eyebrow">Evidence</div><h1 style="font-size:clamp(26px,5vw,36px)">Every number on this site, with where it came from</h1>
    <p class="lead">${STATS.length} records. Confidence: <span class="pill official">official</span> government or company filings; <span class="pill industry">industry</span> NASSCOM, staffing firms, research labs; <span class="pill media">media</span> press reporting an official figure; <span class="pill low">low</span> aggregator or unverified.</p>
    <p><input id="ev-filter" placeholder="Filter, e.g. GCC, PLFS, fresher" value="${esc(filter || '')}" style="width:100%;max-width:420px"></p>
    ${groups.map(([g, t]) => { const r = rows(g); return r.length ? `<h2>${t}</h2><div class="tw"><table><thead><tr><th>Metric</th><th>Value</th><th>Period</th><th>Source</th></tr></thead><tbody>${r.map(s => `<tr><td>${esc(s.metric)}${s.contradiction ? `<br><span class="cap">Contradiction: ${esc(s.contradiction)}</span>` : ''}</td><td class="val" style="font-family:var(--mono);white-space:nowrap">${fmt(s)}</td><td class="cap">${esc(s.period)}</td><td>${s.source_url ? `<a href="${esc(s.source_url)}" target="_blank" rel="noopener">${esc(s.source_title)}</a>` : '—'} <span class="pill ${s.confidence}">${s.confidence}</span></td></tr>`).join('')}</tbody></table></div>` : ''; }).join('')}`;
  const inp = document.getElementById('ev-filter');
  inp.addEventListener('input', () => { const pos = inp.selectionStart; evidence(inp.value); const n = document.getElementById('ev-filter'); n.focus(); n.setSelectionRange(pos, pos); });
}

function about() {
  setNav('about');
  app.innerHTML = `<div class="eyebrow">About</div><h1 style="font-size:clamp(26px,5vw,36px)">Why this exists, and how it is kept honest</h1>
  <p class="lead">India produces about 8 lakh engineering degree holders a year. The IT services door that absorbed 4 lakh of them in FY22 took 1.6 lakh in FY24 and is still shrinking, and AI agents now do the routine work that was the first rung. At least 6 lakh graduates a year need a direction that is not "join an IT services company".</p>
  <h2>How it works</h2>
  <p>Ten questions build a profile. A rules engine, not a language model, scores nine paths: a base score for how many fresher seats the door has this year, plus fit rules written by people and shown on every path page. The top three come with the rules that fired, so every ranking can be argued with.</p>
  <p>Three agent skills maintain the content: one refreshes the statistics quarterly from primary sources and refuses to emit a number without a URL; one maintains the path records (door size, pay, plan, project, employers, fit rules); one writes the graduate-facing text in plain English. Changes arrive as pull requests that maintainers review.</p>
  <h2>What it is not</h2>
  <p>It is not a job board, a course, or a guarantee. Projections from staffing firms are labelled as projections. Where two credible sources disagree, both are shown. Where no number exists, the site says so instead of inventing one.</p>
  <h2>Contribute</h2>
  <p>The data (<code>market_stats.json</code>, <code>paths.json</code>, <code>questions.json</code>), the matcher and this page are open source. Fix a number with a source, add an employer with a recent hiring page, write a path in Hindi or Tamil, or challenge a fit rule. Placement officers, hiring managers and recent graduates are the reviewers this needs most.</p>
  <p class="cap">Version 0.1, September 2026. Built to be argued with.</p>`;
}

function route() {
  const h = location.hash.replace(/^#\/?/, '');
  const [r, a, b] = h.split('/');
  window.scrollTo({ top: 0 });
  if (!r) return home();
  if (r === 'quiz') return quiz(parseInt(a || '0', 10) || 0);
  if (r === 'results') return results();
  if (r === 'paths') return pathsList();
  if (r === 'path') return pathPage(a);
  if (r === 'evidence') return evidence('');
  if (r === 'about') return about();
  home();
}
window.addEventListener('hashchange', route);
route();
</script>
