<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F6F7F4; --surface:#FFFFFF; --ink:#1B2A4A; --ink-2:#4B5768; --ink-3:#7C8797; --line:#DDE1DA;
  --accent:#0E7C6B; --accent-ink:#FFFFFF; --accent-soft:#E3F1EC;
  --grow:#1E7F4F; --grow-soft:#E1F2E7; --steady:#4F6B8F; --steady-soft:#E6ECF4; --shrink:#B7600A; --shrink-soft:#F8E9D8;
  --neg:#A63D2F; --neg-soft:#F6E3DF;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",sans-serif; --body:"IBM Plex Sans","Segoe UI",Helvetica,Arial,sans-serif; --mono:"IBM Plex Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F151E; --surface:#161E29; --ink:#E7EAF0; --ink-2:#B4BCC8; --ink-3:#7F8A9A; --line:#2A3441;
  --accent:#3FB59F; --accent-ink:#0B1A16; --accent-soft:#16302B;
  --grow:#5CC98A; --grow-soft:#16301F; --steady:#8FB0DA; --steady-soft:#1B2738; --shrink:#E5A25A; --shrink-soft:#3A2A14;
  --neg:#E2867A; --neg-soft:#3A2220;
}}
:root[data-theme="dark"]{
  --bg:#0F151E; --surface:#161E29; --ink:#E7EAF0; --ink-2:#B4BCC8; --ink-3:#7F8A9A; --line:#2A3441;
  --accent:#3FB59F; --accent-ink:#0B1A16; --accent-soft:#16302B;
  --grow:#5CC98A; --grow-soft:#16301F; --steady:#8FB0DA; --steady-soft:#1B2738; --shrink:#E5A25A; --shrink-soft:#3A2A14;
  --neg:#E2867A; --neg-soft:#3A2220;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;margin:0}
a{color:var(--accent)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .in{max-width:860px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:-.01em;text-decoration:none;color:var(--ink)}
.brand small{font-family:var(--body);font-weight:500;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-left:8px}
nav{display:flex;gap:2px;flex-wrap:wrap;justify-content:flex-end}
nav a{font-size:14px;font-weight:500;color:var(--ink-2);text-decoration:none;padding:6px 9px;border-radius:6px;white-space:nowrap}
nav a.on{background:var(--accent-soft);color:var(--accent)}
nav a.me{border:1.5px solid var(--accent);color:var(--accent)}
main{max-width:860px;margin:0 auto;padding:24px 16px 64px}
h1,h2,h3,h4{font-family:var(--display);letter-spacing:-.015em;line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(28px,5.5vw,42px);font-weight:700}
h2{font-size:23px;font-weight:700;margin-top:34px;margin-bottom:12px}
h3{font-size:18px;font-weight:700;margin-top:18px;margin-bottom:8px}
h4{font-size:15px;font-weight:700;margin:12px 0 6px}
p{margin:0 0 12px;max-width:68ch}
.lead{font-size:18px;color:var(--ink-2);max-width:62ch}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:15px;border:0;border-radius:8px;padding:11px 16px;cursor:pointer;text-decoration:none;font-family:var(--body)}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn.sm{padding:7px 11px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,.opt:focus-visible,nav a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:22px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.stat b{display:block;font-family:var(--mono);font-size:26px;font-weight:500;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--ink-2)}
.bars{display:grid;gap:8px;margin:14px 0 6px}
.bar{display:grid;grid-template-columns:minmax(120px,1.2fr) 3fr;gap:10px;align-items:center;font-size:13px}
.bar .lbl{color:var(--ink-2);line-height:1.25}
.bar .trk{display:flex;align-items:center;gap:8px}
.bar .fill{height:14px;background:var(--accent);border-radius:3px;min-width:2px}
.bar.dim .fill{background:var(--steady)}
.bar .val{font-family:var(--mono);font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.cap{font-size:12px;color:var(--ink-3)}
.small{font-size:13px;color:var(--ink-2)}
.pill{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.02em;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.growing,.pill.official,.pill.ok{background:var(--grow-soft);color:var(--grow)}
.pill.steady,.pill.industry,.pill.req{background:var(--steady-soft);color:var(--steady)}
.pill.shrinking,.pill.media,.pill.pref{background:var(--shrink-soft);color:var(--shrink)}
.pill.low,.pill.gap{background:var(--neg-soft);color:var(--neg)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;margin:12px 0}
.card.rank{border-left:5px solid var(--accent)}
.card h3{margin-top:0}
.reason{display:grid;grid-template-columns:22px 1fr;gap:8px;font-size:14px;margin:6px 0}
.reason .s{font-family:var(--mono);font-weight:500;text-align:right}
.reason.pos .s{color:var(--grow)} .reason.neg .s{color:var(--neg)}
.q{max-width:640px}
.prog{height:6px;background:var(--line);border-radius:3px;margin:14px 0 22px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);transition:width .25s}
.opts{display:grid;gap:8px;margin:14px 0}
.opt{display:flex;align-items:center;gap:12px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;font:inherit;color:var(--ink);width:100%}
.opt .k{width:22px;height:22px;border-radius:50%;border:2px solid var(--ink-3);flex:0 0 auto}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .k{border-color:var(--accent);background:var(--accent)}
.opt.multi .k{border-radius:5px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.tw{overflow-x:auto;margin:10px 0 18px;-webkit-overflow-scrolling:touch}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.kv{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.kv .eyebrow{margin-bottom:4px}
.kv b{font-family:var(--mono);font-weight:500;font-size:22px;font-variant-numeric:tabular-nums}
.kv p{font-size:13px;color:var(--ink-2);margin:6px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;padding:4px 9px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.chip.f3{border-color:var(--grow);color:var(--grow);font-weight:600}.chip.f2{border-color:var(--accent);color:var(--accent)}.chip.f0{color:var(--ink-3);text-decoration:line-through}
details{border:1px solid var(--line);border-radius:10px;background:var(--surface);margin:8px 0}
summary{cursor:pointer;padding:12px 14px;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:10px}
summary::after{content:"+";font-family:var(--mono);color:var(--ink-3)}
details[open] summary::after{content:"–"}
details .in{padding:0 14px 14px;font-size:14px}
details h4{margin:10px 0 4px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
details ul{margin:0;padding-left:18px}
ul.clean{padding-left:18px;margin:0 0 12px}
li{margin:3px 0}
.src{font-size:13px;color:var(--ink-2)}
.list{display:grid;gap:10px}
.pathrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;text-decoration:none;color:var(--ink)}
.pathrow .t{font-weight:600}.pathrow .d{font-size:13px;color:var(--ink-2)}
.note{border-left:3px solid var(--shrink);padding:8px 12px;background:var(--shrink-soft);border-radius:0 8px 8px 0;font-size:14px;margin:12px 0}
.ok-note{border-left:3px solid var(--grow);padding:8px 12px;background:var(--grow-soft);border-radius:0 8px 8px 0;font-size:14px;margin:12px 0}
input,select,textarea{font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);max-width:100%}
label.f{display:grid;gap:4px;font-size:13px;color:var(--ink-2)}
.ring{display:inline-grid;place-items:center;width:84px;height:84px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--line) 0);position:relative;flex:0 0 auto}
.ring::before{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--surface)}
.ring b{position:relative;font-family:var(--mono);font-size:18px;font-weight:500}
.skill{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line)}
.skill .st{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:700;border:2px solid var(--line);color:var(--ink-3)}
.skill .st.done{background:var(--grow);border-color:var(--grow);color:#fff}
.skill .st.prog{border-color:var(--accent);color:var(--accent)}
.skill .n{font-weight:600}
.skill .learn{font-size:13px;color:var(--ink-2);margin-top:4px}
.skill .learn a{margin-right:8px}
.evf{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.evf input,.evf select{padding:6px 8px;font-size:13px}
.match{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.mbar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;min-width:80px}
.mbar i{display:block;height:100%;background:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:9;box-shadow:0 6px 24px rgba(0,0,0,.2)}
footer{max-width:860px;margin:0 auto;padding:16px;font-size:13px;color:var(--ink-3);border-top:1px solid var(--line)}
@media (max-width:520px){ nav a{padding:6px 7px;font-size:13px} .brand small{display:none} .bar{grid-template-columns:1fr;gap:3px} .skill{grid-template-columns:auto 1fr} .skill .act{grid-column:2} }
@media (prefers-reduced-motion:reduce){ .prog i{transition:none} }
@media print{ .top,footer,.btn,.evf,.noprint,nav{display:none !important} body{background:#fff;color:#000} main{max-width:none;padding:0} .card,.kv,.skill{break-inside:avoid} a{color:#000;text-decoration:none} .ring{-webkit-print-color-adjust:exact;print-color-adjust:exact} }
</style>
