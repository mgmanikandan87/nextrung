<script id="data" type="application/json">{"paths":[{"id":"ai_native_software","name":"AI-native software","tagline":"Narrow fresher door, but the only software door that is growing in 2026","door_state":"growing","door_size":{"people_per_year":20000,"stat_ids":["demand.gcc.entry_level_jobs_to_2030","demand.xpheno.entry_level_openings.2026","demand.gcc.fresher_share.2025","demand.gcc.ai_data_platform_share_of_new_roles.q4fy26"],"caveat":"FirstMeridian projection of 1 lakh entry-level GCC jobs over 2025 to 2030 spread evenly; only about 10,000 entry-level tech openings were live in May 2026 (Xpheno), and freshers were 15% of GCC hiring in 2025, down from 28%."},"pay_band":{"low_lpa":8,"high_lpa":15,"stat_ids":["demand.fresher_ctc.bands.2026"],"note":"GCC 8 to 12 and product companies 8 to 15 for most; AI/ML roles at funded startups 18 to 25 and a few big-tech new-grad offers above 30 go to a very small number, mostly from tier-1 campuses. Source is a low-confidence salary guide."},"branches":{"CS":3,"IT":3,"ECE":2,"EE":1,"MECH":1,"CIVIL":0,"CHEM":0,"OTHER":1},"tiers_realistic":{"tier1":"Yes. GCCs, product companies and AI startups still run campus drives at IITs, NITs, IIITs and BITS, but even there 38% of the 2024 IIT batch was unplaced (supply.iit.unplaced_share.2024), so the brand alone no longer closes the offer.","tier2":"Yes, with a portfolio. Off-campus drives (Amazon SDE-1, Fractal Imagineers, Mu Sigma, Zoho, Flipkart GRiD) accept any college; a 7+ CGPA filter and an online coding test are the first gates, then the shipped project decides.","tier3":"Possible but the minority outcome; expect 12 to 18 months of building before the first offer. What substitutes for the brand: a deployed, working AI application in a real domain with a public repo and a written evaluation, plus one open-source contribution or a paid freelance build. Only 6 in 100 tech postings were entry-level in mid-2026 (demand.prepnplaced.entry_level_posting_share.2026), so apply through hackathons, hiring challenges and referrals, not job boards alone. Employability for AI/ML roles among graduates tested was 46% (supply.mettl2025.employability.ai_ml_roles): most applicants fail the basics, so basics done properly are a real edge."},"entry_requirements":["Python with the standard data stack (pandas, FastAPI or Flask) and SQL: every online test and take-home starts here","Data structures and algorithms at LeetCode easy-to-medium level; still the first screen at Amazon, Flipkart, Razorpay, Zoho","One deployed project that calls an LLM API, uses retrieval (RAG), has written evals and is visible on GitHub with a README a recruiter can run","One cloud (AWS, Azure or GCP) at free-tier level: deploy a container, set up a queue, read logs, know what a bill looks like","Git, Docker, basic Linux and CI (GitHub Actions); GCC interviews ask how you shipped, not just what you built","Ability to explain a system you built for 30 minutes, including what broke and how you tested it; interviewers now assume the code was AI-assisted and probe understanding","7+ CGPA and no active backlogs for most GCC and analytics trainee filters (Fractal Imagineers screens on both)"],"two_year_plan":[{"block":"H1","title":"Foundations: Python, SQL, DSA, one cloud","learn":["Python properly: NPTEL 'Programming, Data Structures and Algorithms using Python' (free), then Harvard CS50P (free)","SQL on a real dataset: SQLBolt then Mode SQL tutorial; practice joins, window functions, indexes on PostgreSQL","DSA: 150 LeetCode problems (arrays, strings, hashing, trees, graphs, DP basics) at 1 to 2 a day","Git and GitHub, Linux shell, Docker basics via the free Docker curriculum","AWS Cloud Practitioner material (free digital training) or Microsoft Learn AZ-900; FutureSkills Prime cloud pathway if you want a government-recognised certificate at no cost"],"build":["A CLI or small web app (FastAPI) that reads and writes a PostgreSQL database, deployed on Render, Railway or AWS free tier","A public GitHub profile with weekly commits; README for every repo"],"evidence":["Deployed URL plus repo","LeetCode profile with 150 solved","One cloud fundamentals certificate"],"target":["TCS NQT, Infosys, Cognizant GenC as fallback registrations","Flipkart GRiD if in third year","College hackathons"]},{"block":"H2","title":"Build with LLM APIs, RAG and evals","learn":["Calling LLM APIs (OpenAI, Anthropic, Gemini, or open models via Ollama and Hugging Face): prompts, structured outputs, tool calling, streaming, cost and token maths","Retrieval-augmented generation: chunking, embeddings, pgvector or Chroma, hybrid search, re-ranking","Evals: build a 50-question test set for your app, score it automatically, track regressions; read the OpenAI and Anthropic eval cookbooks","Agent frameworks at a working level (LangGraph, the OpenAI Agents SDK, or CrewAI); understand what they do so you can also build without them","Observability: log every prompt, latency and cost; use Langfuse (open-source) or OpenTelemetry"],"build":["The evidenced project below: an agentic assistant over real domain documents with retrieval, evals and a cost dashboard","A second, smaller build: a data pipeline (Airflow or Prefect, free) that loads a public dataset into a warehouse (DuckDB or BigQuery sandbox) and refreshes daily"],"evidence":["Demo video under 3 minutes","Eval results table in the README","Blog post on one hard bug"],"target":["Fractal Imagineers, Mu Sigma trainee decision scientist","Zoho off-campus developer roles","Internship applications at GCCs (Sparkplug-style programmes if your college is on the list)"]},{"block":"H3","title":"Production skills and a domain","learn":["System design for freshers: queues, caching, idempotency, retries, rate limits; design one service end to end on paper","Testing and CI: pytest, GitHub Actions, contract tests for your API","Kubernetes basics (minikube) and infrastructure as code (Terraform free tier) for platform and MLOps roles","Security basics: OWASP top 10, secrets management, prompt-injection defences for LLM apps","Pick one domain (banking, insurance, logistics, healthcare, retail, telecom) and learn its vocabulary and its regulator's rules; GCCs hire into domains"],"build":["Harden the H2 project: auth, rate limiting, CI, a load test, a runbook","One open-source contribution (a bug fix or docs PR to LangGraph, Langfuse, FastAPI or a similar project)"],"evidence":["Merged PR link","Architecture diagram and runbook in the repo","Load-test numbers"],"target":["Amazon SDE-1 off-campus, Razorpay, Flipkart, Zoho","GCC early-careers pages (Goldman Sachs, Deloitte USI, Walmart Global Tech)","Juspay-style hiring challenges"]},{"block":"H4","title":"Interviews, referrals and the first offer","learn":["Revise DSA to 250 solved with mock interviews (Pramp, peers); GCC rounds are 3 to 4 technical interviews plus a values round","Behavioural stories: five projects framed as problem, action, measured result","Salary negotiation basics and how to read a CTC breakup (fixed vs variable vs joining bonus)"],"build":["A one-page portfolio site listing the three builds with links and eval numbers","Weekly applications: 10 targeted, referral-first, tracked in a sheet; message alumni on LinkedIn with the demo link, not a CV"],"evidence":["Portfolio site","Interview log with what failed and what was fixed"],"target":["Any GCC, product company or AI startup with an entry or junior posting","Fallback: it_services specialist tracks (Infosys DSE, TCS Digital) which pay above the mass-recruiter band"]}],"evidenced_project_spec":{"title":"Claims copilot for a general insurer","scope":"An assistant that ingests 200 to 500 anonymised or synthetic motor-insurance claim documents (FIR, surveyor report, policy PDF, garage invoice), answers a claims officer's questions with citations, flags missing documents against the policy's checklist, and drafts the settlement note. Includes retrieval over the documents, a tool that reads the policy schedule, an eval set of 60 questions with expected answers, and a dashboard of cost, latency and accuracy per release.","domain":"insurance","agent_use":"A coding agent (Claude Code, Cursor, or an open-source equivalent) scaffolds the FastAPI service, writes the first tests and generates synthetic claim files; the graduate reviews every diff, writes the retrieval and eval logic by hand, and keeps a log of what the agent got wrong. A research agent is used to summarise IRDAI motor-claim timelines, which the graduate then verifies against the regulator's page.","done_looks_like":"Deployed at a public URL with login; answers 60-question eval at 85% or better with citations; flags missing documents correctly on 20 held-out claims; total cost per claim under Rs 5; README explains architecture, eval method, failure cases and what is not automated (final settlement decision stays with the officer).","verification":"Automated eval run in CI on every commit with results committed to the repo; a 3-minute demo video; one insurance professional or faculty member reviews five outputs and their comments are in the repo; a 30-minute walkthrough the graduate can give without notes covering chunking choices, one hallucination they caught and how the eval set was built."},"ai_task_shift":[{"task_2019":"Write CRUD endpoints, boilerplate and unit tests by hand","now":"Coding agents generate most boilerplate and first-draft tests; a fresher who only does this has no edge","human_owns":"Specifying the behaviour precisely, reviewing generated code for correctness and security, and owning what ships"},{"task_2019":"Read documentation and Stack Overflow to learn a new library","now":"Agents explain and integrate libraries on demand","human_owns":"Judging which tool fits, what the trade-offs are, and knowing enough fundamentals to catch a wrong answer"},{"task_2019":"Manual testing and bug triage on a ticket queue (the classic fresher job)","now":"Agents write regression tests, reproduce bugs and propose fixes; this entry-level rung is shrinking fastest","human_owns":"Designing evals and test strategy, deciding what 'correct' means for the business, and debugging the cases agents cannot reproduce"},{"task_2019":"Build dashboards and reports in SQL and Excel for analysts","now":"Text-to-SQL and agentic analytics produce first drafts","human_owns":"Data modelling, checking the numbers against the source of truth, and explaining them to the business"},{"task_2019":"Deploy and monitor a service by following a runbook","now":"Agents execute runbooks and draft incident summaries","human_owns":"Architecture, cost control, reliability targets and the judgement call during an incident"},{"task_2019":"Not a fresher task: building AI features","now":"Every product team is adding LLM features; building, evaluating and running them is the new entry-level work, and AI/ML postings grew 31% year on year in Aug 2026 (demand.naukri.jobspeak.ai_ml_yoy.aug2026)","human_owns":"Product sense for what the model should and should not do, evaluation, guardrails, and observability"}],"fallback_path_id":"it_services","employers":[{"name":"Amazon India","type":"company","location":"Bengaluru, Hyderabad, Chennai, Delhi, Pune","roles":"SDE-1 via Amazon University Talent Acquisition; 2025 and 2026 batches","fresher":true,"source_url":"https://www.enggwave.com/amazon-hiring-freshers-2026/106873","seen_on":"2026-04"},{"name":"Fractal Analytics","type":"company","location":"Bengaluru, Mumbai, Pune, Chennai, Gurgaon","roles":"Campus Imagineer (data and AI trainee), 2026 batch; screens on 7+ CGPA, Python, SQL","fresher":true,"source_url":"https://fractal.wd1.myworkdayjobs.com/en-US/Careers/job/Campus-Imagineer-Hiring--2026-_SR-34085-1","seen_on":"2026-09"},{"name":"Mu Sigma","type":"company","location":"Bengaluru","roles":"Trainee Decision Scientist; students and recent graduates apply by email to DSRecruitment","fresher":true,"source_url":"https://www.mu-sigma.com/career/","seen_on":"2026-09"},{"name":"Zoho","type":"company","location":"Chennai, Tenkasi and other Tamil Nadu centres","roles":"Software developer and network operations engineer; fresher to 5 years; known for hiring from any college","fresher":true,"source_url":"https://www.fresheroffcampus.com/zoho-off-campus/","seen_on":"2026-09"},{"name":"Flipkart","type":"company","location":"Bengaluru","roles":"GRiD 8.0 (software, AI engineering, data science tracks) for classes of 2027 to 2030; pathway to SDE and internship interviews","fresher":true,"source_url":"https://internshala.com/competitions/flipkart-grid-8-0/","seen_on":"2026-06"},{"name":"Razorpay","type":"company","location":"Bengaluru","roles":"Roadies new-grad programme and SDE-1 openings; DSA-heavy screen","fresher":true,"source_url":"https://www.ownyourcareer.in/blog/off-campus-drives-june-2026-freshers-india-hiring","seen_on":"2026-07"},{"name":"Goldman Sachs (Engineering, India)","type":"company","location":"Bengaluru, Hyderabad","roles":"Engineering summer analyst 2026 (campus portal); converts to analyst offers","fresher":true,"source_url":"https://hdpc.fa.us2.oraclecloud.com/hcmUI/CandidateExperience/en/sites/CampusHiring/job/148695/?sortBy=POSTING_DATES_DESC","seen_on":"2026-09"},{"name":"Deloitte USI","type":"company","location":"Hyderabad, Bengaluru","roles":"Associate analyst and analyst roles (cloud infrastructure, data analytics, technology controls); role-specific, no single pan-India drive","fresher":true,"source_url":"https://www.sahildubey.com/2026/07/deloitte-recruitment-for-freshers.html","seen_on":"2026-07"}],"fit_rules":[{"field":"branch","value":"CS","score":2,"reason":"CS is what most GCC and product filters ask for, and your syllabus already covers DSA and databases."},{"field":"branch","value":"IT","score":2,"reason":"IT degrees pass the same filters as CS for software and data roles."},{"field":"branch","value":"ECE","score":1,"reason":"ECE graduates are accepted by most software drives (Fractal lists ECE) but must self-teach DSA and databases."},{"field":"branch","value":"CIVIL","score":-2,"reason":"Few software drives accept Civil; you would compete against CS graduates with no syllabus support."},{"field":"college_tier","value":"1","score":2,"reason":"Campus drives from GCCs and product companies still come to tier-1 colleges."},{"field":"college_tier","value":"3","score":-1,"reason":"Almost no AI-native employer visits tier-3 campuses; you enter through off-campus drives and a portfolio, which takes longer."},{"field":"relocation","value":"anywhere_india","score":1,"reason":"These jobs are concentrated in Bengaluru, Hyderabad, Pune, Chennai and NCR."},{"field":"relocation","value":"hometown_only","score":-3,"reason":"Unless home is one of six metros, there are almost no AI-native fresher jobs near home; remote fresher roles are rare."},{"field":"region","value":"south","score":1,"reason":"Bengaluru, Hyderabad and Chennai hold most GCC and AI startup seats."},{"field":"runway_months","value":"0_3","score":-2,"reason":"The first offer on this path usually takes 12 to 18 months of building for a tier-2/3 graduate; with no runway, take an IT services or apprenticeship job and build on the side."},{"field":"runway_months","value":"12_plus","score":1,"reason":"A year of runway is enough to build the portfolio this path needs."},{"field":"interests","value":"building_software","score":3,"reason":"This path is building software every day."},{"field":"interests","value":"data_numbers","score":2,"reason":"Data engineering, analytics trainee and evaluation work are large parts of this path."},{"field":"interests","value":"physical_systems","score":-1,"reason":"Little of this path touches machines or structures; consider ev_automotive or semiconductor if that is what you like."},{"field":"priority","value":"high_pay_growth","score":2,"reason":"Fresher pay here is two to four times the IT services band, with faster growth, at the cost of a harder entry."},{"field":"priority","value":"income_now","score":-2,"reason":"This is the slowest path to a first salary for most tier-2/3 graduates."},{"field":"preparation","value":"projects_portfolio","score":3,"reason":"A shipped project is the single strongest signal on this path."},{"field":"preparation","value":"dsa","score":2,"reason":"DSA is still the first screen at Amazon, Flipkart, Razorpay and most GCCs."},{"field":"preparation","value":"none","score":-2,"reason":"Starting from zero, plan for the full two-year timeline before expecting offers here."},{"field":"enjoyed","value":"coding_projects","score":2,"reason":"You already like the daily work of this path."}],"base_score":6,"stat_ids_used":["demand.gcc.entry_level_jobs_to_2030","demand.xpheno.entry_level_openings.2026","demand.gcc.fresher_share.2025","demand.gcc.ai_data_platform_share_of_new_roles.q4fy26","demand.fresher_ctc.bands.2026","supply.iit.unplaced_share.2024","demand.prepnplaced.entry_level_posting_share.2026","supply.mettl2025.employability.ai_ml_roles","demand.naukri.jobspeak.ai_ml_yoy.aug2026"],"last_reviewed":"2026-09-21","changed_fields":["all"],"skills":[{"id":"python","level":"required","weight":3},{"id":"sql","level":"required","weight":3},{"id":"dsa","level":"required","weight":3},{"id":"llm_apis_and_agents","level":"required","weight":3},{"id":"rag_and_vector_search","level":"required","weight":3},{"id":"deployed_portfolio_project","level":"required","weight":3},{"id":"git_github","level":"required","weight":2},{"id":"docker","level":"required","weight":2},{"id":"fastapi_or_spring","level":"required","weight":2},{"id":"databases_postgresql","level":"required","weight":2},{"id":"llm_evals_and_observability","level":"required","weight":2},{"id":"cloud_fundamentals_aws","level":"preferred","weight":2},{"id":"testing_and_automation","level":"preferred","weight":2},{"id":"system_design_basics","level":"preferred","weight":1}]},{"id":"defence_aerospace_space","name":"Defence, aerospace and space","tagline":"Steady but small door, gated by GATE or a written test at PSUs and by a build portfolio at startups","door_state":"steady","door_size":{"people_per_year":null,"stat_ids":["gap.hal_bel_drdo_annual_intake","paths.defence.production_value.fy26","paths.space.startups.2026"],"caveat":"No market_stat gives annual graduate intake; the recruitment notices in employers sum to a few thousand graduate seats a year across ISRO, DRDO, HAL, BEL, BDL and the private primes, and each is a one-off notice, not a rolling pipeline. Production value and startup count are growing, but that growth lands mostly in experienced hiring."},"pay_band":{"low_lpa":null,"high_lpa":null,"stat_ids":["paths.skilling.nats_graduate_stipend.2026"],"note":"No market_stat for defence or space fresher CTC; gap logged. The apprentice floor is the NATS graduate stipend of Rs 12,300 a month at DPSUs. Scientist and trainee pay for ISRO, DRDO, HAL and BEL is on each notice linked in employers; private space startups pay roughly what EV embedded roles pay."},"branches":{"CS":2,"IT":1,"ECE":3,"EE":2,"MECH":3,"CIVIL":1,"CHEM":1,"OTHER":2},"tiers_realistic":{"tier1":"Yes. IIT and NIT graduates with high marks get DRDO Scientist B consideration without GATE in some cycles, and ISRO and HAL campus visits and the space startups recruit here first.","tier2":"Yes through the exam route: ISRO ICRB written test, DRDO via GATE, HAL and BEL written tests do not ask where you studied. Startups (Skyroot, Agnikul) take tier-2 graduates who show a propulsion, avionics or GNC build.","tier3":"Yes but narrow. The exam route is brand-blind, so a tier-3 graduate who clears GATE or the ISRO CBT is on equal footing; the catch is that seats are few and competition is national. The realistic entry for most is a DPSU graduate apprenticeship under NATS (BDL, BEL, HAL units run these every year), then a written-test trainee post. What substitutes for the brand is a GATE score, a documented RF, propulsion or avionics build, and patience for cycles that open once a year."},"entry_requirements":["First-class B.E./B.Tech (most notices ask for 60% or a first class) in ECE, Mechanical, Electrical, CS, Aeronautical or Instrumentation, no backlogs, age under the notice limit (usually 28 to 30)","A valid GATE score for DRDO Scientist B, and for many PSU and DPSU trainee posts; ISRO ICRB and HAL run their own computer-based tests","For private primes and startups: a portfolio build in one of RF, propulsion, structures, avionics or GNC with test data, not a certificate","Working skill in one core tool set: CATIA or NX plus ANSYS or OpenFOAM for mechanical; LTspice, KiCad and an SDR or VNA for RF and avionics; MATLAB/Simulink for GNC","Indian citizenship and willingness to undergo security clearance and to work at posted locations (Bengaluru, Hyderabad, Thiruvananthapuram, Nashik, Koraput, Chennai)","A NATS registration if you are aiming at DPSU graduate apprenticeships"],"two_year_plan":[{"block":"H1","title":"Pick a track and start GATE in parallel","learn":["GATE for your paper (ECE, ME, EE, CS or AE): start with NPTEL lectures and previous-year papers; free, and the paper you choose decides which notices you can answer","Track choice: RF and avionics (ECE, EE), propulsion and structures (Mech, Aero), or flight software and GNC (CS, EE); read one open textbook for the track (for example, Sutton for rockets, Pozar for RF)","Tool basics for the track: KiCad and LTspice for RF; CATIA or FreeCAD plus ANSYS Student for structures; MATLAB Onramp and Simulink for GNC"],"build":["RF track: a two-element antenna and a receive chain measured with an RTL-SDR; propulsion track: a cold-gas thruster or a solid-motor test stand with a load cell; GNC track: a quadcopter attitude controller in Simulink then on a flight board"],"evidence":["A GitHub repo or a folder of drawings, test logs and a one-page report per build","A GATE mock-test score log to see where you stand; only about one in five who appear qualify"],"target":["Register on NATS for DPSU graduate apprenticeships (BDL Hyderabad, BEL units, HAL divisions run annual notices)","Note the ISRO ICRB cycle (notices around August, test around October) and the DRDO RAC cycle (applications around July)"]},{"block":"H2","title":"First test cycle and a DPSU apprenticeship","learn":["GATE full syllabus completion; sit the exam in February","For ISRO ICRB and HAL CBTs: the discipline paper is core branch at B.Tech depth plus aptitude; practise from previous ISRO papers","Standards vocabulary: MIL-STD-461 for EMI, DO-178C for flight software, ECSS for space; read the summaries, not the full documents"],"build":["Extend the H1 build with a test campaign: repeat runs, measurement uncertainty, and a failure you found and fixed","A structured test report in the format a DRDO lab or a startup would expect (objective, setup, results, deviations)"],"evidence":["GATE score card; ISRO or HAL test admit card and score if the cycle falls here","The test report published with data files"],"target":["Apply to a NATS graduate apprenticeship at BDL, BEL or HAL at the NATS stipend of Rs 12,300 a month (some units pay more)","BEL trainee engineer and project engineer notices run through the year at individual units"]},{"block":"H3","title":"Portfolio for private primes and startups","learn":["For Skyroot, Agnikul, L&T PES and Tata Advanced Systems: manufacturing and quality vocabulary (GD&T, AS9100, NDT basics) because most fresher roles are in production engineering, methods or test, not design","Composite or welding basics for structures roles; LabVIEW and DAQ basics for test roles (Agnikul hires instrumentation software developers with LabVIEW)","How to use a research agent to summarise a standard or a paper and a coding agent to write data-acquisition and analysis scripts, checking each output against the source"],"build":["One deeper project (see evidenced project) that runs a hardware test end to end with automated data capture and a written analysis","A DAQ script set in Python or LabVIEW that logs, plots and flags out-of-range readings"],"evidence":["A thirty-minute walkthrough you have rehearsed with someone outside the field","Applications to Skyroot's Kalpana Fellowship or similar fresher programmes, with the portfolio attached"],"target":["Skyroot Kalpana Fellowship (Hyderabad)","Agnikul fresher roles (Chennai)","Tata Advanced Systems GET and PGET (Bengaluru, Hyderabad, Nagpur)","L&T Precision Engineering & Systems campus route"]},{"block":"H4","title":"Second exam cycle and fallback set","learn":["If GATE did not clear: reattempt with a focus on weak topics, and sit ISRO ICRB and HAL MT/DT tests regardless because they do not need GATE","Interview preparation for Scientist B and MT interviews: your build, your branch fundamentals, and current Indian programmes (Gaganyaan, Tejas Mk1A, SSLV) at a level you can discuss"],"build":["Keep the apprenticeship or fellowship work documented; convert to a permanent role where the unit offers it","A short comparison of two designs you evaluated, in the format of a trade study"],"evidence":["Apprenticeship completion certificate; test scores; the portfolio site","Offers or shortlists from at least one exam route and one private route"],"target":["DRDO Scientist B via GATE","ISRO ICRB Scientist/Engineer SC","HAL Management and Design Trainee","BEL trainee engineer","BDL management trainee","Fallback: EV embedded and battery roles, or infrastructure PSUs via the same GATE score"]}],"evidenced_project_spec":{"title":"Instrumented static test of a small solid rocket motor (or, for the RF track, a measured S-band receive chain for a CubeSat ground station)","scope":"Propulsion track: design and build a small solid motor test stand with a load cell, a pressure transducer and thermocouples, run a campaign of firings of a commercially available or club-built motor, and compare measured thrust curve and chamber pressure with a simple internal-ballistics model. RF track: design, simulate, build and measure a low-noise S-band receive chain and antenna, then characterise gain, noise figure and link budget against a published CubeSat downlink.","domain":"Launch vehicle propulsion testing (Skyroot, Agnikul, ISRO propulsion complexes) or satellite ground segment (ISRO, private ground-station startups); both are areas where test and instrumentation freshers are hired.","agent_use":"A coding agent writes the DAQ script (sampling, buffering, calibration, CSV output) and the analysis notebook that integrates thrust to impulse and overlays the model; a research agent drafts the safety checklist and summarises the internal-ballistics equations or the link-budget method from open sources. Every derived equation is re-derived by hand once and every safety item is checked against a club or NAR-style safety code; the prompts and corrections are kept in the repo so an interviewer can see what the agent got wrong.","done_looks_like":"A stand or receive chain that works repeatedly; a campaign of at least several runs with calibrated data; a report that shows model versus measurement, uncertainty, and the largest discrepancy explained; drawings, schematics, code and raw data public; a thirty-minute talk you can give without slides.","verification":"Calibration records for every sensor with known weights or a signal generator; repeatability across runs shown as a spread; an independent person reproduces the analysis from raw data using only the README; for propulsion, firings done only at a club range under a safety officer, with the safety sign-off documented."},"ai_task_shift":[{"task_2019":"Writing test procedures and test reports from templates","now":"Agents draft procedures and reports from the test plan and the logged data","human_owns":"The test itself, the anomaly call on the pad or bench, and the signature on the report"},{"task_2019":"Setting up CFD, FEA and thermal cases and post-processing plots","now":"Agents write case files, meshing scripts and plotting code from a description","human_owns":"Boundary conditions that match flight, physical plausibility checks, and correlation with hardware tests"},{"task_2019":"Literature and standards review for a design decision","now":"Research agents summarise papers and standards clauses in minutes","human_owns":"Verifying the clause against the actual standard, the trade study decision, and the design review defence"},{"task_2019":"Writing DAQ, telemetry-parsing and analysis code","now":"Coding agents produce the scripts and unit tests","human_owns":"Calibration, sensor placement, timing on real hardware, and debugging with the instrument in hand"},{"task_2019":"Preparing BOMs, routing sheets and process plans for manufacturing","now":"Agents generate first-pass BOMs and routings from CAD and ERP data (a skill TASL asks for in GAT notices)","human_owns":"Shop-floor feasibility, supplier qualification, and the quality sign-off under AS9100"},{"task_2019":"Drafting requirement documents and traceability matrices","now":"Agents draft and cross-link requirements","human_owns":"Deciding what the requirement is, negotiating it with the customer or programme office, and security-classified content that never goes to an external tool"}],"fallback_path_id":"ev_automotive","employers":[{"name":"ISRO Centralised Recruitment Board (ICRB)","type":"exam","location":"Bengaluru, Thiruvananthapuram, Sriharikota, Ahmedabad, Hyderabad","roles":"Scientist/Engineer SC in Electronics, Mechanical and Computer Science by computer-based test; notice August 2026, test October 2026","fresher":true,"source_url":"https://www.isro.gov.in/ICRB_Recruitment13.html","seen_on":"2026-08"},{"name":"DRDO Recruitment and Assessment Centre (RAC)","type":"exam","location":"Labs across India","roles":"Scientist B via GATE score plus descriptive test for ECE, Mechanical and CS; other disciplines by GATE and interview; 630 posts in the 2026 cycle","fresher":true,"source_url":"https://www.spinoneducation.com/blog/drdo-rac-recruitment/","seen_on":"2026-07"},{"name":"Hindustan Aeronautics Limited (HAL)","type":"exam","location":"Bengaluru, Nashik, Koraput, Kanpur, Lucknow, Hyderabad","roles":"Management Trainee and Design Trainee by computer-based test; 120 posts in the 2026 cycle across Aeronautical, Electrical, Electronics, Mechanical, CS, Metallurgy and Civil","fresher":true,"source_url":"https://www.careerpower.in/blog/hal-recruitment-2026","seen_on":"2026-08"},{"name":"Bharat Electronics Limited (BEL)","type":"exam","location":"Bengaluru, Ghaziabad, Hyderabad, Pune, Chennai, Kochi, Jodhpur","roles":"Trainee Engineer and Project Engineer notices at individual units through 2026, plus graduate apprentice walk-ins; written test, no GATE for most trainee posts","fresher":true,"source_url":"https://defence.sarkarijobs.com/bel-recruitment/","seen_on":"2026-09"},{"name":"Bharat Dynamics Limited (BDL)","type":"exam","location":"Hyderabad (Kanchanbagh), Bhanur, Visakhapatnam","roles":"Graduate apprentices under NATS (122 B.E./B.Tech seats in July 2026 at the NATS stipend) and periodic Management Trainee tests","fresher":true,"source_url":"https://www.adda247.com/engineering-jobs/bdl-trade-apprentice-recruitment/","seen_on":"2026-07"},{"name":"L&T Precision Engineering & Systems","type":"company","location":"Talegaon, Hazira, Coimbatore, Vadodara, Powai","roles":"GET and PGET through the L&T group campus programme; direct fresher postings are rare, most openings are experienced","fresher":true,"source_url":"https://www.lntpes.com/careers","seen_on":"2026-09"},{"name":"Tata Advanced Systems (TASL)","type":"company","location":"Hyderabad, Bengaluru (Jigani), Nagpur, Narasapura","roles":"GET, PGET and Management Trainee programmes with shop-floor rotation; Graduate Apprentice Trainee notices for process planning and manufacturing","fresher":true,"source_url":"https://www.tataadvancedsystems.com/careers","seen_on":"2026-09"},{"name":"Skyroot Aerospace","type":"company","location":"Hyderabad","roles":"Kalpana Fellowship: twelve-month programme for recent graduates and final-year students with a fast track to full-time; regular openings are two years plus","fresher":true,"source_url":"https://www.skyroot.in/careers","seen_on":"2026-09"},{"name":"Agnikul Cosmos","type":"company","location":"Chennai (IIT Madras Research Park)","roles":"Fresher roles such as Instrumentation Software Developer (LabVIEW, C, DAQ) open to 2024 to 2026 batches; power electronics and mission software openings","fresher":true,"source_url":"https://www.jobinsider.in/jobs/agnikul-instrument-software-developer-job-26/","seen_on":"2026-08"}],"fit_rules":[{"field":"branch","value":"ECE","score":3,"reason":"Electronics is the largest discipline in ISRO, BEL, BDL and HAL notices."},{"field":"branch","value":"MECH","score":3,"reason":"Mechanical is the second largest discipline at ISRO, HAL, BDL and the launch startups."},{"field":"branch","value":"EE","score":2,"reason":"Electrical appears in HAL, BEL and DRDO notices but with fewer seats than ECE."},{"field":"branch","value":"CS","score":2,"reason":"ISRO, DRDO and HAL all list Computer Science, and startups need flight and mission software."},{"field":"branch","value":"OTHER","score":1,"reason":"Aeronautical and instrumentation graduates are listed by HAL, DRDO and the startups; other branches rarely."},{"field":"branch","value":"CIVIL","score":-2,"reason":"Only a few civil seats appear (HAL MT, DRDO Part II); not a realistic main route."},{"field":"enjoyed","value":"exams_theory","score":3,"reason":"The PSU and DPSU doors are exams; being good at competitive tests is the single biggest advantage."},{"field":"preparation","value":"gate_prep","score":3,"reason":"GATE is the entry for DRDO and many PSU trainee posts, and the same score opens NTPC and Power Grid as fallbacks."},{"field":"preparation","value":"projects_portfolio","score":1,"reason":"A propulsion, RF or avionics build is what Skyroot, Agnikul and TASL screen on."},{"field":"preparation","value":"core_tools","score":1,"reason":"CATIA, ANSYS or MATLAB skill shortens the private-route plan."},{"field":"priority","value":"meaningful_domain","score":2,"reason":"People choose this path for the mission; the pay and the wait only make sense if the domain matters to you."},{"field":"priority","value":"stability","score":2,"reason":"ISRO, DRDO and DPSU posts are permanent central government or PSU jobs."},{"field":"priority","value":"income_now","score":-2,"reason":"Cycles open once a year and the first step is often an apprentice stipend; income is slow."},{"field":"priority","value":"abroad","score":-3,"reason":"Defence and space work is citizenship-restricted and stays in India."},{"field":"runway_months","value":"0_3","score":-2,"reason":"You need months to prepare and wait for a notice; with no runway, take an apprenticeship first."},{"field":"runway_months","value":"12_plus","score":1,"reason":"A year of runway covers one GATE cycle plus the ISRO and HAL tests."},{"field":"relocation","value":"anywhere_india","score":1,"reason":"Postings are wherever the lab or unit is, and you do not choose."},{"field":"relocation","value":"hometown_only","score":-3,"reason":"PSU posting is all-India; startups are in Hyderabad, Chennai and Bengaluru."},{"field":"interests","value":"research_theory","score":1,"reason":"Scientist posts reward depth in one subject."},{"field":"interests","value":"physical_systems","score":1,"reason":"Rockets, aircraft and radars are physical systems tested on the ground."}],"base_score":3,"stat_ids_used":["gap.hal_bel_drdo_annual_intake","paths.defence.production_value.fy26","paths.space.startups.2026","paths.skilling.nats_graduate_stipend.2026","paths.govt.gate_appeared.2025","paths.govt.gate_qualified.2025"],"last_reviewed":"2026-09-21","changed_fields":["all"],"skills":[{"id":"gate_preparation_ece_ee_me","level":"required","weight":3},{"id":"matlab_simulink","level":"required","weight":2},{"id":"control_systems","level":"required","weight":2},{"id":"rf_and_antenna_basics","level":"preferred","weight":2},{"id":"avionics_and_propulsion_basics","level":"preferred","weight":2},{"id":"cad_solidworks_or_catia","level":"preferred","weight":2},{"id":"thermal_and_fea_simulation","level":"preferred","weight":2},{"id":"embedded_c","level":"preferred","weight":1},{"id":"labview_and_daq_basics","level":"preferred","weight":1},{"id":"signal_processing_basics","level":"preferred","weight":1},{"id":"quality_and_manufacturing_basics","level":"preferred","weight":1},{"id":"pcb_design","level":"preferred","weight":1},{"id":"python","level":"preferred","weight":1},{"id":"interview_aptitude_and_hr","level":"required","weight":1}]},{"id":"ev_automotive","name":"EV and automotive","tagline":"Growing door, but the first job is often a contract or apprenticeship on the plant floor","door_state":"growing","door_size":{"people_per_year":null,"stat_ids":["paths.ev.jobs_projection_adecco.2030","paths.ev.hiring_growth_yoy"],"caveat":"No stat counts fresher engineering hires per year. Adecco projects 30 to 40 million EV jobs by 2030 but only 10 to 15% are direct, most direct jobs are plant-floor, hiring grows 15 to 20% a year, and 40 to 50% of roles start as contracts."},"pay_band":{"low_lpa":3,"high_lpa":8,"stat_ids":["paths.ev.fresher_ctc_bands.2026"],"note":"Design roles start as low as 2, battery and BMS roles reach 9, embedded sits at 3 to 7; graduate apprentice stipends at OEM plants are below the band and convert to full roles only for some."},"branches":{"CS":1,"IT":0,"ECE":2,"EE":3,"MECH":3,"CIVIL":0,"CHEM":2,"OTHER":1},"tiers_realistic":{"tier1":"Yes. OEM design centres and Bosch-type suppliers run campus GET programmes at NITs, top state universities and a few private colleges; battery R&D and vehicle software roles go mostly here.","tier2":"Yes for plant and supplier GET or graduate apprentice roles; design-centre roles need a portfolio (CAD models, a BMS or motor-controller build, a Simulink model) and often a pool-campus test such as HireMee.","tier3":"Yes, but the first door is usually a Graduate Apprentice Trainee post under NATS at an OEM plant or a tier-1 supplier, at a stipend not a salary, with conversion to a permanent role for some. What substitutes for the brand is a hardware build you can demonstrate on video, a CAN-bus or BMS project with logged data, and willingness to relocate to Pune, Sanand, Hosur, Chennai or Bengaluru."},"entry_requirements":["B.E./B.Tech in Mechanical, Automobile, Electrical, EEE, ECE, Mechatronics or Instrumentation with no active backlogs; most OEM notices ask for 60% throughout","Working CAD skill in CATIA, SolidWorks, Creo or NX with GD&T basics, shown as files not certificates","For battery and BMS roles: cell chemistry basics, SOC and SOH estimation, thermal behaviour, and hands-on cell or pack testing","For embedded roles: embedded C on an STM32 or similar microcontroller, CAN and LIN protocols, and reading a datasheet","MATLAB/Simulink model of a vehicle subsystem (drive cycle, motor control or battery) that you can walk through","One completed internship or NATS apprenticeship on a shop floor, or a documented build from a college EV or Baja/Supra team","Willingness to relocate to plant clusters and to accept a contract or trainee role for the first one to two years"],"two_year_plan":[{"block":"H1","title":"Fundamentals and a CAD portfolio","learn":["NPTEL: Electric Vehicles (IIT Madras or IIT Delhi offering), Fundamentals of Automotive Systems, and Engineering Drawing refresher; all free, take the certificate exam if you can afford it","One CAD tool properly: SolidWorks or Fusion 360 (free for students) or CATIA if your college has it; GD&T basics from the free ASME primers","Battery basics: lithium-ion cell chemistry, C-rate, SOC and SOH, thermal runaway, pack topology (series and parallel); use the free Battery University site","Embedded C basics on an Arduino, then move to an STM32 Nucleo board; learn UART, I2C, SPI and how to read a datasheet"],"build":["A full CAD assembly of a two-wheeler EV battery pack or a motor mount with drawings, tolerances and a BOM","A microcontroller project that reads cell voltage and temperature from a small pack and prints it over serial"],"evidence":["A public GitHub or GrabCAD folder with CAD files, drawings and a one-page write-up of design choices","A short video of the microcontroller reading a real cell"],"target":["Register on the NATS portal (nats.education.gov.in) so you are eligible for graduate apprentice notices","Join college EV, Baja or Supra team if one exists"]},{"block":"H2","title":"Simulation, CAN bus and a plant internship","learn":["MATLAB/Simulink: build a drive-cycle model of a two-wheeler EV (motor, battery, vehicle dynamics); MathWorks Onramp courses are free","CAN and LIN: use an MCP2515 module or an STM32 with built-in CAN; learn frame structure, arbitration and how to log with a cheap USB-CAN adapter and SavvyCAN","Thermal simulation basics: steady-state heat flow in a pack using free tools (FreeCAD FEM or Ansys Student) and hand calculations","Manufacturing basics: line balancing, poka-yoke, 5S and SPC, because most fresher roles are on or near the line"],"build":["A two-node CAN network: one board reports pack voltage and temperature, the other displays it and raises a fault flag","A Simulink model that predicts range for a given drive cycle and battery, validated against a published spec"],"evidence":["Logged CAN traces and a document explaining each message ID","A short report comparing your Simulink range prediction with the OEM claim"],"target":["Summer internship or NATS graduate apprenticeship at a plant (Tata Motors Pune or Sanand, TVS Hosur, Ola Krishnagiri, Bosch, Tata AutoComp) at the NATS graduate stipend of Rs 12,300 a month or the higher OEM stipend where offered","Apply to Bosch and Bosch Chassis Graduate Apprentice pool-campus tests"]},{"block":"H3","title":"BMS build and cell testing","learn":["BMS design: passive balancing, cell monitoring ICs (BQ76920 family or similar), SOC estimation by coulomb counting and simple Kalman filter","Cell testing: charge and discharge cycling, capacity fade, internal resistance, using a low-cost programmable load and logging every run","Motor control basics: BLDC six-step commutation, then FOC concepts; run a small BLDC with an off-the-shelf controller and read its signals","Functional safety vocabulary (ISO 26262 levels) and AIS-156 battery safety basics so you can talk to a test engineer"],"build":["A working BMS for a small pack (for example, a 4-series lithium pack) with balancing, over-voltage and over-temperature cut-off, and a CAN output","A cell test log of at least twenty cycles with a capacity-fade plot"],"evidence":["Video demonstration of the BMS cutting off on a fault, plus the schematic and firmware on GitHub","A report on the cell test with plots, assumptions and what you would change"],"target":["Battery and BMS openings at Ather, Ola Electric, Exide Energy Solutions, Amara Raja, Tata AutoComp Gotion","Embedded openings at Bosch, Mahindra, Tata Motors"]},{"block":"H4","title":"Job hunt with a demonstrable project","learn":["Interview preparation for GET and GAT tests: aptitude, core branch basics, and how OEMs run HireMee or TurboHire rounds","Basic Python for test-data analysis (pandas, matplotlib) so you can turn your cell and CAN logs into charts","How to use a coding assistant to write firmware boilerplate and a research assistant to summarise standards, while checking every line against the datasheet"],"build":["Finish the evidenced project below and rehearse a thirty-minute walkthrough","One-page portfolio site linking CAD, BMS, CAN and Simulink work"],"evidence":["Portfolio link on your CV; a GAT or internship completion letter","Mock interview recordings where you explain your project to someone outside the field"],"target":["Mahindra GET and PGET (2026 batch drives run around April)","Tata Motors GAT (Pune and Sanand notices run around June)","Bosch Graduate Apprentice (registrations around March)","TVS Hosur apprentice notices","Tata AutoComp Chennai and Pune walk-ins"]}],"evidenced_project_spec":{"title":"Two-wheeler battery pack with a home-built BMS, CAN telemetry and a validated range model","scope":"Design a small lithium-ion pack for an electric scooter (CAD assembly, BOM, thermal hand calculation), build a working BMS on a low-cost cell-monitor IC with balancing and safety cut-offs, put pack data on a CAN bus, and build a Simulink model that predicts range for a standard drive cycle and compare it with measured discharge on the bench.","domain":"Electric two-wheelers, the largest EV segment by volume in India and the one where Ather, Ola, TVS and Bajaj hire.","agent_use":"Use a coding agent to scaffold the STM32 firmware (peripheral setup, CAN driver, ring buffer for logging) and the Python scripts that parse CAN logs into plots. Use a research agent to summarise AIS-156 safety requirements and the cell-monitor IC datasheet into a checklist, then verify each item against the original document. Keep every agent output in a folder with the prompt and what you changed, so you can show an interviewer where the agent was wrong (for example, a register bit it guessed).","done_looks_like":"The BMS balances the pack, cuts off on over-voltage and over-temperature, publishes voltage, current and temperature on CAN at a fixed rate; a dashboard shows live data; the Simulink range prediction is within a stated error of the measured bench discharge; the CAD, BOM, schematic, firmware, logs and a ten-page report are public.","verification":"Fault injection on the bench (heat a cell with a hot-air gun, raise the charger voltage) with logs showing the cut-off; twenty or more charge-discharge cycles with a capacity plot; a second person reproduces the CAN decode from your documentation alone; range model error reported honestly with the reasons."},"ai_task_shift":[{"task_2019":"Drafting 2D drawings and detailing standard brackets and mounts","now":"CAD assistants generate drawings from the 3D model and propose standard parts; agents produce first-pass BOMs from the assembly tree","human_owns":"Tolerance stack-up decisions, manufacturability with the actual supplier, and signing the drawing"},{"task_2019":"Setting up thermal and structural simulation cases by hand","now":"Agents write the simulation script, mesh settings and post-processing from a description of the load case","human_owns":"Choosing boundary conditions that match the real vehicle, judging whether results are physically plausible, and correlating with a physical test"},{"task_2019":"Writing embedded boilerplate: peripheral init, CAN drivers, logging code","now":"Coding agents produce the boilerplate and unit tests; the engineer reviews and integrates","human_owns":"Timing and safety behaviour on the real hardware, datasheet errata, and the debugging session with an oscilloscope"},{"task_2019":"Compiling test reports and homologation documents from spreadsheets","now":"Agents draft the report and the AIS-156 evidence matrix from logs","human_owns":"Running the physical tests, deciding a result is a fail, and sign-off with the certifying body"},{"task_2019":"Searching supplier catalogues and standards for part selection","now":"Research agents shortlist cells, ICs and connectors with datasheet summaries","human_owns":"Verifying the summary against the datasheet, the supplier visit, and cost negotiation"},{"task_2019":"Line-side problem solving from shift data","now":"Agents summarise shift logs and flag anomalies","human_owns":"Standing at the line, the root-cause conversation with operators, and the change decision"}],"fallback_path_id":"infrastructure_energy","employers":[{"name":"Tata Motors","type":"company","location":"Pune, Sanand, Jamshedpur, Lucknow, Pantnagar, Dharwad","roles":"Graduate Apprentice Trainee under NATS in production, maintenance, quality and manufacturing planning; Rs 25,000 monthly stipend; Lakshya earn-and-learn for diploma holders","fresher":true,"source_url":"https://www.enggwave.com/tata-motors-off-campus-drive-2026/106189","seen_on":"2026-07"},{"name":"Mahindra & Mahindra (auto and farm, including Mahindra Electric Automobile)","type":"company","location":"Pune, Mumbai, Chennai; PAN India postings","roles":"GET, PGET and SGET campus programmes for the 2026 batch in Mechanical, Automobile, Electrical, Electronics, Mechatronics and Production","fresher":true,"source_url":"https://www.enggwave.com/mahindra-hiring-freshers-2026/107234","seen_on":"2026-04"},{"name":"Ola Electric","type":"company","location":"Krishnagiri (Futurefactory), Bengaluru","roles":"Walk-in drives for plant roles open to any degree; R&D and engineering openings mostly experienced, applied through the careers portal","fresher":true,"source_url":"https://www.itijobsindia.in/2026/03/ola-electric-walk-in-drive-2026-12th.html","seen_on":"2026-03"},{"name":"Ather Energy","type":"company","location":"Bengaluru, Hosur","roles":"Internships and campus hiring through placement cells; Graduate Engineering Trainee openings appear intermittently on the careers portal","fresher":true,"source_url":"https://careers.atherenergy.com/students","seen_on":"2026-09"},{"name":"TVS Motor Company","type":"company","location":"Hosur, Uddanapalli, Mysuru","roles":"Apprentice and trainee roles in assembly, inspection and quality; open to diploma and degree holders","fresher":true,"source_url":"https://www.tnjobzone.com/tvs-motor-company-apprentice-recruitment-2026/","seen_on":"2026-05"},{"name":"Bosch (Bosch Limited and Bosch Chassis Systems India)","type":"company","location":"Bengaluru, Pune, Nashik, Jaipur","roles":"Graduate Apprentice programme of twelve months for first-class B.E./B.Tech in Mechanical, EEE and ECE via pool campus and online test; Technical Management Trainee for top performers","fresher":true,"source_url":"https://www.bosch.in/careers/students-and-graduates/graduate-apprentice/","seen_on":"2026-09"},{"name":"Exide Industries and Exide Energy Solutions","type":"company","location":"Bengaluru (lithium cell plant), Pune, Haldia, Hosur","roles":"Campus cadre programmes for engineers (historically IIT and IISc focused) plus plant production associate and GET openings at Bengaluru and Pune","fresher":true,"source_url":"https://careers.exideindustries.com/opportunities-exide/campus-recruits.aspx","seen_on":"2026-09"},{"name":"Amara Raja Group (Energy & Mobility, Advanced Cell Technologies)","type":"company","location":"Tirupati, Chittoor, Hyderabad giga corridor","roles":"Nava Pratibha fresher induction: ARGTP graduate technical trainee, ARGMP graduate management trainee, internships and apprenticeships","fresher":true,"source_url":"https://amararaja.com/careers/","seen_on":"2026-09"},{"name":"Tata AutoComp Systems (and Tata AutoComp Gotion)","type":"company","location":"Chennai, Pune, Sanand","roles":"Walk-in for design release, CAE, CFD and durability engineers with freshers offered 4 to 7 LPA; Sanand battery plant hires operators and quality staff from ITI to graduate","fresher":true,"source_url":"https://careerforfreshers.com/walk-in-jobs/tata-autocomp-systems-tata-group-walk-in-interview/","seen_on":"2026-07"}],"fit_rules":[{"field":"branch","value":"MECH","score":3,"reason":"Mechanical and automobile graduates are the main intake for OEM and supplier trainee roles."},{"field":"branch","value":"EE","score":3,"reason":"Battery, BMS, motor and charger work is electrical; EE is asked for by name in most notices."},{"field":"branch","value":"ECE","score":2,"reason":"Embedded, CAN and BMS firmware roles take ECE; you compete with EE for them."},{"field":"branch","value":"CHEM","score":1,"reason":"Cell chemistry and electrode process roles at new cell plants take chemical and metallurgy graduates, but the numbers are small."},{"field":"branch","value":"CS","score":0,"reason":"Vehicle software roles exist but are few and go to people with embedded experience; a CS graduate is usually better served by the software path."},{"field":"branch","value":"CIVIL","score":-3,"reason":"Almost no EV fresher notice lists civil."},{"field":"interests","value":"physical_systems","score":2,"reason":"The work is machines, packs and plants; liking physical systems is the strongest signal."},{"field":"interests","value":"hardware_electronics","score":2,"reason":"BMS, controllers and CAN networks are electronics builds."},{"field":"interests","value":"building_software","score":-1,"reason":"Software here is embedded firmware in service of hardware, not app or web work."},{"field":"enjoyed","value":"labs_hardware","score":2,"reason":"People who liked tinkering in labs finish the BMS and CAN builds this path needs."},{"field":"enjoyed","value":"workshops_site","score":2,"reason":"Most first roles are on or next to a production line."},{"field":"preparation","value":"core_tools","score":2,"reason":"CAD, MATLAB or Simulink already in hand shortens the plan by a block."},{"field":"preparation","value":"projects_portfolio","score":1,"reason":"A hardware build you can show substitutes for college brand at tier-2 and tier-3."},{"field":"preparation","value":"internship_done","score":1,"reason":"A plant internship or apprenticeship is what OEM recruiters ask about first."},{"field":"relocation","value":"hometown_only","score":-3,"reason":"EV jobs sit in a few clusters (Pune, Sanand, Hosur, Chennai, Bengaluru, Krishnagiri); staying home rules most out."},{"field":"relocation","value":"within_state","score":-1,"reason":"Works only if your state has a cluster (Tamil Nadu, Karnataka, Maharashtra, Gujarat, Telangana, Andhra)."},{"field":"region","value":"south","score":1,"reason":"Hosur, Krishnagiri, Chennai, Bengaluru and the Telangana and Andhra cell plants are in the south."},{"field":"region","value":"west","score":1,"reason":"Pune, Sanand and Chakan hold most OEM and supplier plants."},{"field":"runway_months","value":"0_3","score":-1,"reason":"The first offer is often an apprentice stipend or contract, so income arrives but is low for a year or more."},{"field":"priority","value":"stability","score":-1,"reason":"A large share of EV roles start as contracts; stability comes later, after conversion."}],"base_score":5,"stat_ids_used":["paths.ev.jobs_projection_adecco.2030","paths.ev.hiring_growth_yoy","paths.ev.fresher_ctc_bands.2026","paths.skilling.nats_graduate_stipend.2026"],"last_reviewed":"2026-09-21","changed_fields":["all"],"skills":[{"id":"cad_solidworks_or_catia","level":"required","weight":3},{"id":"embedded_c","level":"required","weight":2},{"id":"can_lin_automotive_protocols","level":"required","weight":2},{"id":"matlab_simulink","level":"required","weight":2},{"id":"battery_management_systems","level":"preferred","weight":3},{"id":"ev_powertrain_and_motor_control","level":"preferred","weight":2},{"id":"microcontrollers_and_rtos","level":"preferred","weight":2},{"id":"quality_and_manufacturing_basics","level":"preferred","weight":2},{"id":"thermal_and_fea_simulation","level":"preferred","weight":1},{"id":"power_electronics_basics","level":"preferred","weight":1},{"id":"pcb_design","level":"preferred","weight":1},{"id":"python","level":"preferred","weight":1},{"id":"interview_aptitude_and_hr","level":"required","weight":2}]},{"id":"government_psu","name":"Government and PSU engineering","tagline":"Steady but tiny: a few thousand posts a year against 7.5 lakh GATE takers","door_state":"steady","door_size":{"people_per_year":3000,"stat_ids":["paths.govt.upsc_ese_posts.2026","paths.govt.ssc_je_posts.2025","paths.govt.psu_via_gate_examples.2026","paths.govt.gate_appeared.2025"],"caveat":"Sum of ESE posts, SSC JE posts and three PSU-via-GATE examples (NPCIL, NTPC, Grid-India) only; RRB JE and state PSC AE notifications add a few thousand more but no stat is recorded yet. Against 7.47 lakh GATE takers the competition is well over 100 applicants per post."},"pay_band":{"low_lpa":5,"high_lpa":8,"stat_ids":["paths.infra.fresher_ctc_bands.2026"],"note":"PSU band from the infrastructure hiring outlook. ESE and PSU executive (E1) grades pay above this once allowances are counted; SSC JE and RRB JE Level 6 pay starts below it. No separate stat recorded for those grades."},"branches":{"CS":1,"IT":0,"ECE":2,"EE":3,"MECH":3,"CIVIL":3,"CHEM":2,"OTHER":1},"tiers_realistic":{"tier1":"Yes, but the brand gives no advantage; ESE, SSC JE, RRB JE and GATE are blind to college. Tier-1 students mostly use GATE for IIT/IISc M.Tech or PSU intake and have the best coaching-free preparation base.","tier2":"Yes. This is the path where a tier-2 degree costs you nothing. What substitutes for brand is a disciplined 12 to 18 month GATE or ESE schedule, previous-year papers solved under time, and the right branch (Civil, Mechanical, Electrical have the most posts).","tier3":"Yes on paper, and many tier-3 graduates do clear SSC JE and RRB JE. The honest caveat: most attempts fail because of competition over 100:1, so treat it as one of two parallel tracks, never the only one. Never spend more than two exam cycles without a paying fallback."},"entry_requirements":["A valid GATE score in your branch paper; PSUs such as NPCIL, NTPC, IOCL and Power Grid shortlist on GATE score and then interview","B.E./B.Tech in the exact discipline the notification names (ESE: Civil, Mechanical, Electrical, Electronics and Telecom only; CS/IT graduates are excluded from ESE and most PSU-via-GATE intakes)","Age within the limit on the notification date (ESE typically 21 to 30; SSC JE up to 32; RRB JE 18 to 36 with relaxations)","For SSC JE and RRB JE: Paper 1 objective score above the category cut-off, then Paper 2 or document verification","For state PSC AE: domicile or state-language requirement in several states; check the notification before preparing","Clean document trail: 10th, 12th, all semester marksheets, caste or EWS certificate in the prescribed format, because document verification rejects late paperwork","For PSU interviews: ability to explain final-year project and core subjects at whiteboard depth; the interview is 15 to 25 percent of the final score in most PSUs"],"two_year_plan":[{"block":"H1","title":"Pick the exam, build the syllabus map, start the fallback","learn":["GATE syllabus for your paper. Civil (CE): strength of materials, structural analysis, geotech, fluid mechanics, transportation, environmental, plus engineering mathematics and general aptitude. Mechanical (ME): thermodynamics, fluid mechanics, heat transfer, SOM, theory of machines, manufacturing, industrial engineering. Electrical (EE): networks, machines, power systems, control, power electronics, signals, measurements. ECE (EC): networks, signals, control, analog and digital, EM, communications. CS (CS): DSA, algorithms, TOC, compilers, OS, DBMS, networks, discrete maths.","Engineering mathematics and general aptitude first: they are 25 to 30 percent of every paper and the fastest marks","Exam calendar for the year: GATE registration opens late August or early September (GATE 2027 by IIT Madras: registration 2 to 27 September 2026, exam 6 to 21 February 2027); UPSC ESE notification mid-September (ESE 2027: notified 16 September 2026, prelims 31 January 2027); SSC JE notification around September with Paper 1 in October or November; RRB JE CEN in July with CBT 1 in October; state PSC AE notifications are irregular, so subscribe to your state PSC's notice board","Excel and one scripting language (Python) for the fallback track, because most private-sector fallbacks screen for them"],"build":["A single-sheet study tracker: topic, source, first pass date, revision dates, previous-year-question accuracy","Personal formula and error notebook per subject, updated weekly","One PYQ set per subject solved on paper under time, from the last ten years of your GATE paper"],"evidence":["Ten years of previous-year GATE questions attempted, with accuracy above 60 percent in engineering maths and aptitude","Registered for GATE 2027 and, if eligible by branch, for ESE 2027 prelims","Fallback track started: NATS graduate apprenticeship application filed (stipend from 12,300 per month with government DBT) or a private core-sector or IT-services application pipeline running"],"target":["GATE 2027 (IIT Madras)","UPSC ESE 2027","SSC JE 2026","NATS apprenticeship portal"]},{"block":"H2","title":"Full syllabus pass, first attempts, mock discipline","learn":["Complete every syllabus subject once; leave no subject unread because GATE questions are spread evenly","Full-length mock tests weekly from November: three hours, sitting, no phone; analyse every wrong and every guessed answer","For ESE prelims: General Studies and Engineering Aptitude paper (Paper 1) needs its own 6 to 8 weeks; standards, project management, ethics, energy and environment, ICT basics","For SSC JE and RRB JE: speed. Paper 1 and CBT 1 reward 100 to 200 correct objective answers in two hours, so drill numericals to under 90 seconds each"],"build":["Twenty full-length mocks with a score curve you can show; if the curve is flat after ten mocks, change method, not hours","A one-page profile for each PSU you can enter via GATE: NPCIL, NTPC, IOCL, ONGC, Power Grid, BHEL, and the GATE cut-offs of the last two cycles by branch and category"],"evidence":["GATE 2027 appeared (February 2027); ESE prelims appeared (January 2027) if eligible; SSC JE Paper 1 appeared (October or November 2026); RRB JE CBT 1 appeared if the CEN is open","Fallback track evidence: an apprenticeship joined, or a private-sector offer, or a portfolio project in your core domain (see the evidenced project below)"],"target":["GATE 2027","UPSC ESE 2027 prelims","SSC JE 2026 Paper 1","RRB JE CEN 04/2026 CBT 1","TGPSC or your own state PSC AE"]},{"block":"H3","title":"Results, PSU applications, decide on a second attempt","learn":["PSU application season runs March to July after GATE results: NPCIL executive trainee (April window in 2026, GATE 2024 to 2026 accepted), NTPC engineering executive trainee (May 2026 short notice, GATE 2025 score), IOCL graduate engineers (August 2026 window), ONGC graduate engineer trainee (July 2026 short notice), Power Grid engineer trainee (advertised around September against the next GATE). Read each advertisement for which GATE year it accepts; many accept two or three years","PSU interview preparation: core subjects at whiteboard depth, your final-year project, the company's plants and projects, and current affairs in your sector (grid, nuclear, refining)","If GATE rank is outside PSU cut-offs, decide within two weeks whether a second attempt is justified; the honest test is whether your mock curve was still rising in January"],"build":["Applications to every PSU whose cut-off your score meets, tracked in one sheet with dates and document status","ESE mains (June) answer-writing practice if you cleared prelims: conventional questions, derivations, neatly drawn diagrams, 30 minutes per question"],"evidence":["PSU applications filed, interview calls received or not; SSC JE Paper 2 or RRB JE CBT 2 appeared","If no interview call: fallback track has now produced income or a signed apprenticeship, and the decision on a second GATE attempt is written down with a date"],"target":["NPCIL","NTPC","IOCL","ONGC","Power Grid","UPSC ESE mains","SSC JE Paper 2","RRB JE CBT 2"]},{"block":"H4","title":"Join, or convert the preparation into a core-sector job","learn":["If selected: PSU induction, the company's safety and plant systems; nothing else to plan","If in a second attempt: repeat H2 with the mock discipline, but cap it at this cycle; a third exam-only year is not advised","If exiting: your GATE preparation maps directly to private core roles in infrastructure and energy (STAAD, ETAP, Primavera, Revit for Civil and Electrical; SolidWorks and CATIA plus GD&T for Mechanical) and to M.Tech via GATE at IITs, NITs and IISc if you qualified"],"build":["One domain project in your branch that you can explain for 30 minutes (see the evidenced project) so a private employer sees applied skill, not just exam scores","Applications to private EPC, power and manufacturing firms where the GATE syllabus is the interview syllabus"],"evidence":["A joining letter (PSU, JE post, state AE, apprenticeship converted, or private core role), or an M.Tech admission via COAP or CCMT","A written record of exam cycles used and the result, so the next decision is made on data and not on hope"],"target":["Joined PSU or JE post","M.Tech via COAP or CCMT","Private core-sector employers in the infrastructure_energy path"]}],"evidenced_project_spec":{"title":"GATE study system plus one plant-level domain project","scope":"Two parts. Part A: a personal GATE study system, built in a spreadsheet or a small Python app, that logs every practice question by topic, tracks accuracy and time per question, and schedules revision by spaced repetition. Part B: one domain project in your branch, sized to two to three weekends, tied to a real installation you can name. Examples: Civil, a load and cost check of a two-lane RCC bridge deck near your town using IRC loads; Electrical, a load-flow and fault study of an 11 kV distribution feeder in a small town, modelled in an open-source tool; Mechanical, a heat-balance and efficiency estimate of a 500 MW thermal unit from public NTPC data; ECE, a link budget and antenna placement plan for a rural 4G cell; Chemical, a material and energy balance for a refinery distillation column using public IOCL data.","domain":"Public-sector engineering: power generation and transmission, nuclear, refining, railways, state public works","agent_use":"A coding agent builds the study tracker (schema, import of your PYQ logs, revision scheduler, weekly report). A research agent pulls the public data for Part B (IRC codes, feeder data from a discom tariff filing, NTPC plant heat-rate reports, IOCL refinery data) and drafts the calculation steps. You verify every number and every code clause by hand: the interview will ask you to derive it at the whiteboard, and an agent's mistake in a code reference is the fastest way to fail a PSU interview.","done_looks_like":"Part A: 12 weeks of logged practice with a visible accuracy curve per subject. Part B: a six to ten page report with assumptions, calculations, a diagram, results and a one-page critique of what you would change, plus a 10-slide explanation you can deliver without notes.","verification":"Part A: your GATE mock scores, which are external. Part B: a faculty member or a working engineer reviews the calculations against the code or standard used; every figure is reproducible from the public source cited; you can answer 'why this method' for each step in a 30-minute mock interview run by a senior or a coaching mentor."},"ai_task_shift":[{"task_2019":"Solving and re-solving previous-year papers with a coaching solution book","now":"An AI tutor explains any PYQ step by step on demand and generates unlimited practice variants; solution books are no longer a moat","human_owns":"Sitting the three-hour paper without help: recall speed, calculation accuracy, and exam-day composure are untouched by AI and decide the rank"},{"task_2019":"Drafting routine engineering reports, inspection notes and tender documents in a PSU or PWD office","now":"Agents draft first versions from templates and site data; the engineer edits and signs","human_owns":"Site judgement, measurement verification and legal accountability for the signed document; the JE or AE remains the person on record"},{"task_2019":"Manual load, stress and heat-balance calculations for design checks","now":"Agents set up the calculation in code or a tool from a spoken description","human_owns":"Knowing which code clause applies, catching an absurd result, and defending the assumption in a departmental review"},{"task_2019":"Tracking notifications, cut-offs and application deadlines across UPSC, SSC, RRB, PSUs and state PSCs by hand","now":"An agent can watch notice boards and build the calendar for you","human_owns":"Choosing which two or three exams to actually prepare for; spreading across six is the common failure mode"},{"task_2019":"Interview preparation from printed question banks","now":"Mock interviews with an AI interviewer on your branch and project are free and unlimited","human_owns":"The whiteboard derivation and the plant-floor judgement the real panel probes; being fluent in front of five senior engineers"},{"task_2019":"Operations logging and routine monitoring in plants and substations","now":"SCADA analytics and agent-generated shift summaries do the routine monitoring","human_owns":"Abnormal-event handling, safety permits, and the decision to trip or isolate; this is why PSUs still hire engineers into shifts"}],"fallback_path_id":"infrastructure_energy","employers":[{"name":"UPSC Engineering Services Examination (ESE 2027)","type":"exam","location":"All India; posts in central engineering services (railways, CPWD, MES, telecom, power, ordnance)","roles":"Assistant Executive Engineer grade in Civil, Mechanical, Electrical and Electronics and Telecom; notified 16 September 2026, prelims 31 January 2027; CS/IT not eligible","fresher":true,"source_url":"https://www.pw.live/gate/exams/upsc-ese-2027-vacancy","seen_on":"2026-09"},{"name":"SSC Junior Engineer (SSC JE 2026)","type":"exam","location":"All India; posts in CPWD, MES, BRO, CWC, IMD, DoT and other central departments","roles":"Junior Engineer in Civil, Mechanical and Electrical, plus new Scientific Assistant (IMD) and JE Telecom posts; notified 2 September 2026, applications to 22 September 2026, Paper 1 October or November 2026","fresher":true,"source_url":"https://testbook.com/news/ssc-je-2026-notification-out/","seen_on":"2026-09"},{"name":"RRB Junior Engineer (CEN 04/2026)","type":"exam","location":"All India, zone-wise railway postings","roles":"Junior Engineer, Depot
