 NATS in Electrical and Civil, August 2026 notice with monthly stipend","fresher":true,"source_url":"https://www.adda247.com/engineering-jobs/pgcil-apprentice-recruitment-2026/","seen_on":"2026-08"},{"name":"ReNew","type":"company","location":"Gurugram HQ; solar and wind sites in Rajasthan, Gujarat, Karnataka, Maharashtra","roles":"Graduate Engineer Trainee with the GOLD programme (bootcamps at NISE and NIWE), diploma engineer intake, and the Global Green Scholars internship","fresher":true,"source_url":"https://www.renew.com/renew-early-careers-programs/programs-in-detail","seen_on":"2026-09"},{"name":"Adani Green Energy (and Adani group GET drives)","type":"company","location":"Ahmedabad HQ; Khavda and other solar and wind sites","roles":"Site and O&M engineers via careers portal and CV submission; group-level GET drives in 2026 were for technology roles in Ahmedabad","fresher":true,"source_url":"https://www.adanigreenenergy.com/careers","seen_on":"2026-09"},{"name":"Tata Power","type":"company","location":"Mumbai, Delhi, Odisha discoms; renewable sites","roles":"Graduate Engineer Trainee (Electrical) through the careers portal and TCS iON tests, plus internships; freshers section on the career compass page","fresher":true,"source_url":"https://www.tatapower.com/career-compass","seen_on":"2026-09"}],"fit_rules":[{"field":"branch","value":"CIVIL","score":3,"reason":"Civil is the main intake for EPC, highway, metro and NHIDCL roles, and the largest branch in NTPC and Power Grid civil posts."},{"field":"branch","value":"EE","score":3,"reason":"Electrical is what Power Grid, discoms, solar EPCs and NTPC electrical posts ask for."},{"field":"branch","value":"MECH","score":2,"reason":"Mechanical enters through NTPC, plant erection and O&M, and wind projects."},{"field":"branch","value":"ECE","score":1,"reason":"Metro signalling, substation automation and Power Grid electronics posts take ECE, but the seats are few."},{"field":"branch","value":"CS","score":-3,"reason":"Almost no infrastructure or energy fresher notice lists CS or IT; the software path is the better use of a CS degree."},{"field":"branch","value":"IT","score":-3,"reason":"Almost no infrastructure or energy fresher notice lists IT."},{"field":"interests","value":"physical_systems","score":2,"reason":"Structures, grids and plants are physical systems built on site."},{"field":"interests","value":"building_software","score":-2,"reason":"Software here is a tool (STAAD, ETAP, Primavera), not the product."},{"field":"enjoyed","value":"workshops_site","score":3,"reason":"Site is where the first years happen; liking site visits and machines is the best predictor of staying."},{"field":"enjoyed","value":"exams_theory","score":1,"reason":"The PSU route is a GATE exam, so exam ability opens NTPC, Power Grid and NHAI."},{"field":"preparation","value":"core_tools","score":2,"reason":"STAAD, AutoCAD, ETAP or Primavera already in hand is what postings name."},{"field":"preparation","value":"gate_prep","score":2,"reason":"GATE decides PSU trainee posts; preparation already started is a head start."},{"field":"preparation","value":"internship_done","score":2,"reason":"Site internship or apprenticeship is what EPC recruiters ask about first."},{"field":"relocation","value":"anywhere_india","score":2,"reason":"Projects are wherever the road, line or plant is; mobility is the job."},{"field":"relocation","value":"hometown_only","score":-3,"reason":"Site roles move every project; staying near home only works at a local discom or PWD."},{"field":"relocation","value":"within_state","score":-1,"reason":"Possible at a state discom, PWD or metro, but EPC and PSU postings cross states."},{"field":"priority","value":"stability","score":2,"reason":"PSU trainee posts and utility jobs are among the most stable engineering jobs in India."},{"field":"priority","value":"income_now","score":2,"reason":"Site engineer and apprentice roles are available quickly at tier-3, even if pay starts low; EPC firms and metro corporations run GET intakes every year and site roles start quickly."},{"field":"priority","value":"high_pay_growth","score":-2,"reason":"Fresher pay is modest and growth is by years on site, not by fast promotion."},{"field":"college_tier","value":"3","score":1,"reason":"This door is more open to tier-3 graduates than most, because site roles are short of people and the PSU route is brand-blind."}],"base_score":5,"stat_ids_used":["paths.energy.clean_energy_jobs_2030","paths.govt.psu_via_gate_examples.2026","demand.naukri.jobspeak.fresher_yoy.aug2026","paths.infra.fresher_ctc_bands.2026","paths.skilling.nats_graduate_stipend.2026"],"last_reviewed":"2026-09-21","changed_fields":["all"],"skills":[{"id":"autocad","level":"required","weight":3},{"id":"staad_pro_structural_analysis","level":"required","weight":3},{"id":"etap_or_power_systems_analysis","level":"required","weight":3},{"id":"primavera_or_ms_project","level":"required","weight":2},{"id":"site_engineering_and_safety","level":"required","weight":3},{"id":"quantity_surveying_and_estimation","level":"required","weight":2},{"id":"solar_pv_design_pvsyst","level":"preferred","weight":2},{"id":"revit_bim","level":"preferred","weight":2},{"id":"gate_preparation_civil","level":"preferred","weight":2},{"id":"gate_preparation_electrical","level":"preferred","weight":2},{"id":"geotechnical_and_surveying_basics","level":"preferred","weight":1},{"id":"renewable_energy_fundamentals","level":"preferred","weight":1},{"id":"power_grid_and_transmission_basics","level":"preferred","weight":1},{"id":"excel_and_business_analysis","level":"preferred","weight":1}]},{"id":"it_services","name":"IT services (mass recruiters)","tagline":"Shrinking door: most fresher seats in India, but fewer each year and pay flat since 2008","door_state":"shrinking","door_size":{"people_per_year":100000,"stat_ids":["demand.tcs.freshers_added.fy26","demand.infosys.freshers.fy26","demand.cognizant.freshers.2025","demand.hcltech.freshers.fy26","demand.wipro.freshers.fy26","supply.teamlease.it_fresher_hiring.fy22","supply.teamlease.it_fresher_hiring.fy24"],"caveat":"Sum of five companies' own FY26 statements (TCS 44,000 trainees, Infosys 20,000, Cognizant 20,000, HCLTech 11,000, Wipro 7,500), rounded down; the industry took about 4 lakh freshers in FY22 and an estimated 1.6 lakh in FY24, so the door has roughly halved in four years and Wipro has no FY27 target at all."},"pay_band":{"low_lpa":3.1,"high_lpa":4.5,"stat_ids":["demand.it_services.fresher_ctc.tcs","demand.fresher_ctc.bands.2026"],"note":"TCS and Infosys base offers are around Rs 3.1 to 3.4 lakh and have not moved since about 2008; specialist tracks (Infosys DSE, TCS Digital and Prime, Cognizant GenC Next, Accenture AASE) pay roughly double for a small share who clear a harder coding test."},"branches":{"CS":3,"IT":3,"ECE":3,"EE":2,"MECH":2,"CIVIL":1,"CHEM":1,"OTHER":1},"tiers_realistic":{"tier1":"Yes, but most tier-1 graduates treat these offers as a floor; the specialist tracks (Rs 7 to 9 lakh) are where tier-1 candidates actually join.","tier2":"Yes; this is the core catchment. Campus drives still visit well-known state and private colleges, though intake per college has fallen and offer-to-joining gaps of 6 to 12 months are common.","tier3":"Yes, this remains the most realistic first job for a tier-3 graduate, through open tests (TCS NQT, Infosys off-campus, Cognizant GenC, Accenture ASE, Capgemini, Mphasis) rather than campus visits. What substitutes for the brand: a 60%+ academic record with no backlogs, a clear aptitude and basic coding test score, spoken English good enough for a client call, and one small deployed project. Be honest with yourself that seats are fewer each year (five firms' net headcount fell in FY26, demand.top5_it.net_headcount.fy26) and only 35% of IT employers intended to hire freshers in ISR 2026 (supply.isr2026.it_fresher_hiring_intent)."},"entry_requirements":["60% or 6.0 CGPA throughout (10th, 12th, degree) with no active backlogs; most mass recruiters hard-filter on this","Aptitude plus basic programming test (TCS NQT, Infosys InfyTQ-style, Cognizant GenC, Wipro NLTH, Accenture cognitive and coding assessment): arrays, strings, SQL queries, simple OOP in Java or Python","Spoken and written English at a level that passes a communication round; Accenture and Cognizant test this explicitly","One programming language to working level (Java or Python) plus SQL; for specialist tracks, LeetCode-easy DSA and a second language","Willingness to sign a service agreement and accept any base location and any project (banking, insurance, retail, telecom support are the usual first postings)","Increasingly: a certificate in cloud (AWS or Azure fundamentals) or a GenAI foundations badge; TCS reports 312,000 AI/ML-proficient staff (demand.tcs.ai_ml_proficient.q1fy27) and expects trainees to start at that baseline","Eligibility often limited to the current and previous two batches (2024 to 2026), so apply in the graduation year"],"two_year_plan":[{"block":"H1","title":"Clear the filters: aptitude, one language, SQL","learn":["Quantitative aptitude, logical reasoning and verbal ability: free resources (IndiaBIX, PrepInsta free tier, NPTEL 'Aptitude' lectures); 45 minutes a day","Java or Python to the level of writing a 50-line program from a problem statement without help; NPTEL 'Programming in Java' or CS50P","SQL basics through joins and group by on PostgreSQL or MySQL","TCS NQT syllabus and Infosys, Cognizant GenC, Accenture test patterns; register on TCS NextStep, Infosys Careers, Accenture India campus portal, Capgemini Students/Graduates and Mphasis campus pages in your final year"],"build":["A small Java or Python console application (library, billing or attendance) with a MySQL backend, on GitHub"],"evidence":["Timed mock test scores tracked weekly","One GitHub repo with README"],"target":["TCS NQT (open year-round)","Infosys off-campus","Cognizant GenC","Accenture ASE","Capgemini","Mphasis"]},{"block":"H2","title":"Aim for the specialist track, not just the base offer","learn":["DSA to LeetCode-easy plus some medium (100 problems): this is what separates Infosys DSE, TCS Digital and Prime, Cognizant GenC Next and Accenture AASE from the base offer","A cloud fundamentals certificate: AWS Cloud Practitioner (free training) or Azure AZ-900 via FutureSkills Prime at no cost","Spring Boot (Java) or Django/FastAPI (Python) basics; REST APIs; Git","GenAI foundations: how to call an LLM API, what RAG is, prompt basics; recruiters now ask for this even at base level"],"build":["A REST API with a database and a simple front end, deployed on a free tier, with an LLM-powered feature (for example, a support chatbot over the product's FAQ)"],"evidence":["Cloud certificate","Deployed URL and repo","TCS Digital or Infosys DSE test attempt"],"target":["TCS Digital and Prime via NQT","Infosys DSE and Specialist Programmer","Cognizant GenC Next and GenC Pro","Accenture AASE","Tech Mahindra campus drive (resumed July 2026)"]},{"block":"H3","title":"First posting: become useful fast, pick a domain","learn":["Whatever your training batch teaches (usually Java full stack, .NET, SAP, Salesforce, ServiceNow or testing): finish the internal certification in the first attempt","The client's domain: banking, insurance, retail or telecom; read the process documents nobody else reads","Agentic tooling used on the account (GitHub Copilot, internal assistants): learn to review AI-generated code and tests, because that review is the job now","If still waiting for a joining date: the same cloud and GenAI material, plus a NATS graduate apprenticeship (Rs 12,300 per month stipend, paths.skilling.nats_graduate_stipend.2026) rather than sitting idle"],"build":["One automation for your own team's repetitive work (a script, a dashboard, a test suite) and show it to your lead"],"evidence":["Internal certification","A written summary of what you automated and time saved"],"target":["Your own account's rotation to a development role","Internal specialist programmes"]},{"block":"H4","title":"Use the job as a base to move up or across","learn":["Choose one exit: (a) a specialist role inside (cloud, data engineering, SAP, cybersecurity) with the vendor certificate (AWS Solutions Architect Associate, Azure Data Engineer, SAP), or (b) the ai_native_software path with a portfolio built on evenings, or (c) a GCC role in the same domain","Interview preparation for GCCs: DSA medium, system design basics, domain questions"],"build":["The evidenced project below, built in the domain of your first posting, outside work hours and with no client data"],"evidence":["One vendor certificate","Evidenced project deployed and documented","Two years of appraisal ratings"],"target":["GCCs in your domain (banking or insurance captives)","Product companies via referrals","Specialist tracks in your own company"]}],"evidenced_project_spec":{"title":"Order-to-cash reconciliation service for a retail chain","scope":"A service that ingests daily sales files from 20 synthetic stores (POS CSV exports), payment-gateway settlement files and bank statements, matches them, flags mismatches with reasons, exposes a REST API and a small dashboard, and lets a finance user ask questions about exceptions in plain language via an LLM tool that only queries the reconciled tables. Includes automated tests, a nightly scheduled run and a runbook.","domain":"retail","agent_use":"A coding agent generates the CSV parsers, test fixtures and the first version of the matching rules; the graduate specifies the matching logic in writing first, reviews every generated function against it, and keeps a changelog of the agent's mistakes (wrong date handling, missed partial settlements). The LLM query feature is built with strict read-only SQL and a small eval set of 30 finance questions.","done_looks_like":"Runs end to end nightly on a free-tier VM; matches 98% of synthetic transactions correctly with every mismatch labelled; the finance chat answers 25 of 30 eval questions correctly and refuses out-of-scope requests; README explains the business process (order, invoice, settlement, bank credit), the rules and the failure cases.","verification":"Test suite in CI with a published coverage number; a seeded set of 50 known mismatches that the system must catch every run; a 30-minute walkthrough the graduate can give covering the retail cash cycle, one rule that was wrong and how it was found, and why the LLM is restricted to read-only queries; a reviewer from finance or a faculty member signs off on five outputs."},"ai_task_shift":[{"task_2019":"Manual and scripted testing on a fresher bench (the largest fresher intake)","now":"Agents generate and run regression suites; testing benches are the first seats cut, which is why fresher intake halved between FY22 and FY24","human_owns":"Test strategy, exploratory testing of business flows, and signing off that the client's process actually works"},{"task_2019":"Level-1 application support: read the ticket, follow the runbook, escalate","now":"Agents triage, summarise and resolve routine tickets; TCS says its delivery model, not layoffs, changed and it expects fewer trainees per unit of work","human_owns":"Level-2 root-cause work, changes that touch the client's data, and talking to the client"},{"task_2019":"Write CRUD screens and reports to a specification","now":"Copilots draft the code; the trainee is expected to review, test and integrate, and to know the domain well enough to spot a wrong assumption","human_owns":"Requirement clarification, domain rules, code review and accountability for production"},{"task_2019":"Migrate code between versions or platforms by hand (legacy modernisation)","now":"Agents do bulk translation; large modernisation deals still need people to verify behaviour and fix edge cases","human_owns":"Verification design, edge-case handling, and cutover planning"},{"task_2019":"Prepare status reports, documentation and meeting notes","now":"Generated automatically from tickets and calls","human_owns":"Deciding what matters, negotiating scope, and client relationships; communication skills now count for more, not less"}],"fallback_path_id":"ai_native_software","employers":[{"name":"TCS","type":"company","location":"Pan-India","roles":"Ninja, Digital and Prime via TCS NQT; 44,000 trainees added in FY26, 25,000 campus offers for FY27 so far","fresher":true,"source_url":"https://www.peoplematters.in/news/business/tcs-workforce-shrinks-by-24000-in-fy26-says-layoffs-over-hiring-remains-on-track-49257","seen_on":"2026-04"},{"name":"Infosys","type":"company","location":"Pan-India","roles":"System Engineer, Digital Specialist Engineer, Specialist Programmer; 20,000 freshers in FY26 and same plan for FY27","fresher":true,"source_url":"https://www.peoplematters.in/news/recruiting-and-onboarding/infosys-to-hire-20000-freshers-as-headcount-falls-and-attrition-drops-to-126percent-49381","seen_on":"2026-04"},{"name":"Cognizant","type":"company","location":"Chennai, Hyderabad, Pune, Kolkata, Bengaluru","roles":"GenC, GenC Next, GenC Pro; 20,000 freshers in 2025, plan of 24,000 to 25,000 in 2026","fresher":true,"source_url":"https://www.thehansindia.com/tech/cognizant-bets-on-ai-ready-talent-plans-to-hire-up-to-25000-fresh-graduates-in-2026-1045995","seen_on":"2026-04"},{"name":"Wipro","type":"company","location":"Pan-India","roles":"Elite and Turbo via NLTH; 7,500 freshers in FY26, no FY27 target, hiring 'on demand'","fresher":true,"source_url":"https://www.businesstoday.in/technology/story/wipro-hits-pause-on-campus-hiring-as-ai-shift-forces-526096-2026-04-17","seen_on":"2026-04"},{"name":"HCLTech","type":"company","location":"Noida, Chennai, Bengaluru, Madurai, Lucknow, Nagpur","roles":"Graduate engineer trainee and TechBee (post-12th); 11,000 freshers in FY26, only 1,056 in Q1 FY27","fresher":true,"source_url":"https://www.peoplematters.in/news/strategic-hr/hcltech-sees-biggest-workforce-reduction-in-a-year-cuts-3292-jobs-in-q1-50816","seen_on":"2026-07"},{"name":"Tech Mahindra","type":"company","location":"Pune, Hyderabad, Bengaluru, Chennai, Noida","roles":"Campus hiring resumed after a pause, announced with Q1 FY27 results; headcount still falling","fresher":true,"source_url":"https://www.whalesbook.com/news/English/technology/Tech-Mahindra-Resumes-Campus-Hiring-After-Q1-Profit-Rises-316percent/6a58fb9f5cb7edf90c340a45","seen_on":"2026-07"},{"name":"Accenture India","type":"company","location":"Bengaluru, Hyderabad, Chennai, Pune, Mumbai","roles":"Associate Software Engineer, Advanced ASE, System and Application Services Associate; 2024 to 2026 passouts via the India campus portal","fresher":true,"source_url":"https://www.freshersbridge.in/companies/accenture","seen_on":"2026-09"},{"name":"Capgemini India","type":"company","location":"Mumbai, Pune, Bengaluru, Chennai, Hyderabad, Kolkata","roles":"Technical graduate programmes across Capgemini, Capgemini Engineering and Sogeti; apply via Students/Graduates filter","fresher":true,"source_url":"https://www.capgemini.com/in-en/careers/career-paths/students-and-graduates/","seen_on":"2026-09"},{"name":"Mphasis","type":"company","location":"Bengaluru, Pune, Chennai, Mangaluru","roles":"T-School campus programmes (MLA, MASE) and internships; tier-1 and tier-2 institutes named, off-campus trainee drives for others","fresher":true,"source_url":"https://careers.mphasis.com/home/hot-jobs/category/campus-programs.html","seen_on":"2026-09"}],"fit_rules":[{"field":"branch","value":"CS","score":1,"reason":"Accepted everywhere; your competition here is every other branch, so aim for the specialist track."},{"field":"branch","value":"ECE","score":1,"reason":"Mass recruiters take ECE at the same rate as CS if you pass the coding test."},{"field":"branch","value":"MECH","score":1,"reason":"Mass recruiters still take Mechanical and Electrical graduates when core jobs are scarce; the test does not depend on your branch."},{"field":"college_tier","value":"3","score":2,"reason":"This is the path where a tier-3 college matters least: open tests like TCS NQT and Infosys off-campus do not look at your college."},{"field":"college_tier","value":"2","score":1,"reason":"Campus drives still visit tier-2 colleges, though with fewer seats than before."},{"field":"college_tier","value":"1","score":-1,"reason":"You will likely get this offer, but treat it as a floor; better doors are open to you."},{"field":"graduation_year","value":"graduated","score":1,"reason":"Most drives accept the previous two batches, so an already-graduated candidate can still apply through 2026."},{"field":"graduation_year","value":"2026","score":1,"reason":"The 2026 batch is in the eligibility window for every current drive."},{"field":"relocation","value":"anywhere_india","score":2,"reason":"Offers come with a base location you do not choose; accepting any city is often the difference between an offer and none."},{"field":"relocation","value":"hometown_only","score":-3,"reason":"Mass recruiters post you where the project is; refusing relocation usually means the offer lapses."},{"field":"runway_months","value":"0_3","score":1,"reason":"This is the fastest route to a salary for most graduates, even though joining dates can slip."},{"field":"runway_months","value":"12_plus","score":-1,"reason":"With a year of runway you can afford to aim at a better-paying door first and keep this as fallback."},{"field":"interests","value":"building_software","score":1,"reason":"Day-to-day work is software delivery, mostly maintenance and support at the start."},{"field":"interests","value":"people_business","score":1,"reason":"Client communication and coordination matter more as routine coding is automated."},{"field":"interests","value":"research_theory","score":-2,"reason":"There is little research or theory in entry-level services work."},{"field":"priority","value":"income_now","score":3,"reason":"The largest number of fresher seats and the shortest time to a first salary."},{"field":"priority","value":"stability","score":-1,"reason":"Intake is falling and five firms' net headcount shrank in FY26; the first job is real but not a long-term guarantee."},{"field":"priority","value":"high_pay_growth","score":-3,"reason":"Base pay has been about Rs 3 lakh for nearly two decades; growth is slow unless you move to a specialist track or out."},{"field":"preparation","value":"dsa","score":1,"reason":"Coding practice lifts you from the base track to the specialist track, which roughly doubles pay."}],"base_score":7,"stat_ids_used":["demand.tcs.freshers_added.fy26","demand.infosys.freshers.fy26","demand.cognizant.freshers.2025","demand.hcltech.freshers.fy26","demand.wipro.freshers.fy26","supply.teamlease.it_fresher_hiring.fy22","supply.teamlease.it_fresher_hiring.fy24","demand.it_services.fresher_ctc.tcs","demand.fresher_ctc.bands.2026","demand.top5_it.net_headcount.fy26","supply.isr2026.it_fresher_hiring_intent","demand.tcs.ai_ml_proficient.q1fy27","paths.skilling.nats_graduate_stipend.2026","demand.tcs.fresher_offers.fy27","demand.infosys.freshers_plan.fy27","demand.cognizant.freshers_plan.2026","demand.wipro.freshers_plan.fy27","demand.hcltech.freshers.q1fy27"],"last_reviewed":"2026-09-21","changed_fields":["fit_rules","all"],"skills":[{"id":"interview_aptitude_and_hr","level":"required","weight":3},{"id":"sql","level":"required","weight":3},{"id":"communication_written_english","level":"required","weight":3},{"id":"python","level":"required","weight":2},{"id":"git_github","level":"required","weight":1},{"id":"dsa","level":"preferred","weight":2},{"id":"fastapi_or_spring","level":"preferred","weight":2},{"id":"rest_apis","level":"preferred","weight":2},{"id":"cloud_fundamentals_aws","level":"preferred","weight":2},{"id":"cloud_fundamentals_azure","level":"preferred","weight":2},{"id":"deployed_portfolio_project","level":"preferred","weight":2},{"id":"llm_apis_and_agents","level":"preferred","weight":1},{"id":"domain_bfsi_basics","level":"preferred","weight":1}]},{"id":"semiconductor_electronics","name":"Semiconductor and electronics","tagline":"Small but growing door; far fewer real jobs this year than the headlines promise","door_state":"growing","door_size":{"people_per_year":15000,"stat_ids":["paths.semiconductor.direct_jobs_govt_statement.2026","paths.semiconductor.units_approved_in_production.2026","paths.semiconductor.engineers_trained_c2s.2026","paths.semiconductor.jobs_projection_nlb.2024"],"caveat":"Minister's Aug 2026 statement of 50,000 to 60,000 direct jobs 'in coming years' spread over roughly four years; only 3 of 12 approved units are in production, 85,000 engineers have already been trained under C2S, and the earlier NLB projection of 1 million jobs by 2026 did not materialise."},"pay_band":{"low_lpa":4,"high_lpa":6,"stat_ids":["paths.semiconductor.fresher_ctc_bands.2026"],"note":"Design-services firms and ATMP/OSAT plants pay 4 to 6 for most freshers; NVIDIA 22 to 30, Qualcomm 17 to 23, Intel and Broadcom 16 to 22 go to a small number, mostly M.Tech or tier-1 B.Tech. Source is a low-confidence salary guide."},"branches":{"CS":1,"IT":0,"ECE":3,"EE":3,"MECH":1,"CIVIL":0,"CHEM":2,"OTHER":0},"tiers_realistic":{"tier1":"Yes. Qualcomm, NVIDIA, Texas Instruments, Micron, Samsung and AMD run campus drives at IITs, NITs and IIITs, and prefer M.Tech VLSI for design roles; B.Tech offers go mainly to the top of the ECE class.","tier2":"Partly. Design-services firms (Tessolve, eInfochips, Sankalp, MosChip, HCLTech and Wipro engineering units) and the new fabs and OSATs (Tata Electronics, Micron Sanand, CG Semi, Kaynes) hire B.Tech ECE/EE from tier-2 colleges, usually through off-campus tests and their own training programmes; pay starts in the 4 to 6 band.","tier3":"Hard but not closed, and honesty matters here: about 1.6 lakh students enrol in ECE each year (supply.aicte.branch_enrolment.ece.2024_25) against a door of tens of thousands at most, so most tier-3 ECE graduates will not get a VLSI design job in two years. What substitutes for the brand: a C2S-supported college licence for Cadence or Synopsys tools with a finished RTL-to-GDS or verification project you can defend, a GATE ECE score (useful for M.Tech VLSI, ISRO and PSU routes), and a willingness to start in test, product engineering, DFT or fab/ATMP operations rather than front-end design. A paid VLSI training institute is not required; free NPTEL and C2S material plus a real project is a stronger signal than a certificate."},"entry_requirements":["Digital design fundamentals: combinational and sequential logic, FSMs, timing, CMOS basics; tested in every screening","Verilog or SystemVerilog to the level of writing and simulating a module (FIFO, UART, AXI-lite slave) with a testbench; open-source Icarus/Verilator or Cadence Xcelium via a C2S college licence","For verification roles (the largest fresher intake in design services): SystemVerilog and UVM basics, assertions, coverage","For back-end roles: static timing analysis, synthesis, place-and-route concepts, DFT basics (scan, ATPG, BIST) and familiarity with Synopsys or Cadence flows","For fab, ATMP and OSAT roles (Tata Electronics, Micron, CG Semi, Kaynes): semiconductor process basics, statistics and SPC, cleanroom discipline, shift work; Chemical and Mechanical graduates also enter here","Programming for scripting and automation: Python and TCL, plus Linux; C for embedded and post-silicon validation","M.Tech VLSI or a GATE ECE score for the higher-paying design houses; a 7+ CGPA filter at Qualcomm, NVIDIA, TI and Micron campus drives"],"two_year_plan":[{"block":"H1","title":"Digital design and Verilog, with free tools","learn":["NPTEL 'Digital Circuits' and 'Hardware Modeling using Verilog' (IIT Kharagpur, free)","Verilog and SystemVerilog basics on open-source tools: Icarus Verilog, Verilator, GTKWave; HDLBits for daily practice","Get access to your college's C2S (Chips to Startup) licences for Cadence or Synopsys; if your college is not on C2S, ask the ECE department to apply and use open-source OpenROAD and SkyWater 130 nm PDK meanwhile","Python and Linux shell for scripting; basics of TCL","Start GATE ECE preparation alongside (networks, signals, digital, EDC) since it opens M.Tech VLSI, ISRO and PSU doors"],"build":["A parameterised FIFO and a UART transmitter/receiver in Verilog with self-checking testbenches, on GitHub"],"evidence":["HDLBits progress","GitHub repos with waveforms in the README"],"target":["Nothing yet; use this half to decide between design/verification and fab/ATMP tracks based on what you enjoy"]},{"block":"H2","title":"Verification (UVM) or physical design; first RTL-to-GDS","learn":["SystemVerilog for verification and UVM: free Verification Academy (Siemens) courses, Doulos tutorials, ChipVerify","Synthesis and STA concepts: setup and hold, clock domains, constraints (SDC); NPTEL 'VLSI Physical Design' (IIT Kharagpur)","DFT basics: scan insertion, ATPG, BIST; read the Synopsys or Cadence DFT user guide sections your C2S licence covers","Complete an RTL-to-GDS flow once on OpenROAD/OpenLane with SkyWater 130 nm, then repeat on Cadence Genus/Innovus via C2S if available"],"build":["A UVM testbench for your UART or an AXI-lite peripheral with functional coverage and assertions","An RTL-to-GDS run of a small RISC-V core or your own design with timing closed and a DRC-clean layout"],"evidence":["Coverage report and bug list from the UVM project","GDS screenshot, timing report and area numbers in the README"],"target":["VLSI internships (summer): Tessolve, eInfochips, Sankalp, MosChip, Samsung SSIR and Qualcomm intern postings","Flipkart-style hiring challenges do not exist here; apply directly on career pages and via faculty referrals"]},{"block":"H3","title":"Internship or fab/ATMP entry, and the evidenced project","learn":["If you got a design-services internship: the company's flow, scripting for regressions, reading a spec end to end","If not: semiconductor manufacturing basics for the fab and OSAT track (NPTEL 'Semiconductor Device Fabrication'; Micron and Tata Electronics operator-to-engineer pathways), plus six-sigma and SPC basics","Post-silicon validation and test (ATE basics, bench debugging) which is where Tessolve's TET programme and TI's test roles start","GATE ECE mock tests weekly if you are keeping the M.Tech or ISRO route open"],"build":["The evidenced project below (an automotive-grade CAN or LIN controller IP with full verification and DFT)"],"evidence":["Internship completion letter or a fab/ATMP trainee offer","Project repo with verification plan, coverage closure and DFT report"],"target":["Tata Electronics early careers (Dholera fab, Jagiroad ATMP, Hosur)","Micron Sanand and Hyderabad new-college-grad roles","Tessolve TET","ISRO ICRB Scientist/Engineer SC (Electronics), CBT Oct 2026","GATE 2027"]},{"block":"H4","title":"Interviews across design, DFT, test and manufacturing","learn":["Interview drill: FSM design on a whiteboard, setup/hold arithmetic, CDC, FIFO depth calculation, UVM phase questions, scan chain questions","Read two public datasheets end to end and explain the register map; interviewers test whether you can read a spec","Prepare a 30-minute walkthrough of the evidenced project and a one-page summary of the internship or trainee work"],"build":["Portfolio page listing the three builds with reports; keep applying weekly to design services, OSATs and product companies' new-grad postings"],"evidence":["Interview log","GATE score if taken","Offers or M.Tech admission"],"target":["Qualcomm, NVIDIA, TI, AMD, Micron new-college-graduate postings (2026 and 2027 batches)","Design services and OSAT firms","M.Tech VLSI at an NIT or IIT via GATE as the alternative door; fallback to ev_automotive embedded roles"]}],"evidenced_project_spec":{"title":"Automotive CAN 2.0B controller IP: RTL, UVM verification and DFT","scope":"Design a CAN 2.0B controller (bit timing, arbitration, CRC, error handling, TX/RX message buffers with an AXI-lite register interface) in Verilog; write a verification plan and a UVM testbench with a CAN bus model, functional coverage and assertions; synthesise, run STA, insert scan and generate ATPG patterns; run RTL-to-GDS on SkyWater 130 nm with OpenROAD or on Cadence tools through a C2S licence. Target use case: a body-control ECU in a two-wheeler EV.","domain":"automotive","agent_use":"A coding agent drafts the register map documentation, generates the UVM skeleton, scripts regressions and produces first-pass testbench sequences from the CAN specification; the graduate writes the RTL and the assertions by hand, reviews every generated sequence against the spec, and records the cases where the agent misread the standard (for example bit-stuffing rules). A research agent is used to summarise ISO 11898-1 timing requirements, which the graduate verifies against the standard text.","done_looks_like":"RTL passes a regression of at least 200 randomised tests with 95%+ functional coverage and zero open bugs; timing closed at 100 MHz on the target library; scan coverage above 95% with ATPG patterns; DRC/LVS-clean GDS; a 10-page design document with block diagram, register map, verification plan, coverage report, timing summary and DFT summary.","verification":"Regression and coverage reports committed to the repo and reproducible with one script; an independent check by interoperating with an open-source CAN model (or a second student's implementation); a faculty or industry reviewer signs off on the verification plan; the graduate can explain for 30 minutes how arbitration is verified, one real bug the testbench caught, why scan coverage was not 100%, and what changed between RTL and post-layout timing."},"ai_task_shift":[{"task_2019":"Write testbench boilerplate, sequences and regression scripts by hand","now":"Agents generate UVM skeletons, sequences and regression scripts from a spec; verification engineers spend more time on the plan and the coverage holes","human_owns":"Verification planning, deciding what to cover, reading the spec correctly, and debugging the failures the generator cannot explain"},{"task_2019":"Hand-write RTL for standard blocks (FIFOs, arbiters, bus interfaces)","now":"Agents produce first-draft RTL for standard blocks; quality varies and must be checked against timing and area","human_owns":"Micro-architecture, power and timing trade-offs, and reviewing generated RTL for synthesisability and corner cases"},{"task_2019":"Iterate synthesis, placement and timing closure by manually tuning constraints and scripts","now":"EDA vendors ship AI-driven flow optimisation (Synopsys DSO.ai-style and Cadence Cerebrus-style tools) that explore settings automatically","human_owns":"Setting the constraints and goals, judging when a result is real versus an artefact, and signing off tape-out risk"},{"task_2019":"Read datasheets and standards and summarise them for the team","now":"Agents summarise standards in minutes, sometimes wrongly","human_owns":"Verifying the summary against the source, and the engineering judgement about what the standard means for this design"},{"task_2019":"Fab and ATMP process monitoring by reading charts on shift","now":"Anomaly detection and yield analytics flag excursions automatically","human_owns":"Root-cause analysis, process changes, equipment ownership and the shift decisions that cost real money if wrong"}],"fallback_path_id":"ev_automotive","employers":[{"name":"Tata Electronics","type":"company","location":"Dholera (fab), Jagiroad Assam (ATMP), Hosur","roles":"Early careers: graduate engineer trainee via internship and boot-camp selection; engineering, operations and digital tracks","fresher":true,"source_url":"https://www.tataelectronics.com/early-careers","seen_on":"2026-09"},{"name":"Micron Technology India","type":"company","location":"Sanand (ATMP), Hyderabad, Bengaluru","roles":"New College Grad programme; graduate engineering technician and associate engineer roles at Sanand; applications open around August","fresher":true,"source_url":"https://in.micron.com/about/careers/university-recruiting","seen_on":"2026-09"},{"name":"Qualcomm India","type":"company","location":"Bengaluru, Hyderabad, Chennai, Noida","roles":"Engineer HW and Engineer SW, 2026 batch B.E./B.Tech/M.Tech in CS, ECE, EE, VLSI","fresher":true,"source_url":"https://freshershunt.in/qualcomm-campus-hiring-2026/","seen_on":"2026-06"},{"name":"NVIDIA India","type":"company","location":"Bengaluru, Gurugram, Pune","roles":"New College Graduate roles including formal verification engineer (Verilog/SystemVerilog) and system software engineer, 2026 batch","fresher":true,"source_url":"https://offcampusjobs4u.com/nvidia-recruitment-2026-verification-india/","seen_on":"2026-06"},{"name":"Texas Instruments India","type":"company","location":"Bengaluru","roles":"Software development engineer and test/product roles for 2026 batch; campus drives at select colleges","fresher":true,"source_url":"https://offcampusjobs4u.com/texas-instruments-recruitment-2026-software-development-engineer/","seen_on":"2026-08"},{"name":"AMD India","type":"company","location":"Bengaluru, Hyderabad","roles":"Software development engineer (GPU stack) for 2024 to 2026 batches; silicon design roles listed separately on the AMD careers site","fresher":true,"source_url":"https://offcampusjobs4u.com/amd-recruitment-2026-software-engineer-bengaluru/","seen_on":"2026-09"},{"name":"Tessolve","type":"company","location":"Bengaluru, Chennai, Hyderabad","roles":"Tessolve Engineering Trainee (TET) programme for fresh BE/B.Tech EEE and ECE graduates in post-silicon validation and test","fresher":true,"source_url":"https://www.tessolve.com/careers/","seen_on":"2026-09"},{"name":"ISRO Centralised Recruitment Board (ICRB)","type":"exam","location":"ISRO centres across India","roles":"Scientist/Engineer 'SC' 2026: Electronics 99 posts, Mechanical 52, Computer Science 21; BE/B.Tech with 65% or CGPA 6.84; CBT on 19 Oct 2026","fresher":true,"source_url":"https://www.isro.gov.in/ICRB_Recruitment13.html","seen_on":"2026-08"}],"fit_rules":[{"field":"branch","value":"ECE","score":3,"reason":"ECE is the core branch for design, verification, DFT and test roles."},{"field":"branch","value":"EE","score":3,"reason":"EE graduates are hired on the same terms as ECE for VLSI and for fab equipment roles."},{"field":"branch","value":"CHEM","score":1,"reason":"Fab process and ATMP roles at Tata Electronics, Micron and CG Semi take Chemical and Materials graduates."},{"field":"branch","value":"CIVIL","score":-3,"reason":"There is no realistic entry for Civil graduates in this path."},{"field":"branch","value":"IT","score":-2,"reason":"Only software roles at chip companies are open, and those compete with CS graduates; chip design needs an ECE/EE base."},{"field":"college_tier","value":"1","score":2,"reason":"The high-paying design houses run campus drives at IITs, NITs and IIITs and prefer M.Tech VLSI from them."},{"field":"college_tier","value":"3","score":-2,"reason":"Design houses rarely visit tier-3 colleges; the realistic entry is design services, test, or fab/ATMP operations, or M.Tech via GATE."},{"field":"region","value":"south","score":1,"reason":"Bengaluru and Hyderabad hold most design and verification jobs."},{"field":"region","value":"west","score":1,"reason":"Gujarat (Dholera fab, Sanand ATMP and OSATs) is where the new manufacturing jobs are."},{"field":"region","value":"east_ne","score":1,"reason":"Tata's Jagiroad ATMP in Assam is the first large semiconductor employer in the North-East."},{"field":"relocation","value":"anywhere_india","score":1,"reason":"Jobs are in Bengaluru, Hyderabad, Sanand, Dholera and Jagiroad; you need to be able to move."},{"field":"relocation","value":"hometown_only","score":-3,"reason":"Unless home is Bengaluru, Hyderabad or near Sanand, there are almost no semiconductor jobs near home."},{"field":"runway_months","value":"0_3","score":-2,"reason":"Design and verification roles take 12 to 24 months of preparation for a tier-2/3 graduate; fab/ATMP trainee roles are faster but shift-based."},{"field":"runway_months","value":"12_plus","score":1,"reason":"A year of runway allows the project work or GATE attempt this path needs."},{"field":"interests","value":"hardware_electronics","score":3,"reason":"This path is circuits and chips every day."},{"field":"interests","value":"people_business","score":-2,"reason":"Entry-level semiconductor work is deep technical work with little customer contact."},{"field":"priority","value":"income_now","score":-2,"reason":"Slow entry and a 4 to 6 lakh starting band for most; only a few reach the 16 to 30 band."},{"field":"preparation","value":"core_tools","score":3,"reason":"Verilog/VHDL and EDA tool experience is exactly what screeners look for."},{"field":"preparation","value":"gate_prep","score":2,"reason":"GATE ECE opens M.Tech VLSI, ISRO and PSU routes, which are the main tier-2/3 entries to design roles."},{"field":"enjoyed","value":"labs_hardware","score":2,"reason":"If you enjoyed labs and hardware, the daily work here will suit you."}],"base_score":5,"stat_ids_used":["paths.semiconductor.direct_jobs_govt_statement.2026","paths.semiconductor.units_approved_in_production.2026","paths.semiconductor.engineers_trained_c2s.2026","paths.semiconductor.jobs_projection_nlb.2024","paths.semiconductor.fresher_ctc_bands.2026","supply.aicte.branch_enrolment.ece.2024_25"],"last_reviewed":"2026-09-21","changed_fields":["all"],"skills":[{"id":"digital_design_fundamentals","level":"required","weight":3},{"id":"verilog_systemverilog","level":"required","weight":3},{"id":"rtl_design","level":"required","weight":2},{"id":"functional_verification_uvm","level":"preferred","weight":3},{"id":"static_timing_analysis","level":"preferred","weight":2},{"id":"dft_basics","level":"preferred","weight":2},{"id":"physical_design_basics","level":"preferred","weight":2},{"id":"semiconductor_fabrication_process","level":"preferred","weight":2},{"id":"analog_circuit_basics","level":"preferred","weight":1},{"id":"fpga_prototyping","level":"preferred","weight":1},{"id":"gate_preparation_ece_ee_me","level":"preferred","weight":2},{"id":"python","level":"required","weight":1},{"id":"linux_shell","level":"required","weight":2},{"id":"git_github","level":"preferred","weight":1}]},{"id":"startups_and_non_engineering","name":"Startups and non-engineering roles","tagline":"Growing overall, but the entry-level share is falling; non-IT sectors are where freshers get in","door_state":"growing","door_size":{"people_per_year":180000,"stat_ids":["paths.startups.dpiit_recognised.fy26","paths.startups.entry_level_share.2026","paths.non_eng.naukri_sector_growth.fy26","demand.naukri.jobspeak.fresher_yoy.aug2026","demand.foundit.entry_level_yoy.aug2026"],"caveat":"Derived: 4.99 lakh direct jobs self-reported by DPIIT-recognised startups in FY26 times the 36 percent entry-level share of startup hiring; self-reported, includes non-engineering roles, and the entry-level share fell from 41 percent. Non-IT fresher hiring outside startups (hospitality +21%, BPO/ITES +18%, oil and gas +15% in FY26 on Naukri) is not in this number. Trackers disagree on the trend: Naukri shows freshers +15% in August 2026, foundit shows entry-level -9%."},"pay_band":{"low_lpa":3,"high_lpa":8,"stat_ids":["paths.non_eng.fresher_ctc_bands.2026","demand.fresher_ctc.bands.2026"],"note":"Inside sales 3 to 5 and ops analyst 3.5 to 5.5 are the common bands; product and engineering roles at funded startups pay 8 to 15 and AI/ML roles 18 to 25 for a very small number. Bank PO and BPO associate roles sit at the low end, and some bank trainee programmes charge a fee before paying."},"branches":{"CS":2,"IT":2,"ECE":2,"EE":2,"MECH":2,"CIVIL":1,"CHEM":1,"OTHER":2},"tiers_realistic":{"tier1":"Yes; funded startups, fintech product roles and IIM-style programme-manager roles recruit from tier-1 campuses. The trap is chasing a founding role or a high-pay startup offer that disappears in a funding downturn.","tier2":"Yes. Sales engineering, operations, analytics and fintech ops roles hire on a work sample and a conversation, not a brand. The substitute for brand is an Excel or SQL analysis you can walk through, a communication test you pass, and a domain you can talk about (payments, lending, logistics, hospitality).","tier3":"Yes, and this is the widest door for tier-3 graduates right now: bank PO programmes, BPO and ITES associate walk-ins, insurance and fintech operations, hospitality trainee programmes. Honest caveat: much of it is contract or rotating-shift work at 3 to 4 LPA with a fee-paying training programme in some banks. Treat the first role as a domain entry, and move within 18 months."},"entry_requirements":["Excel at a working level (lookups, pivots, basic modelling) and, for analytics and ops roles, SQL; these appear on nearly every ops, analyst and fintech-ops posting","Spoken and written English at a level that passes a 10-minute phone screen; sales, customer success, BPO and bank roles test this first","Any-graduate eligibility is common (bank PO, BPO, hospitality, sales), so the engineering degree neither helps nor hurts; what helps is a domain story","For fintech and broking ops: NISM certification (Series V-A for mutual funds, Series VI, VII or VIII depending on the role) is often mandatory before joining","For bank programmes: age under 25 to 28, 60 percent in 10th and graduation, and a clean CIBIL record; some charge a training fee (HDFC Future Bankers 2.0 charges a fee before the salary starts) which you must weigh honestly","For sales engineering at product and industrial companies: ability to demo a product and explain a technical spec to a non-technical buyer; a CRM record of calls or a sales internship is the proof","For founding or joining an early startup: a registered entity or a live product with users; DPIIT recognition or Udyam MSME registration unlocks the schemes"],"two_year_plan":[{"block":"H1","title":"Pick a sector that is actually hiring freshers, and build the two tool skills","learn":["Sectors where fresher hiring grew in FY26 on Naukri: hospitality (+21%), BPO and ITES (+18%), oil and gas (+15%), insurance (positive 11 of 12 months); plus banking ops and fintech ops which run standing fresher programmes. Pick one and learn its vocabulary: for banking, KYC, CASA, NPA, cross-sell; for payments, settlement, chargebacks, merchant onboarding; for hospitality, revenue management, occupancy, RevPAR; for logistics, first-mile, SLA, fill rate","Excel to a working level in four weeks: lookups, pivots, conditional logic, a cash-flow model; then SQL basics (joins, group by, window functions) on a public dataset","Communication: one mock phone screen a week, recorded, with a friend or an AI interviewer; the goal is a clear two-minute answer to 'tell me about yourself' and a domain question","Read one fintech or SaaS company's annual report or product documentation end to end; interviews reward this more than a certificate"],"build":["A ten-row spreadsheet of target roles: company, role, sector, tool requirement, fresher-eligible yes or no, application link, date seen; refresh weekly from company career pages and walk-in notices","Version one of the small business or ops analytics project below"],"evidence":["An Excel model and a SQL notebook you can screen-share; a recorded mock screen that a working professional says is passable","At least ten applications a week, tracked; one walk-in attended if BPO or ITES is the sector"],"target":["Genpact and WNS walk-ins","ICICI Bank PO programme","PhonePe and Groww ops and customer-experience roles","Razorpay junior associate roles","Freshworks graduate trainee","Zoho fresher drives"]},{"block":"H2","title":"First role, or a founding trial with a scheme behind it","learn":["If employed: your sector's operating metrics and the tool stack (CRM such as Salesforce or Zoho CRM, ticketing, payment dashboards); learn the process you run well enough to automate part of it","Sales engineering track: shadow senior sales on ten calls, learn the product's technical spec to demo level, and write the objection-handling document yourself","Founding track: register the entity, apply for DPIIT Startup India recognition and Udyam MSME registration, and learn what they actually give (tax benefits require an inter-ministerial board approval; MSME opens priority-sector lending and government tender relaxations; state startup policies give small seed grants)","For fintech and broking ops: complete the NISM certification your employer or target role names"],"build":["One automation of a routine task in your role using an agent (report generation, lead qualification, ticket triage), documented with before-and-after time saved","Founding track: a live product with paying or actively using customers, and a one-page unit economics sheet"],"evidence":["An offer letter in the chosen sector, or a founding trial with DPIIT or Udyam registration and first customers","A documented automation your manager signed off, or a customer log for the founding trial"],"target":["Bajaj Finance trainee programmes","HDFC Bank branch and ops roles","Insurance operations at large insurers","Hospitality management trainee programmes","Startup India and Udyam portals"]},{"block":"H3","title":"Move from process to analysis, or from associate to owner of a number","learn":["Analytics: Python (pandas) on top of SQL; one dashboard tool (Power BI, Looker Studio or Metabase); statistics for A/B tests and cohort analysis","Ops: process mapping, SLA design, vendor management; the ability to write a one-page problem statement with data is what gets you to team lead","Sales engineering: forecasting, territory planning, and the technical depth to run a proof of concept without engineering support","Founding: fundraising basics only if the unit economics work; otherwise, how to run a profitable small business, which is what most MSMEs are"],"build":["A dashboard or analysis that changed a decision at work, with the decision written down","Version two of the ops analytics project with the real (anonymised) data from your role, if allowed, or a public dataset from your sector"],"evidence":["A promotion, a role change to analyst or team lead, or a documented owned metric (conversion, TAT, retention) with a before-and-after","Founding track: 12 months of accounts and a decision to continue, pivot or close, taken on numbers"],"target":["Product ops and analyst roles at Swiggy, Zomato, PhonePe, Razorpay, Groww","Bank and NBFC analytics teams","Insurance and fintech operations leadership tracks"]},{"block":"H4","title":"Specialise: product ops, revenue ops, analytics, or a second startup role","learn":["Choose one of: product operations, revenue operations, business analytics, sales engineering leadership, or a founding-team role at an early startup with your domain","Agent tooling for your function: building and supervising the agents that now do the routine parts of ops and sales (lead scoring, ticket triage, reconciliation), because managing those is the job that remains","If aiming at an MBA later: CAT preparation starts now with two years of work experience, which IIM interviews reward"],"build":["A portfolio of three work artefacts: an analysis, a process you redesigned, an automation you own; each with the business result","A network of ten people in your sector who would take your call, built through real work, not LinkedIn requests"],"evidence":["A role with a title that carries a number (analyst II, product ops lead, sales engineer), or a founding-team role with equity, or a CAT registration with a work-experience story","Pay above the entry band, with the offer letter as the proof"],"target":["Funded startups in fintech, logistics, SaaS","Banks and NBFC analytics and product teams","CAT and the higher_studies path if the MBA route is chosen"]}],"evidenced_project_spec":{"title":"Small-business operations analytics: a real shop, clinic or delivery outlet","scope":"Find one real small business near you (a pharmacy, a two-wheeler service centre, a restaurant with delivery, a coaching centre, a kirana with UPI sales) and, with the owner's permission, build them a working operations dashboard and one decision from it. Collect three months of sales, stock and customer data (from bills, UPI statements, delivery-platform exports, or a simple sheet you set up), clean it, and answer three questions the owner cares about: which items or services make the money, where cash is stuck (stock or receivables), and what one change would raise weekly profit. Deliver a dashboard the owner can refresh, a two-page plan, and a follow-up measurement four weeks later. Eight to ten weekends.","domain":"Small-business and MSME operations: retail, food delivery, services; the same skills transfer to bank ops, fintech ops, insurance and hospitality analytics","agent_use":"A coding agent builds the data-cleaning script, the SQL or pandas analysis and the dashboard (Google Sheets, Looker Studio, or Metabase). A research agent finds the sector benchmarks (typical margins, stock turns, delivery commission rates) that you compare against, and drafts the owner's plan in plain language. You do the parts agents cannot: sitting with the owner, understanding what the numbers mean in that shop, choosing the one change, and checking every figure against the actual bills. Keep the agent prompts and outputs in the repository so an interviewer can see what was yours.","done_looks_like":"A refreshed dashboard in use by the owner; a two-page plan with one implemented change; a four-week before-and-after measurement with the profit or cash impact stated honestly, even if it is small or negative; and a 10-slide case you can present in an interview for ops, analyst, sales engineering or fintech ops roles.","verification":"The owner confirms the numbers and the change in a short signed note or a recorded call. Every figure reconciles to source bills or statements. A working analyst or a faculty member reviews the method. The interview test: a 30-minute walk-through in which you can answer 'how do you know that' for every chart and 'what would you do differently' for the change."},"ai_task_shift":[{"task_2019":"Inside sales: dialling cold lists and qualifying leads by hand","now":"Agents score and qualify inbound leads, draft outreach and update the CRM; the human call is reserved for qualified prospects","human_owns":"The conversation that closes, objection handling, and reading a customer's real constraint; sales engineers who can demo and negotiate are more valuable, list-callers less"},{"task_2019":"Operations associate: reconciling transactions, updating trackers, chasing status by email","now":"Reconciliation, status chasing and routine reporting are agent workflows in fintech and bank ops","human_owns":"Exceptions, disputes, vendor and customer escalations, and designing the process the agents run; ops roles are fewer but own more"},{"task_2019":"Business analyst: writing SQL, building weekly dashboards, formatting decks","now":"Agents write the SQL and build the dashboard from a question","human_owns":"Asking the right question, sanity-checking the answer against the business, and persuading a manager to act; this is why domain knowledge now outranks tool skill"},{"task_2019":"Customer support and BPO voice and chat work","now":"Chatbots and agent-assist handle the first tier; walk-in drives now ask for judgement roles such as risk investigation and complex-query handling","human_owns":"Complex, emotional or high-value cases, fraud and risk judgement, and the languages and contexts models handle poorly"},{"task_2019":"Founder's first hires: a developer to build the MVP and an ops person to run spreadsheets","now":"A founder with agents ships an MVP and runs ops alone for the first year","human_owns":"Finding customers, selling, and deciding what to build; a founding team is now sales and domain first, code second"},{"task_2019":"Hospitality and insurance back-office: manual booking, claims data entry, document checks","now":"OCR and agents do the data entry and first-level document checks","human_owns":"Guest and claimant interaction, judgement calls on exceptions, and revenue and yield decisions; these sectors are still adding freshers for the front-line roles"}],"fallback_path_id":"it_services","employers":[{"name":"Zoho Corporation","type":"company","location":"Chennai (also Tenkasi, and other Tamil Nadu and Andhra centres)","roles":"Off-campus drives for technical support engineers, application security and software roles; B.E./B.Tech, 0 to 2 years for the security role; Zoho also hires non-engineering graduates for sales and support","fresher":true,"source_url":"https://www.freshersvoice.com/zoho-corp-off-campus-drive","seen_on":"2026-04"},{"name":"Freshworks","type":"company","location":"Chennai","roles":"Graduate Trainee, customer support: 2024 to 2026 batches, 0 to 6 months' experience, rotating shifts; a communication-first role that leads to customer success and solutions engineering","fresher":true,"source_url":"https://www.freshersnow.com/freshworks-recruitment/","seen_on":"2026-09"},{"name":"Razorpay","type":"company","location":"Bengaluru (some roles in Mumbai and Gandhinagar)","roles":"Junior Associate roles in enterprise partnerships and SME sales for 0 to 1 year candidates, plus finance executive and analyst roles; live job board","fresher":true,"source_url":"https://job-boards.greenhouse.io/razorpaysoftwareprivatelimited/jobs/4498055005","seen_on":"2026-09"},{"name":"PhonePe","type":"company","location":"Bengaluru","roles":"Customer Experience Specialist for mutual funds and operations associate (video KYC) roles; any graduate, 2026 batch eligible, NISM certification mandatory for the mutual-fund role; posted 19 August function profileLine(a) { const parts = []; if (a.branch) parts.push(LABEL['branch:' + a.branch]); if (a.college_tier) parts.push('tier-' + a.college_tier + ' college'); if (a.region) parts.push(LABEL['region:' + a.region].split(' (')[0]); if (a.relocation) parts.push(LABEL['relocation:' + a.relocation].replace(/^Only /, 'only ').replace(/^Anywhere/, 'anywhere')); return parts.join(', '); }
function explain(r, i) {
  const pos = r.hits.filter(h => h.score > 0).slice(0, 2).map(h => h.reason.replace(/\.$/, ''));
  const neg = r.hits.filter(h => h.score < 0)[0];
  let t = `${r.path.name} ranks ${['first','second','third'][i] || (i+1)+'th'}`;
  t += pos.length ? ` because ${pos.join('; and ')}.` : ` mainly on the size of its door this year.`;
  if (neg) t += ` Watch out: ${neg.reason.replace(/\.$/, '')}.`;
  const fb = PBY[r.path.fallback_path_id]; if (fb) t += ` Fallback that shares most of the preparation: ${fb.name}.`;
  return t;
}

// ---------- standing: readiness, gap, plan, job match ----------
function readiness(path, ev) {
  const sk = path.skills || []; const tot = sk.reduce((s, x) => s + x.weight, 0) || 1;
  const have = sk.filter(x => ev[x.id]).reduce((s, x) => s + x.weight, 0);
  const req = sk.filter(x => x.level === 'required'); const reqHave = req.filter(x => ev[x.id]).length;
  return { pct: Math.round(have / tot * 100), req: req.length, reqHave, total: sk.length, have: sk.filter(x => ev[x.id]).length };
}
function gapOf(path, ev) { return (path.skills || []).filter(x => !ev[x.id]).sort((a, b) => (a.level === b.level ? b.weight - a.weight : a.level === 'required' ? -1 : 1)); }
function plan(path, ev) {
  const gap = gapOf(path, ev); const sprints = [[], [], []]; const later = []; const cap = 90; const used = [0, 0, 0];
  for (const g of gap) { const s = KBY[g.id]; if (!s) continue; const h = Math.min(...s.learning.map(l => l.hours || 20)); let placed = false;
    for (let i = 0; i < 3; i++) { if (used[i] + h <= cap || sprints[i].length === 0) { sprints[i].push({ ...g, hours: h }); used[i] += h; placed = true; break; } }
    if (!placed) later.push({ ...g, hours: h }); }
  return { sprints, later, used };
}
function jobMatch(job, ev) { const m = job.requirements.filter(r => r.skill_id); const met = m.filter(r => ev[r.skill_id]); return { mapped: m.length, met: met.length, missing: m.filter(r => !ev[r.skill_id]), unmapped: job.requirements.length - m.length, pct: m.length ? Math.round(met.length / m.length * 100) : 0 }; }

      ${pubUrl ? `<div class="row"><input readonly value="${esc(pubUrl)}" style="flex:1;min-width:220px;font-family:var(--mono);font-size:13px" id="puburl"><button class="btn sm ghost" id="copy">Copy link</button><a class="btn sm" target="_blank" rel="noopener" href="https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(pubUrl)}">Share on LinkedIn</a><button class="btn sm ghost" id="draft">Copy a LinkedIn post</button></div>` : '<p class="small">Turn on public to get a link you can share on LinkedIn.</p>'}
    </div>
    <p class="cap noprint"><a href="#" id="del">Delete my account data</a></p>`;
  document.getElementById('out').addEventListener('click', e => { e.preventDefault(); signOut(); location.hash = '#/'; });
  document.getElementById('print').addEventListener('click', () => window.print());
  document.getElementById('prof').addEventListener('submit', async e => { e.preventDefault(); const f = e.target; try { await api('me', { method: 'PUT', body: { name: f.name.value, college: f.college.value, headline: f.headline.value } }); toast('Saved'); mePage(); } catch (er) { toast(er.message); } });
  app.querySelectorAll('.pick').forEach(a => a.addEventListener('click', async e => { e.preventDefault(); try { await api('me', { method: 'PUT', body: { primary_path: a.dataset.p } }); mePage(); } catch (er) { toast(er.message); } }));
  app.querySelectorAll('form.evf[data-s]').forEach(f => f.addEventListener('submit', async e => { e.preventDefault(); const b = f.querySelector('button'); b.disabled = true; try { await api('me/evidence', { method: 'PUT', body: { skill_id: f.dataset.s, evidence: { type: f.type.value, url: f.url.value.trim(), note: f.note.value.trim() } } }); toast('Evidence added'); mePage(); } catch (er) { toast(er.message); b.disabled = false; } }));
  app.querySelectorAll('.rm').forEach(a => a.addEventListener('click', async e => { e.preventDefault(); try { await api('me/evidence', { method: 'PUT', body: { skill_id: a.dataset.s, remove: true } }); mePage(); } catch (er) { toast(er.message); } }));
  const savePub = async () => { try { const j = await api('me/public', { method: 'PUT', body: { enabled: document.getElementById('pub').checked, slug: document.getElementById('slug').value.trim() } }); toast(j.public.enabled ? 'Public page on' : 'Public page off'); mePage(); } catch (er) { toast(er.message); } };
  document.getElementById('pub').addEventListener('change', savePub);
  document.getElementById('slug').addEventListener('change', () => { if (document.getElementById('pub').checked) savePub(); });
  const cp = document.getElementById('copy'); if (cp) cp.addEventListener('click', () => { navigator.clipboard.writeText(document.getElementById('puburl').value).then(() => toast('Link copied')); });
  const dr = document.getElementById('draft'); if (dr) dr.addEventListener('click', () => { const done = (primary.skills || []).filter(x => ev[x.id]).map(x => KBY[x.id].name); const next = gap.slice(0, 2).map(x => KBY[x.id].name);
    const text = `Building toward ${primary.name} in the AI era. Readiness so far: ${rd.pct}%.\n\nEvidenced: ${done.length ? done.join(', ') : 'starting this week'}.\nNext 30 days: ${next.join(' and ') || 'widening the plan'}.\n\nEvidence, not claims. My standing page: ${pubUrl}\n\n#NextRung #EngineeringGraduates #${primary.id.replace(/_/g, '')}`;
    navigator.clipboard.writeText(text).then(() => toast('Post copied. Paste it on LinkedIn.')); });
  document.getElementById('del').addEventListener('click', async e => { e.preventDefault(); if (!confirm('Delete your saved answers, evidence and public page? This cannot be undone.')) return; try { await api('me', { method: 'DELETE' }); signOut(); toast('Deleted'); location.hash = '#/'; } catch (er) { toast(er.message); } });
}

function evidence(filter) {
  setNav('evidence');

  const f = (filter || '').toLowerCase();
  const rows = g => STATS.filter(s => s.id.startsWith(g + '.') && (!f || (s.metric + ' ' + s.source_title + ' ' + s.period).toLowerCase().includes(f)));
  app.innerHTML = `<div class="eyebrow">Evidence</div><h1 style="font-size:clamp(26px,5vw,36px)">Every number on this site, with where it came from</h1>
    <p class="lead">${STATS.length} records. Confidence: <span class="pill official">official</span> government or company filings; <span class="pill industry">industry</span> NASSCOM, staffing firms, research labs; <span class="pill media">media</span> press reporting an official figure; <span class="pill low">low</span> aggregator or unverified.</p>
    <p><input id="ev-filter" placeholder="Filter, e.g. GCC, PLFS, fresher" value="${esc(filter || '')}" style="width:100%;max-width:420px"></p>
    ${groups.map(([g, t]) => { const r = rows(g); return r.length ? `<h2>${t}</h2><div class="tw"><table><thead><tr><th>Metric</th><th>Value</th><th>Period</th><th>Source</th></tr></thead><tbody>${r.map(s => `<tr><td>${esc(s.metric)}${s.contradiction ? `<br><span class="cap">Contradiction: ${esc(s.contradiction)}</span>` : ''}</td><td class="match">${fmt(s)}</td><td class="cap">${esc(s.period)}</td><td>${s.source_url ? `<a href="${esc(s.source_url)}" target="_blank" rel="noopener">${esc(s.source_title)}</a>` : '—'} <span class="pill ${s.confidence}">${s.confidence}</span></td></tr>`).join('')}</tbody></table></div>` : ''; }).join('')}`;
  const inp = document.getElementById('ev-filter'); inp.addEventListener('input', () => { const pos = inp.selectionStart; evidence(inp.value); const n = document.getElementById('ev-filter'); n.focus(); n.setSelectionRange(pos, pos); });
}

function about() {
  setNav('about');
  app.innerHTML = `<div class="eyebrow">About</div><h1 style="font-size:clamp(26px,5vw,36px)">Why NextRung exists, and how it is kept honest</h1>
  <p class="lead">India produces about 8 lakh engineering degree holders a year. The IT services door that absorbed 4 lakh of them in FY22 took 1.6 lakh in FY24 and is still shrinking, and AI agents now do the routine work that was the first rung. At least 6 lakh graduates a year need a direction that is not "join an IT services company", and a way to prove they are ready for it.</p>
  <h2>How it works</h2>
  <p>Ten questions build a profile. A rules engine, not a language model, scores nine paths: a base score for how many fresher seats the door has this year, plus fit rules written by people and shown on every path page. Each path names the skills employers screen for. Your standing is the share of those skills you have evidence for, compared against the requirements in fresher postings seen this quarter. The gap becomes a 90-day plan with free-first learning and a proof of done per skill.</p>
  <p>Four agent skills maintain the content: one refreshes the statistics from primary sources and refuses to emit a number without a URL; one maintains the path records; one maintains the skills taxonomy and learning options (every link opened before it is listed); one ingests fresher postings and maps their requirements to skills. Changes arrive as pull requests that maintainers review.</p>
  <h2>Your data</h2>
  <p>Answers stay in your browser until you sign in. With an account, your answers, ranking, evidence links and plan are stored so you can come back. Sign-in is a one-time code by email; there is no password. Your page is private unless you switch it to public, and a public page never shows your email. You can delete everything from your standing page.</p>
  <h2>What it is not</h2>
  <p>Not a job board, a course, or a guarantee. Projections are labelled projections. Where two credible sources disagree, both are shown. Where no number exists, the site says so instead of inventing one.</p>
  <h2>Contribute</h2>
  <p>The data, matcher, skills taxonomy, job mappings and this site are open source. Fix a number with a source, add an employer with a recent page, challenge a fit rule, add a learning option that is free and good, or translate a path into Hindi, Tamil, Telugu or Kannada. Placement officers, hiring managers and recent graduates are the reviewers this needs most.</p>
  <p class="cap">Version ${SITE_VERSION}, September 2026. Built to be argued with.</p>`;
}

function route() {
  const h = location.hash.replace(/^#\/?/, ''); const [r, a] = h.split('/'); window.scrollTo({ top: 0 }); setNavMe();
  if (!r) return home();
  if (r === 'quiz') return quiz(parseInt(a || '0', 10) || 0);
  if (r === 'results') return results();
  if (r === 'signin') return signin();
  if (r === 'me') return mePage();
  if (r === 'p') return publicPage(decodeURIComponent(a || ''));
  if (r === 'paths') return pathsList();
  if (r === 'path') return pathPage(a);
  if (r === 'jobs') return jobsPage('');
  if (r === 'evidence') return evidence('');
  if (r === 'about') return about();
  home();
}
window.addEventListener('hashchange', route);
route();
</script>
