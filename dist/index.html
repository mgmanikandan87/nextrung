et":["Qualcomm, NVIDIA, TI, AMD, Micron new-college-graduate postings (2026 and 2027 batches)","Design services and OSAT firms","M.Tech VLSI at an NIT or IIT via GATE as the alternative door; fallback to ev_automotive embedded roles"]}],"evidenced_project_spec":{"title":"Automotive CAN 2.0B controller IP: RTL, UVM verification and DFT","scope":"Design a CAN 2.0B controller (bit timing, arbitration, CRC, error handling, TX/RX message buffers with an AXI-lite register interface) in Verilog; write a verification plan and a UVM testbench with a CAN bus model, functional coverage and assertions; synthesise, run STA, insert scan and generate ATPG patterns; run RTL-to-GDS on SkyWater 130 nm with OpenROAD or on Cadence tools through a C2S licence. Target use case: a body-control ECU in a two-wheeler EV.","domain":"automotive","agent_use":"A coding agent drafts the register map documentation, generates the UVM skeleton, scripts regressions and produces first-pass testbench sequences from the CAN specification; the graduate writes the RTL and the assertions by hand, reviews every generated sequence against the spec, and records the cases where the agent misread the standard (for example bit-stuffing rules). A research agent is used to summarise ISO 11898-1 timing requirements, which the graduate verifies against the standard text.","done_looks_like":"RTL passes a regression of at least 200 randomised tests with 95%+ functional coverage and zero open bugs; timing closed at 100 MHz on the target library; scan coverage above 95% with ATPG patterns; DRC/LVS-clean GDS; a 10-page design document with block diagram, register map, verification plan, coverage report, timing summary and DFT summary.","verification":"Regression and coverage reports committed to the repo and reproducible with one script; an independent check by interoperating with an open-source CAN model (or a second student's implementation); a faculty or industry reviewer signs off on the verification plan; the graduate can explain for 30 minutes how arbitration is verified, one real bug the testbench caught, why scan coverage was not 100%, and what changed between RTL and post-layout timing."},"ai_task_shift":[{"task_2019":"Write testbench boilerplate, sequences and regression scripts by hand","now":"Agents generate UVM skeletons, sequences and regression scripts from a spec; verification engineers spend more time on the plan and the coverage holes","human_owns":"Verification planning, deciding what to cover, reading the spec correctly, and debugging the failures the generator cannot explain"},{"task_2019":"Hand-write RTL for standard blocks (FIFOs, arbiters, bus interfaces)","now":"Agents produce first-draft RTL for standard blocks; quality varies and must be checked against timing and area","human_owns":"Micro-architecture, power and timing trade-offs, and reviewing generated RTL for synthesisability and corner cases"},{"task_2019":"Iterate synthesis, placement and timing closure by manually tuning constraints and scripts","now":"EDA vendors ship AI-driven flow optimisation (Synopsys DSO.ai-style and Cadence Cerebrus-style tools) that explore settings automatically","human_owns":"Setting the constraints and goals, judging when a result is real versus an artefact, and signing off tape-out risk"},{"task_2019":"Read datasheets and standards and summarise them for the team","now":"Agents summarise standards in minutes, sometimes wrongly","human_owns":"Verifying the summary against the source, and the engineering judgement about what the standard means for this design"},{"task_2019":"Fab and ATMP process monitoring by reading charts on shift","now":"Anomaly detection and yield analytics flag excursions automatically","human_owns":"Root-cause analysis, process changes, equipment ownership and the shift decisions that cost real money if wrong"}],"fallback_path_id":"ev_automotive","employers":[{"name":"Tata Electronics","type":"company","location":"Dholera (fab), Jagiroad Assam (ATMP), Hosur","roles":"Early careers: graduate engineer trainee via internship and boot-camp selection; engineering, operations and digital tracks","fresher":true,"source_url":"https://www.tataelectronics.com/early-careers","seen_on":"2026-09"},{"name":"Micron Technology India","type":"company","location":"Sanand (ATMP), Hyderabad, Bengaluru","roles":"New College Grad programme; graduate engineering technician and associate engineer roles at Sanand; applications open around August","fresher":true,"source_url":"https://in.micron.com/about/careers/university-recruiting","seen_on":"2026-09"},{"name":"Qualcomm India","type":"company","location":"Bengaluru, Hyderabad, Chennai, Noida","roles":"Engineer HW and Engineer SW, 2026 batch B.E./B.Tech/M.Tech in CS, ECE, EE, VLSI","fresher":true,"source_url":"https://freshershunt.in/qualcomm-campus-hiring-2026/","seen_on":"2026-06"},{"name":"NVIDIA India","type":"company","location":"Bengaluru, Gurugram, Pune","roles":"New College Graduate roles including formal verification engineer (Verilog/SystemVerilog) and system software engineer, 2026 batch","fresher":true,"source_url":"https://offcampusjobs4u.com/nvidia-recruitment-2026-verification-india/","seen_on":"2026-06"},{"name":"Texas Instruments India","type":"company","location":"Bengaluru","roles":"Software development engineer and test/product roles for 2026 batch; campus drives at select colleges","fresher":true,"source_url":"https://offcampusjobs4u.com/texas-instruments-recruitment-2026-software-development-engineer/","seen_on":"2026-08"},{"name":"AMD India","type":"company","location":"Bengaluru, Hyderabad","roles":"Software development engineer (GPU stack) for 2024 to 2026 batches; silicon design roles listed separately on the AMD careers site","fresher":true,"source_url":"https://offcampusjobs4u.com/amd-recruitment-2026-software-engineer-bengaluru/","seen_on":"2026-09"},{"name":"Tessolve","type":"company","location":"Bengaluru, Chennai, Hyderabad","roles":"Tessolve Engineering Trainee (TET) programme for fresh BE/B.Tech EEE and ECE graduates in post-silicon validation and test","fresher":true,"source_url":"https://www.tessolve.com/careers/","seen_on":"2026-09"},{"name":"ISRO Centralised Recruitment Board (ICRB)","type":"exam","location":"ISRO centres across India","roles":"Scientist/Engineer 'SC' 2026: Electronics 99 posts, Mechanical 52, Computer Science 21; BE/B.Tech with 65% or CGPA 6.84; CBT on 19 Oct 2026","fresher":true,"source_url":"https://www.isro.gov.in/ICRB_Recruitment13.html","seen_on":"2026-08"}],"fit_rules":[{"field":"branch","value":"ECE","score":3,"reason":"ECE is the core branch for design, verification, DFT and test roles."},{"field":"branch","value":"EE","score":3,"reason":"EE graduates are hired on the same terms as ECE for VLSI and for fab equipment roles."},{"field":"branch","value":"CHEM","score":1,"reason":"Fab process and ATMP roles at Tata Electronics, Micron and CG Semi take Chemical and Materials graduates."},{"field":"branch","value":"CIVIL","score":-3,"reason":"There is no realistic entry for Civil graduates in this path."},{"field":"branch","value":"IT","score":-2,"reason":"Only software roles at chip companies are open, and those compete with CS graduates; chip design needs an ECE/EE base."},{"field":"college_tier","value":"1","score":2,"reason":"The high-paying design houses run campus drives at IITs, NITs and IIITs and prefer M.Tech VLSI from them."},{"field":"college_tier","value":"3","score":-2,"reason":"Design houses rarely visit tier-3 colleges; the realistic entry is design services, test, or fab/ATMP operations, or M.Tech via GATE."},{"field":"region","value":"south","score":1,"reason":"Bengaluru and Hyderabad hold most design and verification jobs."},{"field":"region","value":"west","score":1,"reason":"Gujarat (Dholera fab, Sanand ATMP and OSATs) is where the new manufacturing jobs are."},{"field":"region","value":"east_ne","score":1,"reason":"Tata's Jagiroad ATMP in Assam is the first large semiconductor employer in the North-East."},{"field":"relocation","value":"anywhere_india","score":1,"reason":"Jobs are in Bengaluru, Hyderabad, Sanand, Dholera and Jagiroad; you need to be able to move."},{"field":"relocation","value":"hometown_only","score":-3,"reason":"Unless home is Bengaluru, Hyderabad or near Sanand, there are almost no semiconductor jobs near home."},{"field":"runway_months","value":"0_3","score":-2,"reason":"Design and verification roles take 12 to 24 months of preparation for a tier-2/3 graduate; fab/ATMP trainee roles are faster but shift-based."},{"field":"runway_months","value":"12_plus","score":1,"reason":"A year of runway allows the project work or GATE attempt this path needs."},{"field":"interests","value":"hardware_electronics","score":3,"reason":"This path is circuits and chips every day."},{"field":"interests","value":"people_business","score":-2,"reason":"Entry-level semiconductor work is deep technical work with little customer contact."},{"field":"priority","value":"income_now","score":-2,"reason":"Slow entry and a 4 to 6 lakh starting band for most; only a few reach the 16 to 30 band."},{"field":"preparation","value":"core_tools","score":3,"reason":"Verilog/VHDL and EDA tool experience is exactly what screeners look for."},{"field":"preparation","value":"gate_prep","score":2,"reason":"GATE ECE opens M.Tech VLSI, ISRO and PSU routes, which are the main tier-2/3 entries to design roles."},{"field":"enjoyed","value":"labs_hardware","score":2,"reason":"If you enjoyed labs and hardware, the daily work here will suit you."}],"base_score":5,"stat_ids_used":["paths.semiconductor.direct_jobs_govt_statement.2026","paths.semiconductor.units_approved_in_production.2026","paths.semiconductor.engineers_trained_c2s.2026","paths.semiconductor.jobs_projection_nlb.2024","paths.semiconductor.fresher_ctc_bands.2026","supply.aicte.branch_enrolment.ece.2024_25"],"last_reviewed":"2026-09-21","changed_fields":["all"]},{"id":"startups_and_non_engineering","name":"Startups and non-engineering roles","tagline":"Growing overall, but the entry-level share is falling; non-IT sectors are where freshers get in","door_state":"growing","door_size":{"people_per_year":180000,"stat_ids":["paths.startups.dpiit_recognised.fy26","paths.startups.entry_level_share.2026","paths.non_eng.naukri_sector_growth.fy26","demand.naukri.jobspeak.fresher_yoy.aug2026","demand.foundit.entry_level_yoy.aug2026"],"caveat":"Derived: 4.99 lakh direct jobs self-reported by DPIIT-recognised startups in FY26 times the 36 percent entry-level share of startup hiring; self-reported, includes non-engineering roles, and the entry-level share fell from 41 percent. Non-IT fresher hiring outside startups (hospitality +21%, BPO/ITES +18%, oil and gas +15% in FY26 on Naukri) is not in this number. Trackers disagree on the trend: Naukri shows freshers +15% in August 2026, foundit shows entry-level -9%."},"pay_band":{"low_lpa":3,"high_lpa":8,"stat_ids":["paths.non_eng.fresher_ctc_bands.2026","demand.fresher_ctc.bands.2026"],"note":"Inside sales 3 to 5 and ops analyst 3.5 to 5.5 are the common bands; product and engineering roles at funded startups pay 8 to 15 and AI/ML roles 18 to 25 for a very small number. Bank PO and BPO associate roles sit at the low end, and some bank trainee programmes charge a fee before paying."},"branches":{"CS":2,"IT":2,"ECE":2,"EE":2,"MECH":2,"CIVIL":1,"CHEM":1,"OTHER":2},"tiers_realistic":{"tier1":"Yes; funded startups, fintech product roles and IIM-style programme-manager roles recruit from tier-1 campuses. The trap is chasing a founding role or a high-pay startup offer that disappears in a funding downturn.","tier2":"Yes. Sales engineering, operations, analytics and fintech ops roles hire on a work sample and a conversation, not a brand. The substitute for brand is an Excel or SQL analysis you can walk through, a communication test you pass, and a domain you can talk about (payments, lending, logistics, hospitality).","tier3":"Yes, and this is the widest door for tier-3 graduates right now: bank PO programmes, BPO and ITES associate walk-ins, insurance and fintech operations, hospitality trainee programmes. Honest caveat: much of it is contract or rotating-shift work at 3 to 4 LPA with a fee-paying training programme in some banks. Treat the first role as a domain entry, and move within 18 months."},"entry_requirements":["Excel at a working level (lookups, pivots, basic modelling) and, for analytics and ops roles, SQL; these appear on nearly every ops, analyst and fintech-ops posting","Spoken and written English at a level that passes a 10-minute phone screen; sales, customer success, BPO and bank roles test this first","Any-graduate eligibility is common (bank PO, BPO, hospitality, sales), so the engineering degree neither helps nor hurts; what helps is a domain story","For fintech and broking ops: NISM certification (Series V-A for mutual funds, Series VI, VII or VIII depending on the role) is often mandatory before joining","For bank programmes: age under 25 to 28, 60 percent in 10th and graduation, and a clean CIBIL record; some charge a training fee (HDFC Future Bankers 2.0 charges a fee before the salary starts) which you must weigh honestly","For sales engineering at product and industrial companies: ability to demo a product and explain a technical spec to a non-technical buyer; a CRM record of calls or a sales internship is the proof","For founding or joining an early startup: a registered entity or a live product with users; DPIIT recognition or Udyam MSME registration unlocks the schemes"],"two_year_plan":[{"block":"H1","title":"Pick a sector that is actually hiring freshers, and build the two tool skills","learn":["Sectors where fresher hiring grew in FY26 on Naukri: hospitality (+21%), BPO and ITES (+18%), oil and gas (+15%), insurance (positive 11 of 12 months); plus banking ops and fintech ops which run standing fresher programmes. Pick one and learn its vocabulary: for banking, KYC, CASA, NPA, cross-sell; for payments, settlement, chargebacks, merchant onboarding; for hospitality, revenue management, occupancy, RevPAR; for logistics, first-mile, SLA, fill rate","Excel to a working level in four weeks: lookups, pivots, conditional logic, a cash-flow model; then SQL basics (joins, group by, window functions) on a public dataset","Communication: one mock phone screen a week, recorded, with a friend or an AI interviewer; the goal is a clear two-minute answer to 'tell me about yourself' and a domain question","Read one fintech or SaaS company's annual report or product documentation end to end; interviews reward this more than a certificate"],"build":["A ten-row spreadsheet of target roles: company, role, sector, tool requirement, fresher-eligible yes or no, application link, date seen; refresh weekly from company career pages and walk-in notices","Version one of the small business or ops analytics project below"],"evidence":["An Excel model and a SQL notebook you can screen-share; a recorded mock screen that a working professional says is passable","At least ten applications a week, tracked; one walk-in attended if BPO or ITES is the sector"],"target":["Genpact and WNS walk-ins","ICICI Bank PO programme","PhonePe and Groww ops and customer-experience roles","Razorpay junior associate roles","Freshworks graduate trainee","Zoho fresher drives"]},{"block":"H2","title":"First role, or a founding trial with a scheme behind it","learn":["If employed: your sector's operating metrics and the tool stack (CRM such as Salesforce or Zoho CRM, ticketing, payment dashboards); learn the process you run well enough to automate part of it","Sales engineering track: shadow senior sales on ten calls, learn the product's technical spec to demo level, and write the objection-handling document yourself","Founding track: register the entity, apply for DPIIT Startup India recognition and Udyam MSME registration, and learn what they actually give (tax benefits require an inter-ministerial board approval; MSME opens priority-sector lending and government tender relaxations; state startup policies give small seed grants)","For fintech and broking ops: complete the NISM certification your employer or target role names"],"build":["One automation of a routine task in your role using an agent (report generation, lead qualification, ticket triage), documented with before-and-after time saved","Founding track: a live product with paying or actively using customers, and a one-page unit economics sheet"],"evidence":["An offer letter in the chosen sector, or a founding trial with DPIIT or Udyam registration and first customers","A documented automation your manager signed off, or a customer log for the founding trial"],"target":["Bajaj Finance trainee programmes","HDFC Bank branch and ops roles","Insurance operations at large insurers","Hospitality management trainee programmes","Startup India and Udyam portals"]},{"block":"H3","title":"Move from process to analysis, or from associate to owner of a number","learn":["Analytics: Python (pandas) on top of SQL; one dashboard tool (Power BI, Looker Studio or Metabase); statistics for A/B tests and cohort analysis","Ops: process mapping, SLA design, vendor management; the ability to write a one-page problem statement with data is what gets you to team lead","Sales engineering: forecasting, territory planning, and the technical depth to run a proof of concept without engineering support","Founding: fundraising basics only if the unit economics work; otherwise, how to run a profitable small business, which is what most MSMEs are"],"build":["A dashboard or analysis that changed a decision at work, with the decision written down","Version two of the ops analytics project with the real (anonymised) data from your role, if allowed, or a public dataset from your sector"],"evidence":["A promotion, a role change to analyst or team lead, or a documented owned metric (conversion, TAT, retention) with a before-and-after","Founding track: 12 months of accounts and a decision to continue, pivot or close, taken on numbers"],"target":["Product ops and analyst roles at Swiggy, Zomato, PhonePe, Razorpay, Groww","Bank and NBFC analytics teams","Insurance and fintech operations leadership tracks"]},{"block":"H4","title":"Specialise: product ops, revenue ops, analytics, or a second startup role","learn":["Choose one of: product operations, revenue operations, business analytics, sales engineering leadership, or a founding-team role at an early startup with your domain","Agent tooling for your function: building and supervising the agents that now do the routine parts of ops and sales (lead scoring, ticket triage, reconciliation), because managing those is the job that remains","If aiming at an MBA later: CAT preparation starts now with two years of work experience, which IIM interviews reward"],"build":["A portfolio of three work artefacts: an analysis, a process you redesigned, an automation you own; each with the business result","A network of ten people in your sector who would take your call, built through real work, not LinkedIn requests"],"evidence":["A role with a title that carries a number (analyst II, product ops lead, sales engineer), or a founding-team role with equity, or a CAT registration with a work-experience story","Pay above the entry band, with the offer letter as the proof"],"target":["Funded startups in fintech, logistics, SaaS","Banks and NBFC analytics and product teams","CAT and the higher_studies path if the MBA route is chosen"]}],"evidenced_project_spec":{"title":"Small-business operations analytics: a real shop, clinic or delivery outlet","scope":"Find one real small business near you (a pharmacy, a two-wheeler service centre, a restaurant with delivery, a coaching centre, a kirana with UPI sales) and, with the owner's permission, build them a working operations dashboard and one decision from it. Collect three months of sales, stock and customer data (from bills, UPI statements, delivery-platform exports, or a simple sheet you set up), clean it, and answer three questions the owner cares about: which items or services make the money, where cash is stuck (stock or receivables), and what one change would raise weekly profit. Deliver a dashboard the owner can refresh, a two-page plan, and a follow-up measurement four weeks later. Eight to ten weekends.","domain":"Small-business and MSME operations: retail, food delivery, services; the same skills transfer to bank ops, fintech ops, insurance and hospitality analytics","agent_use":"A coding agent builds the data-cleaning script, the SQL or pandas analysis and the dashboard (Google Sheets, Looker Studio, or Metabase). A research agent finds the sector benchmarks (typical margins, stock turns, delivery commission rates) that you compare against, and drafts the owner's plan in plain language. You do the parts agents cannot: sitting with the owner, understanding what the numbers mean in that shop, choosing the one change, and checking every figure against the actual bills. Keep the agent prompts and outputs in the repository so an interviewer can see what was yours.","done_looks_like":"A refreshed dashboard in use by the owner; a two-page plan with one implemented change; a four-week before-and-after measurement with the profit or cash impact stated honestly, even if it is small or negative; and a 10-slide case you can present in an interview for ops, analyst, sales engineering or fintech ops roles.","verification":"The owner confirms the numbers and the change in a short signed note or a recorded call. Every figure reconciles to source bills or statements. A working analyst or a faculty member reviews the method. The interview test: a 30-minute walk-through in which you can answer 'how do you know that' for every chart and 'what would you do differently' for the change."},"ai_task_shift":[{"task_2019":"Inside sales: dialling cold lists and qualifying leads by hand","now":"Agents score and qualify inbound leads, draft outreach and update the CRM; the human call is reserved for qualified prospects","human_owns":"The conversation that closes, objection handling, and reading a customer's real constraint; sales engineers who can demo and negotiate are more valuable, list-callers less"},{"task_2019":"Operations associate: reconciling transactions, updating trackers, chasing status by email","now":"Reconciliation, status chasing and routine reporting are agent workflows in fintech and bank ops","human_owns":"Exceptions, disputes, vendor and customer escalations, and designing the process the agents run; ops roles are fewer but own more"},{"task_2019":"Business analyst: writing SQL, building weekly dashboards, formatting decks","now":"Agents write the SQL and build the dashboard from a question","human_owns":"Asking the right question, sanity-checking the answer against the business, and persuading a manager to act; this is why domain knowledge now outranks tool skill"},{"task_2019":"Customer support and BPO voice and chat work","now":"Chatbots and agent-assist handle the first tier; walk-in drives now ask for judgement roles such as risk investigation and complex-query handling","human_owns":"Complex, emotional or high-value cases, fraud and risk judgement, and the languages and contexts models handle poorly"},{"task_2019":"Founder's first hires: a developer to build the MVP and an ops person to run spreadsheets","now":"A founder with agents ships an MVP and runs ops alone for the first year","human_owns":"Finding customers, selling, and deciding what to build; a founding team is now sales and domain first, code second"},{"task_2019":"Hospitality and insurance back-office: manual booking, claims data entry, document checks","now":"OCR and agents do the data entry and first-level document checks","human_owns":"Guest and claimant interaction, judgement calls on exceptions, and revenue and yield decisions; these sectors are still adding freshers for the front-line roles"}],"fallback_path_id":"it_services","employers":[{"name":"Zoho Corporation","type":"company","location":"Chennai (also Tenkasi, and other Tamil Nadu and Andhra centres)","roles":"Off-campus drives for technical support engineers, application security and software roles; B.E./B.Tech, 0 to 2 years for the security role; Zoho also hires non-engineering graduates for sales and support","fresher":true,"source_url":"https://www.freshersvoice.com/zoho-corp-off-campus-drive","seen_on":"2026-04"},{"name":"Freshworks","type":"company","location":"Chennai","roles":"Graduate Trainee, customer support: 2024 to 2026 batches, 0 to 6 months' experience, rotating shifts; a communication-first role that leads to customer success and solutions engineering","fresher":true,"source_url":"https://www.freshersnow.com/freshworks-recruitment/","seen_on":"2026-09"},{"name":"Razorpay","type":"company","location":"Bengaluru (some roles in Mumbai and Gandhinagar)","roles":"Junior Associate roles in enterprise partnerships and SME sales for 0 to 1 year candidates, plus finance executive and analyst roles; live job board","fresher":true,"source_url":"https://job-boards.greenhouse.io/razorpaysoftwareprivatelimited/jobs/4498055005","seen_on":"2026-09"},{"name":"PhonePe","type":"company","location":"Bengaluru","roles":"Customer Experience Specialist for mutual funds and operations associate (video KYC) roles; any graduate, 2026 batch eligible, NISM certification mandatory for the mutual-fund role; posted 19 August 2026","fresher":true,"source_url":"https://job4freshers.co.in/phonepe-customer-experience-specialist/","seen_on":"2026-08"},{"name":"Groww","type":"company","location":"Bengaluru and remote across India","roles":"Research Associate (social media and finance content), 0 to 3 years, any graduate with finance interest; Groww also runs operations and customer-support fresher intakes","fresher":true,"source_url":"https://www.freshersnow.com/groww-off-campus/","seen_on":"2026-09"},{"name":"ICICI Bank Probationary Officer Programme","type":"scheme","location":"Across India; must be locationally mobile","roles":"PO programme for relationship-manager roles: graduates and engineers with 60 percent in 10th and graduation, under 25, 0 to 2 years; training stipend then a branch posting; posted 16 August 2026","fresher":true,"source_url":"https://www.freshersvoice.com/icici-bank-recruitment","seen_on":"2026-08"},{"name":"HDFC Bank Future Bankers Programme 2.0 (with Manipal Academy of BFSI)","type":"scheme","location":"Training in Bengaluru; posting to any HDFC Bank branch in India","roles":"12-month fee-paying programme (classroom, internship with stipend, on-the-job training) leading to Deputy Manager, Personal Banker; any graduate, 21 to 28; weigh the programme fee against the offered CTC before joining; posted 18 March 2026","fresher":true,"source_url":"https://www.freshersvoice.com/hdfc-bank-recruitment","seen_on":"2026-03"},{"name":"Bajaj Finance (Bajaj Finserv group)","type":"company","location":"Pune and Bengaluru (hybrid); branches across India for sales and ops","roles":"Trainee (Tech) for 2023 to 2026 batch B.E./B.Tech, MCA and B.Sc graduates, 0 to 1 year; campus programmes EON and BYTE for management and technology campuses; sales, ops and analytics trainee tracks; posted 26 June 2026, updated 9 August 2026","fresher":true,"source_url":"https://cloudsoftsol.com/blog/bajaj-finserv-trainee-tech-fresher-pune-2026/","seen_on":"2026-08"},{"name":"Genpact","type":"company","location":"Kolkata (this drive); Noida, Hyderabad, Bengaluru, Jaipur, Gurugram for others","roles":"Walk-in for Transaction Risk Investigator (non-voice), any degree except law, freshers only, 3 to 6 month contract to start; walk-in 11 September 2026; regular process-associate drives in other cities","fresher":true,"source_url":"https://www.freshersvoice.com/genpact-walk-in-drive","seen_on":"2026-09"},{"name":"WNS (part of Capgemini)","type":"company","location":"Nashik (this drive); Pune, Mumbai, Chennai, Bengaluru, Gurugram, Visakhapatnam for others","roles":"Associate, Operations: bachelor's degree, 0 to 2 years, typing 25 wpm, round-the-clock operations; walk-in 18 September to 30 October 2026; posted 19 September 2026","fresher":true,"source_url":"https://www.freshersvoice.com/wns-walk-in-drive","seen_on":"2026-09"}],"fit_rules":[{"field":"interests","value":"people_business","score":3,"reason":"Sales, operations, customer roles and founding are built around people and business, not code or circuits."},{"field":"priority","value":"income_now","score":2,"reason":"Bank PO programmes, BPO walk-ins, fintech ops and sales roles hire in weeks, not exam cycles; the pay is modest but immediate."},{"field":"enjoyed","value":"organising_people","score":3,"reason":"Running events and clubs is the closest college experience to operations, sales and founding work."},{"field":"interests","value":"data_numbers","score":2,"reason":"Ops analytics, fintech ops and business analyst roles are where Excel and SQL skills get freshers hired now."},{"field":"runway_months","value":"0_3","score":1,"reason":"This path has the fastest time to first salary of all nine; walk-ins and PO programmes start within a month or two."},{"field":"priority","value":"high_pay_growth","score":1,"reason":"Founding and funded-startup roles have the highest upside, though most roles here start at 3 to 5 LPA."},{"field":"priority","value":"stability","score":-2,"reason":"Startups fail, contracts end, and BPO and sales roles have high churn; this is not a stable path."},{"field":"priority","value":"abroad","score":-1,"reason":"These are Indian domestic roles; abroad comes later, if at all, through an MBA or a global company."},{"field":"interests","value":"research_theory","score":-2,"reason":"Very little of this path is deep study; it rewards action and conversation."},{"field":"interests","value":"hardware_electronics","score":-1,"reason":"Non-engineering roles do not use electronics skills; sales engineering at an electronics firm is the one exception."},{"field":"enjoyed","value":"exams_theory","score":-1,"reason":"Entry here is by interview, work sample and phone screen, not by exam; exam strength does not transfer."},{"field":"college_tier","value":"3","score":1,"reason":"This is the widest door for tier-3 graduates: any-graduate eligibility, walk-ins, and programmes that hire on communication and a work sample."},{"field":"relocation","value":"anywhere_india","score":1,"reason":"Fintech and startup ops are concentrated in Bengaluru, Chennai, Pune, Mumbai and NCR; bank and BPO roles are everywhere."},{"field":"relocation","value":"hometown_only","score":0,"reason":"Bank branches, insurance, BPO centres in tier-2 cities and founding a local business all work near home; startup product roles do not."},{"field":"preparation","value":"internship_done","score":2,"reason":"An internship is the strongest signal for ops, sales and analyst roles, which hire on demonstrated work."},{"field":"preparation","value":"none","score":0,"reason":"You can start here with four weeks of Excel and communication practice; no long preparation is required, but the pay reflects that."},{"field":"graduation_year","value":"graduated","score":1,"reason":"Walk-ins, PO programmes and off-campus drives are open now and favour candidates who can join immediately."},{"field":"branch","value":"OTHER","score":1,"reason":"Any-graduate roles do not care about branch; a non-core branch loses nothing here."}],"base_score":6,"stat_ids_used":["paths.startups.dpiit_recognised.fy26","paths.startups.entry_level_share.2026","paths.non_eng.naukri_sector_growth.fy26","demand.naukri.jobspeak.fresher_yoy.aug2026","demand.foundit.entry_level_yoy.aug2026","paths.non_eng.fresher_ctc_bands.2026","demand.fresher_ctc.bands.2026"],"last_reviewed":"2026-09-21","changed_fields":["all"]}],"questions":{"version":"0.1.0","note":"Ten profile questions. Each maps to one profile field; fit_rules in paths.json reference field + value. Values are stable ids; labels are what the graduate sees.","questions":[{"id":"q1","field":"branch","type":"single","prompt":"Which branch are you in (or did you graduate from)?","options":[{"value":"CS","label":"Computer Science / AI / Data Science"},{"value":"IT","label":"Information Technology"},{"value":"ECE","label":"Electronics and Communication"},{"value":"EE","label":"Electrical / Electrical and Electronics"},{"value":"MECH","label":"Mechanical / Automobile / Mechatronics"},{"value":"CIVIL","label":"Civil"},{"value":"CHEM","label":"Chemical / Biotech / Metallurgy"},{"value":"OTHER","label":"Other branch"}],"discriminates":["semiconductor_electronics","ev_automotive","infrastructure_energy","ai_native_software"]},{"id":"q2","field":"college_tier","type":"single","prompt":"How would you describe your college?","options":[{"value":"1","label":"IIT, NIT, IIIT, BITS or a top state university (NIRF top 50)"},{"value":"2","label":"Well-known state or private college; companies visit campus every year (NIRF roughly 50 to 200)"},{"value":"3","label":"Any other college; few or no companies visit campus"}],"discriminates":["ai_native_software","it_services","higher_studies"]},{"id":"q3","field":"graduation_year","type":"single","prompt":"When do you graduate (or when did you)?","options":[{"value":"graduated","label":"Already graduated"},{"value":"2026","label":"2026"},{"value":"2027","label":"2027"},{"value":"2028_or_later","label":"2028 or later"}],"discriminates":["government_psu","higher_studies","it_services"]},{"id":"q4","field":"region","type":"single","prompt":"Which region is home?","options":[{"value":"south","label":"South (Karnataka, Tamil Nadu, Telangana, Andhra, Kerala)"},{"value":"west","label":"West (Maharashtra, Gujarat, Goa)"},{"value":"north","label":"North (Delhi NCR, UP, Punjab, Haryana, Rajasthan, Uttarakhand, HP, J&K)"},{"value":"east_ne","label":"East and North-East (WB, Odisha, Bihar, Jha <script>
const D = JSON.parse(document.getElementById('data').textContent);
const PATHS = D.paths, QS = D.questions.questions, STATS = D.stats;
const SBY = Object.fromEntries(STATS.map(s => [s.id, s]));
const PBY = Object.fromEntries(PATHS.map(p => [p.id, p]));
const LABEL = {}; QS.forEach(q => q.options.forEach(o => LABEL[q.field + ':' + o.value] = o.label));
document.getElementById('asof').textContent = (STATS[0] && STATS[0].as_of) || '';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const inr = n => { if (n == null) return '—'; const a = Math.abs(n); if (a >= 1e7) return (n/1e7).toFixed(a >= 1e9 ? 0 : 2).replace(/\.00$/,'') + ' crore'; if (a >= 1e5) return (n/1e5).toFixed(a >= 1e6 ? 1 : 2).replace(/\.?0+$/,'') + ' lakh'; return n.toLocaleString('en-IN'); };
const fmt = s => { if (s.value == null) return '—'; if (s.unit === 'ratio') return (s.value*100).toFixed(Math.abs(s.value) < 0.1 ? 1 : 0) + '%'; if (s.unit === 'INR') return '₹' + inr(s.value); if (s.unit === 'INR per year' || s.unit === 'INR per month') return '₹' + s.value.toLocaleString('en-IN'); if (s.unit === 'people' || s.unit === 'seats' || s.unit === 'students' || s.unit === 'openings') return inr(s.value); return s.value.toLocaleString('en-IN'); };
const statLink = id => { const s = SBY[id]; if (!s) return ''; return `<a href="${esc(s.source_url||'#')}" target="_blank" rel="noopener">${esc(s.source_title||id)}</a> <span class="cap">(${esc(s.period)}) <span class="pill ${s.confidence}">${s.confidence}</span></span>`; };

// ---------- state ----------
let answers = {};
try { answers = JSON.parse(localStorage.getItem('disha.answers') || '{}') || {}; } catch (e) { answers = {}; }
const save = () => { try { localStorage.setItem('disha.answers', JSON.stringify(answers)); } catch (e) {} };

// ---------- matcher ----------
function score(path, a) {
  const hits = [];
  for (const r of path.fit_rules) {
    const v = a[r.field]; if (v == null) continue;
    const matched = Array.isArray(v) ? v.includes(r.value) : String(v) === String(r.value);
    if (matched) hits.push(r);
  }
  const total = path.base_score + hits.reduce((s, r) => s + r.score, 0);
  return { path, total, hits: hits.sort((x, y) => y.score - x.score) };
}
function rank(a) { return PATHS.map(p => score(p, a)).sort((x, y) => y.total - x.total); }
function profileLine(a) {
  const parts = [];
  if (a.branch) parts.push(LABEL['branch:' + a.branch]);
  if (a.college_tier) parts.push('tier-' + a.college_tier + ' college');
  if (a.region) parts.push(LABEL['region:' + a.region].split(' (')[0]);
  if (a.relocation) parts.push(LABEL['relocation:' + a.relocation].toLowerCase());
  return parts.join(', ');
}
function explain(r, i) {
  const pos = r.hits.filter(h => h.score > 0).slice(0, 2).map(h => h.reason.replace(/\.$/, ''));
  const neg = r.hits.filter(h => h.score < 0)[0];
  let t = `${r.path.name} ranks ${['first','second','third'][i]}`;
  t += pos.length ? ` because ${pos.join('; and ')}.` : ` mainly on the size of its door this year.`;
  if (neg) t += ` Watch out: ${neg.reason.replace(/\.$/, '')}.`;
  const fb = PBY[r.path.fallback_path_id]; if (fb) t += ` Fallback that shares most of the preparation: ${fb.name}.`;
  return t;
}

// ---------- views ----------

function quiz(step) {
  setNav('quiz');
  step = Math.max(0, Math.min(QS.length - 1, step || 0));
  const q = QS[step];
  const cur = answers[q.field];
  const sel = v => q.type === 'multi' ? (Array.isArray(cur) && cur.includes(v)) : String(cur) === String(v);
  app.innerHTML = `<div class="q">
    <div class="eyebrow">Question ${step + 1} of ${QS.length}</div>
    <div class="prog"><i style="width:${((step) / QS.length * 100).toFixed(0)}%"></i></div>
    <h2 style="margin-top:0">${esc(q.prompt)}</h2>
    ${q.type === 'multi' ? `<p class="cap">Pick up to ${q.max}.</p>` : ''}
    <div class="opts">${q.options.map(o => `<button class="opt ${q.type} ${sel(o.value) ? 'sel' : ''}" data-v="${esc(o.value)}" id="opt-${q.id}-${esc(o.value)}"><span class="k"></span><span>${esc(o.label)}</span></button>`).join('')}</div>
    <div class="row" style="margin-top:18px">
      ${step > 0 ? `<a class="btn ghost" href="#/quiz/${step - 1}">Back</a>` : ''}
      <a class="btn" id="next" href="#/quiz/${step + 1}">${step === QS.length - 1 ? 'Show my directions' : 'Next'}</a>
    </div></div>`;
  const next = document.getElementById('next');
  if (step === QS.length - 1) next.href = '#/results';
  const refresh = () => { const ok = q.type === 'multi' ? (Array.isArray(answers[q.field]) && answers[q.field].length > 0) : answers[q.field] != null; next.style.opacity = ok ? 1 : .45; next.style.pointerEvents = ok ? 'auto' : 'none'; };
  refresh();
  app.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => {
    const v = b.dataset.v;
    if (q.type === 'multi') {
      let arr = Array.isArray(answers[q.field]) ? [...answers[q.field]] : [];
      if (v === 'none') arr = arr.includes('none') ? [] : ['none'];
      else { arr = arr.filter(x => x !== 'none'); arr = arr.includes(v) ? arr.filter(x => x !== v) : [...arr, v].slice(-q.max); }
      answers[q.field] = arr;
      app.querySelectorAll('.opt').forEach(x => x.classList.toggle('sel', arr.includes(x.dataset.v)));
    } else {
      answers[q.field] = v;
      app.querySelectorAll('.opt').forEach(x => x.classList.toggle('sel', x.dataset.v === v));
      save(); refresh();
      setTimeout(() => { location.hash = next.getAttribute('href'); }, 180);
      return;
    }
    save(); refresh();
  }));
}

function evidence(filter) {
  setNav('evidence');
  const groups = [['supply','Supply: how many engineers India produces'],['demand','Demand: entry-level tech hiring'],['paths','Paths: the other doors'],['gap','Gaps: numbers we could not source']];
  const f = (filter || '').toLowerCase();
  const rows = g => STATS.filter(s => s.id.startsWith(g + '.') && (!f || (s.metric + ' ' + s.source_title + ' ' + s.period).toLowerCase().includes(f)));
  app.innerHTML = `<div class="eyebrow">Evidence</div><h1 style="font-size:clamp(26px,5vw,36px)">Every number on this site, with where it came from</h1>
    <p class="lead">${STATS.length} records. Confidence: <span class="pill official">official</span> government or company filings; <span class="pill industry">industry</span> NASSCOM, staffing firms, research labs; <span class="pill media">media</span> press reporting an official figure; <span class="pill low">low</span> aggregator or unverified.</p>
    <p><input id="ev-filter" placeholder="Filter, e.g. GCC, PLFS, fresher" value="${esc(filter || '')}" style="width:100%;max-width:420px"></p>
    ${groups.map(([g, t]) => { const r = rows(g); return r.length ? `<h2>${t}</h2><div class="tw"><table><thead><tr><th>Metric</th><th>Value</th><th>Period</th><th>Source</th></tr></thead><tbody>${r.map(s => `<tr><td>${esc(s.metric)}${s.contradiction ? `<br><span class="cap">Contradiction: ${esc(s.contradiction)}</span>` : ''}</td><td class="val" style="font-family:var(--mono);white-space:nowrap">${fmt(s)}</td><td class="cap">${esc(s.period)}</td><td>${s.source_url ? `<a href="${esc(s.source_url)}" target="_blank" rel="noopener">${esc(s.source_title)}</a>` : '—'} <span class="pill ${s.confidence}">${s.confidence}</span></td></tr>`).join('')}</tbody></table></div>` : ''; }).join('')}`;
  const inp = document.getElementById('ev-filter');
  inp.addEventListener('input', () => { const pos = inp.selectionStart; evidence(inp.value); const n = document.getElementById('ev-filter'); n.focus(); n.setSelectionRange(pos, pos); });
}

function about() {
  setNav('about');
  app.innerHTML = `<div class="eyebrow">About</div><h1 style="font-size:clamp(26px,5vw,36px)">Why this exists, and how it is kept honest</h1>
  <p class="lead">India produces about 8 lakh engineering degree holders a year. The IT services door that absorbed 4 lakh of them in FY22 took 1.6 lakh in FY24 and is still shrinking, and AI agents now do the routine work that was the first rung. At least 6 lakh graduates a year need a direction that is not "join an IT services company".</p>
  <h2>How it works</h2>
  <p>Ten questions build a profile. A rules engine, not a language model, scores nine paths: a base score for how many fresher seats the door has this year, plus fit rules written by people and shown on every path page. The top three come with the rules that fired, so every ranking can be argued with.</p>
  <p>Three agent skills maintain the content: one refreshes the statistics quarterly from primary sources and refuses to emit a number without a URL; one maintains the path records (door size, pay, plan, project, employers, fit rules); one writes the graduate-facing text in plain English. Changes arrive as pull requests that maintainers review.</p>
  <h2>What it is not</h2>
  <p>It is not a job board, a course, or a guarantee. Projections from staffing firms are labelled as projections. Where two credible sources disagree, both are shown. Where no number exists, the site says so instead of inventing one.</p>
  <h2>Contribute</h2>
  <p>The data (<code>market_stats.json</code>, <code>paths.json</code>, <code>questions.json</code>), the matcher and this page are open source. Fix a number with a source, add an employer with a recent hiring page, write a path in Hindi or Tamil, or challenge a fit rule. Placement officers, hiring managers and recent graduates are the reviewers this needs most.</p>
  <p class="cap">Version 0.1, September 2026. Built to be argued with.</p>`;
}

function route() {
  const h = location.hash.replace(/^#\/?/, '');
  const [r, a, b] = h.split('/');
  window.scrollTo({ top: 0 });
  if (!r) return home();
  if (r === 'quiz') return quiz(parseInt(a || '0', 10) || 0);
  if (r === 'results') return results();
  if (r === 'paths') return pathsList();
  if (r === 'path') return pathPage(a);
  if (r === 'evidence') return evidence('');
  if (r === 'about') return about();
  home();
}
window.addEventListener('hashchange', route);
route();
</script>
