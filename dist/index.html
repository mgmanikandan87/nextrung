,{"field":"interests","value":"physical_systems","score":1,"reason":"PSU and government engineering work is plants, grids, roads, railways and refineries."},{"field":"enjoyed","value":"coding_projects","score":-1,"reason":"Very little of the entry exam or the day job is coding; graduates who loved building software tend to leave PSUs within a few years."}],"base_score":3,"stat_ids_used":["paths.govt.upsc_ese_posts.2026","paths.govt.ssc_je_posts.2025","paths.govt.psu_via_gate_examples.2026","paths.govt.gate_appeared.2025","paths.infra.fresher_ctc_bands.2026","paths.skilling.nats_graduate_stipend.2026"],"last_reviewed":"2026-09-21","changed_fields":["all"]},{"id":"higher_studies","name":"Higher studies: M.Tech, MS abroad, MBA","tagline":"Doors are shifting: US narrowing (61% F-1 refusals), Germany and IIT/IISc growing","door_state":"steady","door_size":{"people_per_year":142000,"stat_ids":["paths.govt.gate_qualified.2025","paths.govt.gate_appeared.2025","paths.higher.indian_students_germany.ws2025_26","paths.higher.cat_appeared.2025"],"caveat":"This is the number who qualified GATE, not seats; IIT, IISc and NIT M.Tech seats are a small fraction of it and no seat stat is recorded. The Germany figure (69,816 Indian students) is total enrolment, not annual intake. CAT appearance (2.58 lakh) is competition, not seats. Overall the door is steady in count but moving in direction: US inflow is falling, Germany and domestic M.Tech are rising."},"pay_band":{"low_lpa":4,"high_lpa":15,"stat_ids":["demand.fresher_ctc.bands.2026","demand.it_services.fresher_ctc.tcs"],"note":"This is what you earn after, not during. An IIT or IISc M.Tech lands GCC and product bands (8 to 15) for those with a strong project; a tier-2 M.Tech without one lands near the IT-services fresher band. No stat is recorded for post-master's pay in Germany or Ireland, or for post-MBA pay; treat agent claims of those numbers as unverified."},"branches":{"CS":3,"IT":2,"ECE":3,"EE":3,"MECH":2,"CIVIL":2,"CHEM":2,"OTHER":1},"tiers_realistic":{"tier1":"Yes; this is where most tier-1 graduates who do not take a job go. The risk for you is different: doing an M.Tech to postpone a weak job market. Even IIT brands left 38 percent of the 2024 batch unplaced, so the degree alone is not the plan; the thesis project and the lab you join are.","tier2":"Yes, and GATE is the great equaliser: an IIT or IISc M.Tech via GATE rebrands a tier-2 degree completely. For Germany, public universities admit on marks and course match, not college name; APS verification treats all AICTE degrees the same. The substitute for brand is a GATE rank under about two thousand in your paper, or a first-class degree with a research-style project for Germany.","tier3":"Yes for domestic M.Tech via GATE (NITs through CCMT, IITs through COAP if the rank allows) and yes for Germany if your percentage is above the course cut-off and you can fund the blocked account. Honest warning: a master's from an unknown Indian private college adds nothing; a master's abroad without a job outcome in that country adds debt. Do it only with a named lab, a funded programme, or a clear job market at the other end."},"entry_requirements":["M.Tech at IIT, IISc, NIT: a valid GATE score in the matching paper (IISc: 100 percent GATE for CS, Civil, Aerospace, Materials, Signal Processing; 70 percent GATE plus interview or written test for EE, ME, AI, Chemical); then COAP (IITs, IISc) or CCMT (NITs, IIITs) counselling rounds","Germany: bachelor's marks above the programme cut-off (typically first class or CGPA 7 plus for TU9), APS certificate for Indian applicants (apply February to March for a winter intake; allow 8 to 12 weeks), uni-assist VPD where the university uses it, IELTS 6.5 or TOEFL for English-taught courses, German A1 to B1 improves part-time work and internships, blocked account of roughly one year's living cost","Ireland: 60 to 65 percent or a 2:1-equivalent bachelor's, IELTS 6.5, September main intake with some January intakes; two-year post-study stay-back for master's graduates","US MS: GRE optional at many programmes but a funded offer (TA, RA or fellowship) is now the entry requirement in practice, because 61 percent of Indian F-1 applications were refused in 2025 and unfunded students carry the highest visa and debt risk","MBA via CAT: CAT percentile in the high 90s for IIMs; work experience helps in interviews; engineers face heavier competition from non-engineers at the top scores now","For every route: a research-style or product-style project you can defend, because M.Tech lab admission, German university selection and MBA interviews all probe it","Financial runway: at least 12 months for domestic M.Tech (stipend covers living but not the wait), 18 to 24 months of savings or family support for abroad"],"two_year_plan":[{"block":"H1","title":"Choose the route with a job outcome, and prepare the entry exam","learn":["Decide by outcome, not by brand: M.Tech via GATE for domestic core, VLSI, AI or research roles; Germany for engineering roles in mechanical, automotive, electrical, energy and CS with a path to a German work visa; Ireland for CS, data and pharma-adjacent roles with the two-year stay-back; US MS only with a funded offer; MBA via CAT for the ops, sales-engineering and product-management track","GATE syllabus for your paper (registration for GATE 2027 ran 2 to 27 September 2026 under IIT Madras; exam 6 to 21 February 2027); engineering maths and aptitude first","Germany track in parallel: German A1 (three months of daily practice), shortlist eight to twelve English-taught programmes on DAAD's database, note which use uni-assist and which take direct applications, and start APS document collection","CAT track: quant, verbal and data interpretation practice from September; CAT 2026 notified 25 July 2026 by IIM Indore with the exam at the end of November"],"build":["A route comparison sheet: cost, funding, duration, language, visa refusal risk, and the job you expect at the end, with a source for each cell","The first version of the research-style project below, because every route will ask about it"],"evidence":["GATE 2027 registered; or DAAD shortlist plus APS application filed; or CAT 2026 registered","A written 'when NOT to do it' check answered honestly: no runway, no funded offer, and no named job market at the end means you do not go this year"],"target":["GATE 2027","DAAD India programme database","APS India","CAT 2026 (IIM Indore)"]},{"block":"H2","title":"Sit the exam, apply, secure funding","learn":["GATE: weekly full mocks from November, PYQ accuracy tracked by subject; target a rank that clears IISc and old-IIT cut-offs in your paper, otherwise plan for NITs via CCMT","Germany: uni-assist deadlines are often 15 July for winter intake but many programmes close earlier (RWTH Aachen: 1 March for non-EU applicants to open-admission master's); submit at least eight weeks before; German A2","US: apply only to programmes where you have written contact with a professor about RA or TA funding; if no funded offer by April, drop the US for this cycle","MBA: CAT in late November; then IIM and other B-school interview preparation (your engineering project, current affairs, why MBA)"],"build":["Complete the research-style project to a written report with reproducible results, ready to attach to German applications and to discuss in COAP interviews","Statement of purpose and CV in the German format (Lebenslauf) and the IIT lab-application format"],"evidence":["GATE 2027 score (March 2027); German applications submitted with APS and VPD; CAT 2026 percentile; any funded US offer in writing","Project report public on GitHub or a personal page with data and code"],"target":["IISc","IIT Bombay and other IITs via COAP","NITs via CCMT","RWTH Aachen, TU Munich, other TU9 and universities of applied sciences","Irish universities September intake","IIMs"]},{"block":"H3","title":"Admission rounds, visa, and the exit test","learn":["COAP rounds (IIT Roorkee organising for 2026-27) and CCMT rounds run April to July: understand accept-and-wait versus accept-and-freeze, and the fellowship categories (TA, TAP, RA, RAP at IIT Bombay)","Germany: admission letters arrive May to August; open the blocked account, buy travel health insurance, book the visa appointment by mid-August at the latest","Ireland: offer, deposit, then the visa with proof of funds; check the university's Indian scholarship (fee reductions exist for taught master's)","The exit test: if you hold no admission with a clear job outcome by July, take the fallback job now and re-apply next year from employment; do not take an unfunded or unknown-college admission just to be a student"],"build":["A first-semester plan for the programme you accepted: which lab, which elective cluster, which internship window","For Germany or Ireland: a part-time work and internship search plan (HiWi student assistant roles, Werkstudent positions) starting the month you land"],"evidence":["An accepted admission with funding or a costed plan, and a visa; or a documented decision to defer and a job offer in the fallback path","Contact with at least two current students or alumni of the programme, with notes on placement reality"],"target":["COAP","CCMT","German consulate visa appointment","Irish university international office"]},{"block":"H4","title":"First year of the programme, aimed at the job at the end","learn":["M.Tech: choose the thesis lab in the first semester, not the third; pick a supervisor with industry links in your target (semiconductor, EV, AI, energy)","Germany: B1 German by the end of year one; a Werkstudent role in a company that sponsors; the master's thesis in industry is the standard route to a German engineering job","Ireland: internship in the summer between semesters; Critical Skills Employment Permit roles are the target after the stay-back","MBA: summer internship in operations, sales engineering or product at a manufacturing, energy, fintech or SaaS company; that internship converts to the placement"],"build":["Thesis or capstone with a real dataset or hardware; publish a workshop paper or an open-source artefact","A portfolio page with the project, the thesis abstract and code, in English and (for Germany) a German one-paragraph summary"],"evidence":["Named supervisor and thesis topic; an internship or Werkstudent contract; a conference or open-source artefact","Placement pipeline started 12 months before graduation with named companies"],"target":["Thesis labs at IITs and IISc","German industry thesis hosts","Irish employers with Critical Skills permits","IIM placement companies in ops and product"]}],"evidenced_project_spec":{"title":"A reproducible research-style study in your branch, with a written report and code","scope":"One question, one dataset or one test rig, one method, one honest result, in eight to twelve weeks. Examples: Mechanical, fatigue-life prediction of a 3D-printed bracket from a public dataset versus a physics model; Electrical, forecasting rooftop-solar output for a district from public weather and generation data and quantifying the error; ECE, characterising a low-cost SDR receiver's noise figure and comparing to datasheet; CS, evaluating three retrieval-augmented question-answering set-ups on a domain corpus with a held-out test set; Civil, comparing two pavement deterioration models against a state PWD road-condition dataset; Chemical, kinetics fit for a published reaction dataset with uncertainty. The deliverable is a report in the format of a workshop paper: abstract, method, results, limitations.","domain":"Your branch's research domain, chosen to match the lab or programme you are applying to","agent_use":"A research agent runs the literature search and summarises ten to fifteen papers with citations that you then read yourself. A coding agent writes the data pipeline, the experiment harness and the plots, and drafts the report sections from your notes. You write the research question, choose the method, decide the baselines, and sign off every claim. Keep an agent log of what was generated and what you changed, because a German or IIT supervisor will ask what was yours.","done_looks_like":"A six to ten page report, a repository that reproduces every figure from raw data with one command, a one-page limitations section that names what would break the result, and a 20-minute talk you can give without notes. The report is attached to your German applications and cited in your COAP or lab email.","verification":"Reproducibility: a friend clones the repository and regenerates the figures. Faculty review: one professor reads it and signs a one-line note. External check: submit to a student conference, a college research day, or an arXiv-style preprint server and record the feedback. Interview test: a 30-minute mock defence in which you answer 'why this baseline' and 'what would change the conclusion' for every figure."},"ai_task_shift":[{"task_2019":"Literature review by reading fifty papers over a month","now":"A research agent summarises and cross-references papers in an hour","human_owns":"Choosing the question worth asking, judging which summary is wrong, and reading the five papers that matter line by line"},{"task_2019":"Writing data pipelines, simulation scripts and plotting code for the thesis","now":"Coding agents write and debug most of it from a description","human_owns":"Experimental design, baselines, statistics, and the honesty of the limitations section; supervisors now grade this, not code volume"},{"task_2019":"GATE and CAT coaching classes as the main preparation channel","now":"AI tutors explain any problem on demand and generate unlimited practice","human_owns":"Timed, unassisted exam performance; the exam itself is unchanged"},{"task_2019":"Drafting statements of purpose and applications with a consultant","now":"Agents draft SOPs and format applications; admissions committees see thousands of similar drafts","human_owns":"A specific, verifiable project story that only you can tell, and direct contact with a professor"},{"task_2019":"Entry-level research assistant work: cleaning data, running standard analyses, reporting","now":"Largely automated in labs and companies; this is why unfunded master's degrees without a thesis are worth less","human_owns":"Problem framing, physical experiments, hardware, field data, and the judgement to stop a wrong line of work"},{"task_2019":"Post-master's entry jobs in the US for international graduates (analyst, junior engineer)","now":"New-grad hiring at large US tech firms is well below 2019 and visa refusals for Indians are at 61 percent","human_owns":"Choosing a country and programme where the graduate job market and visa path actually exist: Germany, Ireland, domestic"}],"fallback_path_id":"government_psu","employers":[{"name":"GATE 2027 (IIT Madras, for the National Coordination Board; GATE 2026 was conducted by IIT Guwahati)","type":"exam","location":"All India, computer-based","roles":"The score for M.Tech admission at IITs, IISc, NITs and IIITs, and for PSU intake; registration 2 to 27 September 2026 (late fee to 5 October 2026), exam 6, 7, 13, 14, 20 and 21 February 2027","fresher":true,"source_url":"https://testbook.com/news/gate-2027-official-website/","seen_on":"2026-09"},{"name":"Indian Institute of Science (IISc), Bengaluru","type":"company","location":"Bengaluru","roles":"M.Tech and M.Des with a valid GATE score as on 1 August 2026; 100 percent GATE for CS, Civil, Aerospace, Materials and Signal Processing; GATE plus interview or written test for EE, ME, AI, Chemical, Computational and Data Sciences","fresher":true,"source_url":"https://www.iisc.ac.in/admissions/m-tech-m-des/","seen_on":"2026-09"},{"name":"IIT Bombay (and other IITs via COAP)","type":"company","location":"Mumbai; COAP covers all IITs and IISc","roles":"M.Tech with TA, TAP, RA and RAP support categories; applications closed 10 April 2026 for 2026-27; offers through the Common Offer Acceptance Portal organised by IIT Roorkee for this cycle","fresher":true,"source_url":"https://acad.iitb.ac.in/admissions/masters/mtech","seen_on":"2026-09"},{"name":"CCMT 2026 (NITs, IIITs and centrally funded institutes M.Tech counselling)","type":"scheme","location":"All India","roles":"Centralised GATE-score counselling for M.Tech at NITs and IIITs; registration and seat-allotment rounds announced for 2026 with a special round for vacant seats","fresher":true,"source_url":"https://www.shiksha.com/engineering/ccmt-counselling-dates","seen_on":"2026-09"},{"name":"DAAD India (German Academic Exchange Service)","type":"scheme","location":"New Delhi, with information sessions online and across India","roles":"Scholarship information, the programme database for English-taught master's, and regular 'Masters in Germany' web sessions (June 2026); the first stop for the Germany route","fresher":true,"source_url":"https://www.daad.in/en/","seen_on":"2026-06"},{"name":"uni-assist (application service used by many German universities)","type":"scheme","location":"Berlin; online","roles":"Document evaluation (VPD) for international applicants; winter-semester deadlines often 15 July with many programmes earlier; apply at least eight weeks before; page updated 14 September 2026","fresher":true,"source_url":"https://www.uni-assist.de/en/how-to-apply/plan-your-application/deadlines-processing-time/","seen_on":"2026-09"},{"name":"RWTH Aachen University (example of a TU9 German university)","type":"company","location":"Aachen, Germany","roles":"English-taught engineering master's; non-EU deadlines 1 March (winter) and 1 September (summer) for open-admission programmes, 15 July and 15 January for restricted ones; online application via RWTHonline","fresher":true,"source_url":"https://www.rwth-aachen.de/cms/root/studium/vor-dem-studium/bewerbung-um-einen-studienplatz/master-bewerbung/~dqml/bewerbung-master-internationale/?lidx=1","seen_on":"2026-09"},{"name":"Irish universities (Trinity College Dublin, UCD, UCC, University of Galway, University of Limerick, DCU, TU Dublin)","type":"company","location":"Ireland","roles":"Taught MSc and MEng programmes; September main intake (applications open October to November 2026) and January intakes at several universities; Indian-student fee reductions at some STEM faculties","fresher":true,"source_url":"https://www.aeccglobal.com/study-in-ireland/upcoming-intakes","seen_on":"2026-04"},{"name":"CAT 2026 (IIM Indore) and the IIMs","type":"exam","location":"All India, computer-based","roles":"Entrance to IIM and other MBA programmes for the operations, sales-engineering, product and general-management track; notification released 25 July 2026, exam at the end of November 2026","fresher":true,"source_url":"https://www.shiksha.com/mba/cat-exam-notification","seen_on":"2026-07"}],"fit_rules":[{"field":"runway_months","value":"0_3","score":-3,"reason":"Every route here costs a year or more before any income; without runway you will drop out or take on debt you cannot service."},{"field":"runway_months","value":"12_plus","score":2,"reason":"You can afford a domestic M.Tech (stipend covers living) or the application year for Germany."},{"field":"priority","value":"income_now","score":-3,"reason":"Higher studies delay income by one to two years; this path is the opposite of what you asked for."},{"field":"priority","value":"abroad","score":3,"reason":"Germany and Ireland are the realistic study-to-work routes now; the US only with funding."},{"field":"relocation","value":"abroad_ok","score":2,"reason":"Being willing to move abroad opens the Germany and Ireland routes, where the door is growing."},{"field":"relocation","value":"hometown_only","score":-2,"reason":"Every good programme requires moving; a local private-college M.Tech adds little."},{"field":"interests","value":"research_theory","score":3,"reason":"A thesis-based M.Tech or research master's is the one path built around deep study."},{"field":"enjoyed","value":"maths_analysis","score":2,"reason":"GATE, CAT and thesis work all reward analytical strength."},{"field":"enjoyed","value":"exams_theory","score":2,"reason":"Entry to IITs, IISc, NITs and IIMs is decided by GATE and CAT."},{"field":"preparation","value":"gate_prep","score":2,"reason":"GATE preparation already done feeds directly into M.Tech admission via COAP and CCMT."},{"field":"preparation","value":"projects_portfolio","score":1,"reason":"A shipped project strengthens German applications and IIT lab selection."},{"field":"college_tier","value":"3","score":1,"reason":"An M.Tech from an IIT, IISc or NIT via GATE, or a German public university, replaces a weak college brand completely."},{"field":"college_tier","value":"1","score":0,"reason":"You already have the brand; do a master's only for a research or abroad goal, not to postpone job search."},{"field":"graduation_year","value":"2027","score":1,"reason":"You can sit GATE 2027 in final year and enter M.Tech directly, or apply to Germany for winter 2027 without a gap."},{"field":"graduation_year","value":"2028_or_later","score":1,"reason":"Time to build the research-style project and German language before applying."},{"field":"branch","value":"CS","score":1,"reason":"CS M.Tech at IITs and IISc and CS master's in Germany and Ireland have the strongest job outcomes."},{"field":"branch","value":"ECE","score":1,"reason":"VLSI and signal-processing M.Tech at IITs and IISc is the main route into design roles at semiconductor firms."},{"field":"branch","value":"MECH","score":1,"reason":"Germany's automotive and manufacturing master's programmes are the strongest abroad route for mechanical graduates."},{"field":"interests","value":"people_business","score":1,"reason":"The MBA via CAT route into operations and sales-engineering suits this interest."},{"field":"priority","value":"stability","score":-1,"reason":"A master's does not itself give stability; if security is the goal, the government_psu path is more direct."}],"base_score":4,"stat_ids_used":["paths.govt.gate_qualified.2025","paths.govt.gate_appeared.2025","paths.higher.indian_students_germany.ws2025_26","paths.higher.cat_appeared.2025","paths.higher.us_f1_refusal_rate_indians.2025","demand.fresher_ctc.bands.2026","demand.it_services.fresher_ctc.tcs","supply.iit.unplaced_share.2024","demand.signalfire.new_grad_hiring_big_tech_vs_2019"],"last_reviewed":"2026-09-21","changed_fields":["all"]},{"id":"infrastructure_energy","name":"Infrastructure and energy","tagline":"Steady, large door, but most new jobs are technician-level; graduate seats sit at EPCs and PSUs","door_state":"steady","door_size":{"people_per_year":null,"stat_ids":["paths.energy.clean_energy_jobs_2030","paths.govt.psu_via_gate_examples.2026","demand.naukri.jobspeak.fresher_yoy.aug2026"],"caveat":"No stat counts graduate engineer hires per year. CEEW projects 44 lakh clean-energy jobs by 2030, but about 43% are rooftop solar and mostly technician-level; PSU engineer intake via GATE is in the hundreds per company (NTPC about 500, NPCIL 330); EPC GET intake is unpublished. Non-IT sectors are driving fresher hiring growth in 2026."},"pay_band":{"low_lpa":3,"high_lpa":8,"stat_ids":["paths.infra.fresher_ctc_bands.2026"],"note":"Private EPC GETs earn 3 to 6; PSU executive trainees (NTPC, Power Grid, NHAI) earn 5 to 8 with allowances on top; site roles add hardship and site allowances that are not in the CTC figure."},"branches":{"CS":0,"IT":0,"ECE":1,"EE":3,"MECH":2,"CIVIL":3,"CHEM":1,"OTHER":1},"tiers_realistic":{"tier1":"Yes. L&T, Tata Projects and Afcons run campus GET drives at NITs and top state colleges; NHIDCL associate posts are restricted to IIT, NIT and top-100 NIRF colleges; PSUs via GATE are brand-blind.","tier2":"Yes. L&T visits over a hundred and fifty campuses, and PSU trainee posts (NTPC, Power Grid) are decided by GATE score, not college. Solar EPCs and IPPs (ReNew, Adani Green, Tata Power) take tier-2 GETs with a PVsyst or ETAP portfolio.","tier3":"Yes, more than most paths. Site engineering is short of people who will actually go to site, and the GATE route to PSUs is open to everyone. What substitutes for the brand is a site internship or a Power Grid or NTPC graduate apprenticeship under NATS, a STAAD or ETAP or PVsyst portfolio, and a GATE score. The trap is stopping at diploma-level site supervisor work at a subcontractor; aim for the EPC or PSU payroll."},"entry_requirements":["B.E./B.Tech in Civil, Electrical, Mechanical or (for solar and grid) EEE or Electronics; PSU notices ask for 60 to 65% aggregate and an age limit around 28 to 30","A valid GATE score for NTPC, Power Grid, NHAI and other PSU trainee posts; EPC campus drives use their own online tests","Tool skill that recruiters name in postings: AutoCAD, STAAD.Pro, Revit or BIM for civil; ETAP for electrical; Primavera P6 or MS Project for planning; PVsyst for solar design","Site exposure: an internship or NATS apprenticeship where you handled a bar-bending schedule, a pour, a cable pull or a substation test","Basic quantity estimation and billing (BOQ, measurement book) because most fresher EPC roles are site or planning engineer","Willingness to live at remote project sites for the first years and to move between projects"],"two_year_plan":[{"block":"H1","title":"Core tools and a site internship","learn":["NPTEL: Construction Planning and Management, Design of RC Structures (civil) or Power System Analysis and Electrical Machines (electrical); free with an optional exam","AutoCAD to a drafting standard (free student licence); STAAD.Pro or ETAP student or trial versions; PVsyst demo for solar sizing","Reading drawings and BOQs: get a set of GFC drawings from a college project or a public tender and take off quantities by hand","Register on the NATS portal so Power Grid, NTPC and state utilities' graduate apprentice notices are open to you"],"build":["Civil: a STAAD model of a small RC building or a steel pipe rack with a design check and a bar-bending schedule; Electrical: an ETAP model of a small industrial substation with load flow and short-circuit results","A Primavera or MS Project schedule for that same job with a critical path and a resource histogram"],"evidence":["A folder with drawings, model files, calculation sheets and a two-page design note","A one-month site internship at any contractor, documented with photos and a daily log"],"target":["Summer internship at a local contractor, a state PWD or discom, or an L&T or Tata Projects site","Power Grid graduate apprentice notices (Electrical and Civil, regions across India)"]},{"block":"H2","title":"GATE and a real project workflow","learn":["GATE for your paper (CE, EE or ME) with a fixed daily schedule; the same score serves NTPC, Power Grid, NHAI and other PSUs","Revit basics and what BIM means on a metro or building job; Autodesk offers free student access","Solar plant design: irradiation data, tilt, string sizing, inverter selection and losses in PVsyst; Skill India or NISE short courses for solar are free or cheap","Site safety and quality: IS codes you will actually be asked about (IS 456, IS 800 for civil; IS 3043 earthing and IE Rules for electrical)"],"build":["A solar plant of a few megawatts designed end to end in PVsyst with a single-line diagram in AutoCAD and a cable schedule","A quantity take-off and cost estimate for a small road or building package using a public schedule of rates"],"evidence":["GATE score card (February exam)","The PVsyst report and cost estimate published with assumptions listed"],"target":["NTPC Engineering Executive Trainee (applications around February) and Power Grid Engineer Trainee via GATE","NHIDCL associate (civil, July notice, top-100 NIRF only) if eligible","ReNew and Adani Green GET drives"]},{"block":"H3","title":"Apprenticeship or GET, and planning skill","learn":["On the job: measurement book, RA bills, subcontractor management and daily progress reporting; this is what a site engineer does all day","Primavera P6 properly: WBS, baselines, earned value, delay analysis; the planning engineer role is the fastest route off the site and into the office","How to use a coding agent to build spreadsheet and Python tools for quantity tracking, and a research agent to summarise IS codes, checking each clause against the code"],"build":["A progress-tracking dashboard for your site or apprenticeship that pulls from daily reports and shows planned versus actual","The evidenced project below, using your site's real data where permitted"],"evidence":["NATS apprenticeship (Power Grid, NTPC or a state utility at the NATS graduate stipend of Rs 12,300 a month or higher) or an EPC GET offer","A planning or QS deliverable your site actually used"],"target":["L&T Construction GET (campus route) and Afcons GET","Metro corporations' junior engineer and graduate engineer notices (Maha Metro, BMRCL, CMRL) where fresh entry is allowed","Tata Power and ReNew GET programmes"]},{"block":"H4","title":"Convert and specialise","learn":["Choose a specialisation with a labour shortage: BIM coordination, solar or wind O&M, transmission line design, metro systems, or planning and contracts","Contracts basics (FIDIC clauses, EPC contract structure) because claims and variations decide project money","PMP or CAPM later, after two to three years of site time; not before, employers discount it on a fresher CV"],"build":["A second version of the evidenced project with a colleague's review incorporated","A short case write-up of one site problem you solved (a delay, a rework, a safety near miss) with numbers"],"evidence":["A permanent role at an EPC, IPP or PSU, or a second GATE attempt with a higher score","Portfolio site listing STAAD, ETAP, PVsyst, Primavera and site work with the write-ups"],"target":["PSU trainee posts on the new GATE score","Adani Green, ReNew and Tata Power site and O&M roles","Metro and highway project offices"]}],"evidenced_project_spec":{"title":"Ground-mounted solar plant of a few megawatts: complete design, cost, schedule and grid-connection study for a real plot","scope":"Pick a real plot (from a state land bank or a public tender), design the plant end to end: PVsyst energy yield with losses, module and string layout in AutoCAD, structure design in STAAD for the local wind zone, inverter and transformer sizing, single-line diagram and cable schedule, ETAP load-flow and short-circuit study at the point of connection, a BOQ priced from public schedule of rates and vendor quotes, and a Primavera schedule with a critical path. Close with a one-page tariff calculation and the three biggest risks.","domain":"Utility-scale solar EPC and IPP work, where Sterling and Wilson, Tata Power, ReNew and Adani Green hire site, design and planning engineers, and where the CEEW jobs projection is concentrated.","agent_use":"A coding agent writes the Python that turns the PVsyst hourly output into a cash-flow and tariff model and builds the BOQ spreadsheet from the layout; a research agent summarises CEA grid-connection requirements, MNRE guidelines and the relevant IS codes into a checklist. Every summarised clause is checked against the source document, and every agent-generated formula is cross-checked with a hand calculation for one string, one cable and one footing; the prompts and corrections are kept in the project folder so an interviewer can see what the agent got wrong.","done_looks_like":"A design report with drawings, models, calculation sheets, BOQ, schedule and grid study that a senior engineer at a solar EPC could review in an hour; every number traceable to an input; a thirty-minute walkthrough you can give from the drawings alone.","verification":"Hand checks on one string voltage window, one cable voltage drop, one footing uplift; PVsyst yield compared against a published plant of similar size in the same state; ETAP results sanity-checked against fault-level data from the state utility; a practising engineer or a faculty member reviews and signs a one-page critique that you include unedited."},"ai_task_shift":[{"task_2019":"Drafting drawings and preparing BOQs by hand from drawings","now":"BIM tools and agents generate drawings, quantities and BOQs from the model; agents draft schedules of rates comparisons","human_owns":"Site verification of quantities, the measurement book, and the bill certification signature"},{"task_2019":"Standard structural and electrical calculations (beam design, cable sizing, load flow set-up)","now":"Agents set up STAAD and ETAP cases and produce first-pass calculation sheets","human_owns":"Load assumptions from site conditions, code interpretation, and the design sign-off that carries liability"},{"task_2019":"Building and updating Primavera schedules and progress reports","now":"Agents draft schedules from the WBS and write the weekly report from daily logs","human_owns":"Knowing what actually happened on site, the delay conversation with the subcontractor, and the claim decision"},{"task_2019":"Solar yield studies and tender documentation","now":"Agents run PVsyst variants and draft tender responses","human_owns":"Site visit, shading and soil reality, the bid price, and the safety plan"},{"task_2019":"Writing method statements, safety plans and quality checklists","now":"Agents draft them from templates and the drawings","human_owns":"The toolbox talk, the permit to work, the pour or cable-pull itself, and stopping unsafe work"},{"task_2019":"Summarising IS codes and contract clauses for a query","now":"Research agents answer code and contract questions in seconds","human_owns":"Checking the clause, the client and authority negotiation, and requirements that only exist on site"}],"fallback_path_id":"government_psu","employers":[{"name":"L&T Construction (Larsen & Toubro)","type":"company","location":"Chennai HQ; sites across India and the Gulf","roles":"Graduate Engineer Trainee and Post-Graduate Engineer Trainee through campus recruitment at over a hundred and fifty campuses, with one-year rotation; Diploma Engineer Trainee programme runs separately","fresher":true,"source_url":"https://www.larsentoubro.com/corporate/careers/campus-recruitment","seen_on":"2026-09"},{"name":"Afcons Infrastructure","type":"company","location":"Mumbai HQ; marine, metro, tunnel and bridge sites across India and abroad","roles":"Graduate Engineer Trainee via campus; off-campus postings are mostly experienced site and planning engineers","fresher":true,"source_url":"https://careers.afcons.com/","seen_on":"2026-09"},{"name":"NHIDCL (with NHAI deputy manager posts via GATE)","type":"exam","location":"North-East, J&K, Ladakh, Uttarakhand, Andaman","roles":"Associate (Civil) contract posts for 0 to 2 years' experience from IIT, NIT or top-100 NIRF colleges, July 2026 notice; NHAI Deputy Manager (Technical) via GATE Civil runs in January","fresher":true,"source_url":"https://www.pw.live/gate/exams/nhidcl-recruitment-2026","seen_on":"2026-07"},{"name":"Maharashtra Metro (and other metro corporations: DMRC, BMRCL, CMRL)","type":"exam","location":"Nagpur, Pune; Delhi, Bengaluru, Chennai for the others","roles":"Junior Engineer (Civil, Electrical, Rolling Stock, S&T) contract posts, August 2026 notice; many metro JE posts ask for experience, so watch for the graduate engineer notices that allow fresh entry","fresher":true,"source_url":"https://rightjobalert.com/maha-metro-recruitment/","seen_on":"2026-08"},{"name":"NTPC","type":"exam","location":"Plants and projects across India","roles":"Engineering Executive Trainee via GATE in Civil, Mechanical, Electrical, Electronics, Instrumentation and CS; advance notice for the GATE 2027 cycle issued; deputy manager posts for experienced engineers","fresher":true,"source_url":"https://www.sarkarijobs.com/ntpc-recruitment/","seen_on":"2026-09"},{"name":"Power Grid Corporation of India (PGCIL)","type":"exam","location":"Regions across India","roles":"Engineer Trainee via GATE (Electrical, Electronics, Civil, CS) and graduate apprentices under NATS in Electrical and Civil, August 2026 notice with monthly stipend","fresher":true,"source_url":"https://www.adda247.com/engineering-jobs/pgcil-apprentice-recruitment-2026/","seen_on":"2026-08"},{"name":"ReNew","type":"company","location":"Gurugram HQ; solar and wind sites in Rajasthan, Gujarat, Karnataka, Maharashtra","roles":"Graduate Engineer Trainee with the GOLD programme (bootcamps at NISE and NIWE), diploma engineer intake, and the Global Green Scholars internship","fresher":true,"source_url":"https://www.renew.com/renew-early-careers-programs/programs-in-detail","seen_on":"2026-09"},{"name":"Adani Green Energy (and Adani group GET drives)","type":"company","location":"Ahmedabad HQ; Khavda and other solar and wind sites","roles":"Site and O&M engineers via careers portal and CV submission; group-level GET drives in 2026 were for technology roles in Ahmedabad","fresher":true,"source_url":"https://www.adanigreenenergy.com/careers","seen_on":"2026-09"},{"name":"Tata Power","type":"company","location":"Mumbai, Delhi, Odisha discoms; renewable sites","roles":"Graduate Engineer Trainee (Electrical) through the careers portal and TCS iON tests, plus internships; freshers section on the career compass page","fresher":true,"source_url":"https://www.tatapower.com/career-compass","seen_on":"2026-09"}],"fit_rules":[{"field":"branch","value":"CIVIL","score":3,"reason":"Civil is the main intake for EPC, highway, metro and NHIDCL roles, and the largest branch in NTPC and Power Grid civil posts."},{"field":"branch","value":"EE","score":3,"reason":"Electrical is what Power Grid, discoms, solar EPCs and NTPC electrical posts ask for."},{"field":"branch","value":"MECH","score":2,"reason":"Mechanical enters through NTPC, plant erection and O&M, and wind projects."},{"field":"branch","value":"ECE","score":1,"reason":"Metro signalling, substation automation and Power Grid electronics posts take ECE, but the seats are few."},{"field":"branch","value":"CS","score":-3,"reason":"Almost no infrastructure or energy fresher notice lists CS or IT; the software path is the better use of a CS degree."},{"field":"branch","value":"IT","score":-3,"reason":"Almost no infrastructure or energy fresher notice lists IT."},{"field":"interests","value":"physical_systems","score":2,"reason":"Structures, grids and plants are physical systems built on site."},{"field":"interests","value":"building_software","score":-2,"reason":"Software here is a tool (STAAD, ETAP, Primavera), not the product."},{"field":"enjoyed","value":"workshops_site","score":3,"reason":"Site is where the first years happen; liking site visits and machines is the best predictor of staying."},{"field":"enjoyed","value":"exams_theory","score":1,"reason":"The PSU route is a GATE exam, so exam ability opens NTPC, Power Grid and NHAI."},{"field":"preparation","value":"core_tools","score":2,"reason":"STAAD, AutoCAD, ETAP or Primavera already in hand is what postings name."},{"field":"preparation","value":"gate_prep","score":2,"reason":"GATE decides PSU trainee posts; preparation already started is a head start."},{"field":"preparation","value":"internship_done","score":2,"reason":"Site internship or apprenticeship is what EPC recruiters ask about first."},{"field":"relocation","value":"anywhere_india","score":2,"reason":"Projects are wherever the road, line or plant is; mobility is the job."},{"field":"relocation","value":"hometown_only","score":-3,"reason":"Site roles move every project; staying near home only works at a local discom or PWD."},{"field":"relocation","value":"within_state","score":-1,"reason":"Possible at a state discom, PWD or metro, but EPC and PSU postings cross states."},{"field":"priority","value":"stability","score":2,"reason":"PSU trainee posts and utility jobs are among the most stable engineering jobs in India."},{"field":"priority","value":"income_now","score":2,"reason":"Site engineer and apprentice roles are available quickly at tier-3, even if pay starts low; EPC firms and metro corporations run GET intakes every year and site roles start quickly."},{"field":"priority","value":"high_pay_growth","score":-2,"reason":"Fresher pay is modest and growth is by years on site, not by fast promotion."},{"field":"college_tier","value":"3","score":1,"reason":"This door is more open to tier-3 graduates than most, because site roles are short of people and the PSU route is brand-blind."}],"base_score":5,"stat_ids_used":["paths.energy.clean_energy_jobs_2030","paths.govt.psu_via_gate_examples.2026","demand.naukri.jobspeak.fresher_yoy.aug2026","paths.infra.fresher_ctc_bands.2026","paths.skilling.nats_graduate_stipend.2026"],"last_reviewed":"2026-09-21","changed_fields":["all"]},{"id":"it_services","name":"IT services (mass recruiters)","tagline":"Shrinking door: most fresher seats in India, but fewer each year and pay flat since 2008","door_state":"shrinking","door_size":{"people_per_year":100000,"stat_ids":["demand.tcs.freshers_added.fy26","demand.infosys.freshers.fy26","demand.cognizant.freshers.2025","demand.hcltech.freshers.fy26","demand.wipro.freshers.fy26","supply.teamlease.it_fresher_hiring.fy22","supply.teamlease.it_fresher_hiring.fy24"],"caveat":"Sum of five companies' own FY26 statements (TCS 44,000 trainees, Infosys 20,000, Cognizant 20,000, HCLTech 11,000, Wipro 7,500), rounded down; the industry took about 4 lakh freshers in FY22 and an estimated 1.6 lakh in FY24, so the door has roughly halved in four years and Wipro has no FY27 target at all."},"pay_band":{"low_lpa":3.1,"high_lpa":4.5,"stat_ids":["demand.it_services.fresher_ctc.tcs","demand.fresher_ctc.bands.2026"],"note":"TCS and Infosys base offers are around Rs 3.1 to 3.4 lakh and have not moved since about 2008; specialist tracks (Infosys DSE, TCS Digital and Prime, Cognizant GenC Next, Accenture AASE) pay roughly double for a small share who clear a harder coding test."},"branches":{"CS":3,"IT":3,"ECE":3,"EE":2,"MECH":2,"CIVIL":1,"CHEM":1,"OTHER":1},"tiers_realistic":{"tier1":"Yes, but most tier-1 graduates treat these offers as a floor; the specialist tracks (Rs 7 to 9 lakh) are where tier-1 candidates actually join.","tier2":"Yes; this is the core catchment. Campus drives still visit well-known state and private colleges, though intake per college has fallen and offer-to-joining gaps of 6 to 12 months are common.","tier3":"Yes, this remains the most realistic first job for a tier-3 graduate, through open tests (TCS NQT, Infosys off-campus, Cognizant GenC, Accenture ASE, Capgemini, Mphasis) rather than campus visits. What substitutes for the brand: a 60%+ academic record with no backlogs, a clear aptitude and basic coding test score, spoken English good enough for a client call, and one small deployed project. Be honest with yourself that seats are fewer each year (five firms' net headcount fell in FY26, demand.top5_it.net_headcount.fy26) and only 35% of IT employers intended to hire freshers in ISR 2026 (supply.isr2026.it_fresher_hiring_intent)."},"entry_requirements":["60% or 6.0 CGPA throughout (10th, 12th, degree) with no active backlogs; most mass recruiters hard-filter on this","Aptitude plus basic programming test (TCS NQT, Infosys InfyTQ-style, Cognizant GenC, Wipro NLTH, Accenture cognitive and coding assessment): arrays, strings, SQL queries, simple OOP in Java or Python","Spoken and written English at a level that passes a communication round; Accenture and Cognizant test this explicitly","One programming language to working level (Java or Python) plus SQL; for specialist tracks, LeetCode-easy DSA and a second language","Willingness to sign a service agreement and accept any base location and any project (banking, insurance, retail, telecom support are the usual first postings)","Increasingly: a certificate in cloud (AWS or Azure fundamentals) or a GenAI foundations badge; TCS reports 312,000 AI/ML-proficient staff (demand.tcs.ai_ml_proficient.q1fy27) and expects trainees to start at that baseline","Eligibility often limited to the current and previous two batches (2024 to 2026), so apply in the graduation year"],"two_year_plan":[{"block":"H1","title":"Clear the filters: aptitude, one language, SQL","learn":["Quantitative aptitude, logical reasoning and verbal ability: free resources (IndiaBIX, PrepInsta free tier, NPTEL 'Aptitude' lectures); 45 minutes a day","Java or Python to the level of writing a 50-line program from a problem statement without help; NPTEL 'Programming in Java' or CS50P","SQL basics through joins and group by on PostgreSQL or MySQL","TCS NQT syllabus and Infosys, Cognizant GenC, Accenture test patterns; register on TCS NextStep, Infosys Careers, Accenture India campus portal, Capgemini Students/Graduates and Mphasis campus pages in your final year"],"build":["A small Java or Python console application (library, billing or attendance) with a MySQL backend, on GitHub"],"evidence":["Timed mock test scores tracked weekly","One GitHub repo with README"],"target":["TCS NQT (open year-round)","Infosys off-campus","Cognizant GenC","Accenture ASE","Capgemini","Mphasis"]},{"block":"H2","title":"Aim for the specialist track, not just the base offer","learn":["DSA to LeetCode-easy plus some medium (100 problems): this is what separates Infosys DSE, TCS Digital and Prime, Cognizant GenC Next and Accenture AASE from the base offer","A cloud fundamentals certificate: AWS Cloud Practitioner (free training) or Azure AZ-900 via FutureSkills Prime at no cost","Spring Boot (Java) or Django/FastAPI (Python) basics; REST APIs; Git","GenAI foundations: how to call an LLM API, what RAG is, prompt basics; recruiters now ask for this even at base level"],"build":["A REST API with a database and a simple front end, deployed on a free tier, with an LLM-powered feature (for example, a support chatbot over the product's FAQ)"],"evidence":["Cloud certificate","Deployed URL and repo","TCS Digital or Infosys DSE test attempt"],"target":["TCS Digital and Prime via NQT","Infosys DSE and Specialist Programmer","Cognizant GenC Next and GenC Pro","Accenture AASE","Tech Mahindra campus drive (resumed July 2026)"]},{"block":"H3","title":"First posting: become useful fast, pick a domain","learn":["Whatever your training batch teaches (usually Java full stack, .NET, SAP, Salesforce, ServiceNow or testing): finish the internal certification in the first attempt","The client's domain: banking, insurance, retail or telecom; read the process documents nobody else reads","Agentic tooling used on the account (GitHub Copilot, internal assistants): learn to review AI-generated code and tests, because that review is the job now","If still waiting for a joining date: the same cloud and GenAI material, plus a NATS graduate apprenticeship (Rs 12,300 per month stipend, paths.skilling.nats_graduate_stipend.2026) rather than sitting idle"],"build":["One automation for your own team's repetitive work (a script, a dashboard, a test suite) and show it to your lead"],"evidence":["Internal certification","A written summary of what you automated and time saved"],"target":["Your own account's rotation to a development role","Internal specialist programmes"]},{"block":"H4","title":"Use the job as a base to move up or across","learn":["Choose one exit: (a) a specialist role inside (cloud, data engineering, SAP, cybersecurity) with the vendor certificate (AWS Solutions Architect Associate, Azure Data Engineer, SAP), or (b) the ai_native_software path with a portfolio built on evenings, or (c) a GCC role in the same domain","Interview preparation for GCCs: DSA medium, system design basics, domain questions"],"build":["The evidenced project below, built in the domain of your first posting, outside work hours and with no client data"],"evidence":["One vendor certificate","Evidenced project deployed and documented","Two years of appraisal ratings"],"target":["GCCs in your domain (banking or insurance captives)","Product companies via  OSATs (Tata Electronics, Micron Sanand, CG Semi, Kaynes) hire B.Tech ECE/EE from tier-2 colleges, usually through off-campus tests and their own training programmes; pay starts in the 4 to 6 band.","tier3":"Hard but not closed, and honesty matters here: about 1.6 lakh students enrol in ECE each year (supply.aicte.branch_enrolment.ece.2024_25) against a door of tens of thousands at most, so most tier-3 ECE graduates will not get a VLSI design job in two years. What substitutes for the brand: a C2S-supported college licence for Cadence or Synopsys tools with a finished RTL-to-GDS or verification project you can defend, a GATE ECE score (useful for M.Tech VLSI, ISRO and PSU routes), and a willingness to start in test, product engineering, DFT or fab/ATMP operations rather than front-end design. A paid VLSI training institute is not required; free NPTEL and C2S material plus a real project is a stronger signal than a certificate."},"entry_requirements":["Digital design fundamentals: combinational and sequential logic, FSMs, timing, CMOS basics; tested in every screening","Verilog or SystemVerilog to the level of writing and simulating a module (FIFO, UART, AXI-lite slave) with a testbench; open-source Icarus/Verilator or Cadence Xcelium via a C2S college licence","For verification roles (the largest fresher intake in design services): SystemVerilog and UVM basics, assertions, coverage","For back-end roles: static timing analysis, synthesis, place-and-route concepts, DFT basics (scan, ATPG, BIST) and familiarity with Synopsys or Cadence flows","For fab, ATMP and OSAT roles (Tata Electronics, Micron, CG Semi, Kaynes): semiconductor process basics, statistics and SPC, cleanroom discipline, shift work; Chemical and Mechanical graduates also enter here","Programming for scripting and automation: Python and TCL, plus Linux; C for embedded and post-silicon validation","M.Tech VLSI or a GATE ECE score for the higher-paying design houses; a 7+ CGPA filter at Qualcomm, NVIDIA, TI and Micron campus drives"],"two_year_plan":[{"block":"H1","title":"Digital design and Verilog, with free tools","learn":["NPTEL 'Digital Circuits' and 'Hardware Modeling using Verilog' (IIT Kharagpur, free)","Verilog and SystemVerilog basics on open-source tools: Icarus Verilog, Verilator, GTKWave; HDLBits for daily practice","Get access to your college's C2S (Chips to Startup) licences for Cadence or Synopsys; if your college is not on C2S, ask the ECE department to apply and use open-source OpenROAD and SkyWater 130 nm PDK meanwhile","Python and Linux shell for scripting; basics of TCL","Start GATE ECE preparation alongside (networks, signals, digital, EDC) since it opens M.Tech VLSI, ISRO and PSU doors"],"build":["A parameterised FIFO and a UART transmitter/receiver in Verilog with self-checking testbenches, on GitHub"],"evidence":["HDLBits progress","GitHub repos with waveforms in the README"],"target":["Nothing yet; use this half to decide between design/verification and fab/ATMP tracks based on what you enjoy"]},{"block":"H2","title":"Verification (UVM) or physical design; first RTL-to-GDS","learn":["SystemVerilog for verification and UVM: free Verification Academy (Siemens) courses, Doulos tutorials, ChipVerify","Synthesis and STA concepts: setup and hold, clock domains, constraints (SDC); NPTEL 'VLSI Physical Design' (IIT Kharagpur)","DFT basics: scan insertion, ATPG, BIST; read the Synopsys or Cadence DFT user guide sections your C2S licence covers","Complete an RTL-to-GDS flow once on OpenROAD/OpenLane with SkyWater 130 nm, then repeat on Cadence Genus/Innovus via C2S if available"],"build":["A UVM testbench for your UART or an AXI-lite peripheral with functional coverage and assertions","An RTL-to-GDS run of a small RISC-V core or your own design with timing closed and a DRC-clean layout"],"evidence":["Coverage report and bug list from the UVM project","GDS screenshot, timing report and area numbers in the README"],"target":["VLSI internships (summer):
